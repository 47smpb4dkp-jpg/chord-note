/* ---- 旧 Word（.doc / OLE2 複合文書）---- */
function readDocBuffer(arrayBuffer){
  const u8 = new Uint8Array(arrayBuffer);
  if (u8.length < 512) throw new Error('ファイルが小さすぎます');
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  // OLE2 の目印
  if (dv.getUint32(0, true) !== 0xE011CFD0 || dv.getUint32(4, true) !== 0xE11AB1A1)
    throw new Error('古い Word 形式ではありません');

  const sect = 1 << dv.getUint16(30, true);
  const dirStart = dv.getUint32(48, true);
  const fatCount = dv.getUint32(44, true);

  // FAT（セクタのつながり表）を組み立てる
  const fat = [];
  for (let i = 0; i < Math.min(fatCount, 109); i++){
    const sc = dv.getUint32(76 + i * 4, true);
    if (sc === 0xFFFFFFFF) break;
    const off = (sc + 1) * sect;
    if (off + sect > u8.length) break;
    for (let j = 0; j < sect; j += 4) fat.push(dv.getUint32(off + j, true));
  }
  const chain = s=>{
    const out = []; let c = s, g = 0;
    while (c !== 0xFFFFFFFE && c < fat.length && g++ < 200000){ out.push(c); c = fat[c]; }
    return out;
  };

  // ディレクトリから WordDocument を探す
  let wd = null;
  for (const sc of chain(dirStart)){
    const base = (sc + 1) * sect;
    for (let k = 0; k + 128 <= sect; k += 128){
      const o = base + k;
      if (o + 128 > u8.length) break;
      const nlen = dv.getUint16(o + 64, true);
      if (nlen < 2) continue;
      let name = '';
      for (let i = 0; i < nlen - 2; i += 2) name += String.fromCharCode(dv.getUint16(o + i, true));
      if (name === 'WordDocument'){
        wd = {start: dv.getUint32(o + 116, true), size: dv.getUint32(o + 120, true)};
      }
    }
    if (wd) break;
  }
  if (!wd || !wd.size) throw new Error('本文が見つかりません');

  // ストリームを連結
  const bytes = new Uint8Array(wd.size);
  let p = 0;
  for (const sc of chain(wd.start)){
    const off = (sc + 1) * sect;
    const n = Math.min(sect, wd.size - p);
    if (n <= 0) break;
    if (off + n > u8.length) break;
    bytes.set(u8.subarray(off, off + n), p);
    p += n;
  }
  const d2 = new DataView(bytes.buffer);
  const fcMin = d2.getUint32(24, true);
  const fcMac = d2.getUint32(28, true);
  const len = fcMac - fcMin;
  if (!(len > 0) || fcMin >= bytes.length) throw new Error('本文の位置を読めません');

  const tidy = t => t
    .replace(/[\r\x07\x0B\x0C]/g, '\n')
    .replace(/[\x00-\x08\x0E-\x1F]/g, '')
    .replace(/\u0013[^\u0014\u0015]*\u0014?/g, '')   // フィールドの指示部分
    .replace(/[\u0013\u0014\u0015]/g, '')
    .replace(/\n{3,}/g, '\n\n');
  // 文字化けは英数字だらけになるので、日本語の字を重く見る
  const score = t => {
    const cjk = (t.match(/[ぁ-んァ-ヶ一-龠ー、。]/g) || []).length;
    const lat = (t.match(/[A-Za-z]/g) || []).length;
    const bad = (t.match(/[\uFFFD\u0000-\u0008]/g) || []).length;
    return cjk * 4 + lat - bad * 6;
  };

  // 2バイト（UTF-16LE）として読む
  let a = '';
  for (let i = fcMin; i + 1 < Math.min(fcMin + len * 2, bytes.length); i += 2){
    const c = bytes[i] | (bytes[i+1] << 8);
    if (c === 9) a += '\t'; else if (c >= 10) a += String.fromCharCode(c);
  }
  a = tidy(a);

  // 1バイト（Shift-JIS）として読む
  let b = '';
  try{
    const slice = bytes.subarray(fcMin, Math.min(fcMin + len, bytes.length));
    b = tidy(new TextDecoder('shift-jis', {fatal:false}).decode(slice));
  }catch(e){ b = ''; }

  const best = score(a) >= score(b) ? a : b;
  if (!score(best)) throw new Error('文字を取り出せませんでした');
  return best;
}

async function readDoc(file){
  return readDocBuffer(await file.arrayBuffer());
}

// 中身が旧 Word 形式かどうか（拡張子があてにならないので先頭を見る）
async function isOle2(file){
  try{
    const head = new Uint8Array(await file.slice(0, 8).arrayBuffer());
    return head[0]===0xD0 && head[1]===0xCF && head[2]===0x11 && head[3]===0xE0;
  }catch(e){ return false; }
}

// XML の実体参照をもとの文字に戻す
function xmlUnescape(t){
  return t.replace(/&#x([0-9a-fA-F]+);/g, (m,h)=>String.fromCodePoint(parseInt(h,16)))
          .replace(/&#(\d+);/g, (m,d)=>String.fromCodePoint(+d))
          .replace(/&lt;/g,'<').replace(/&gt;/g,'>')
          .replace(/&quot;/g,'"').replace(/&apos;/g,"'")
          .replace(/&amp;/g,'&');
}

// .docx は ZIP を展開して word/document.xml から段落を取り出す
async function readDocx(file){
  if (typeof JSZip === 'undefined') throw new Error('展開の準備ができていません');
  let zip;
  try{ zip = await JSZip.loadAsync(file); }
  catch(e){ throw new Error('ZIP として開けません（古い .doc 形式かもしれません）'); }

  // 本体の場所は決め打ちにせず、word/ の中から探す
  let entry = zip.file('word/document.xml');
  if (!entry){
    const cand = Object.keys(zip.files)
      .filter(n=>/^word\/document\d*\.xml$/i.test(n) || /document\.xml$/i.test(n));
    if (cand.length) entry = zip.file(cand[0]);
  }
  if (!entry) throw new Error('本文（document.xml）が見つかりません');
  const xml = await entry.async('string');

  // <w:p/> のように中身が空の段落もあるので、開始位置で区切る
  const out = [];
  const re = /<w:p(\s[^>]*)?>/g;
  const pieces = [];
  let m;
  while ((m = re.exec(xml)) !== null){
    // <w:p ... /> は中身のない段落（＝空行）
    if ((m[1] || '').endsWith('/')){ pieces.push({self:true}); continue; }
    const end = xml.indexOf('</w:p>', re.lastIndex);
    pieces.push({self:false, body: end < 0 ? '' : xml.slice(re.lastIndex, end)});
    if (end >= 0) re.lastIndex = end + 6;
  }
  for (const pc of pieces){
    if (pc.self){ out.push(''); continue; }
    let line = '';
    // 文字・タブ・改行を、書かれている順に組み立てる
    const tre = /<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:tab\s*\/?>|<w:br\s*\/?>|<w:cr\s*\/?>/g;
    let t;
    while ((t = tre.exec(pc.body)) !== null){
      if (t[1] !== undefined) line += xmlUnescape(t[1]);
      else if (/^<w:tab/.test(t[0])) line += '\t';
      else line += '\n';
    }
    out.push(line);
  }
  // タブは全角スペース2つぶんに均して、桁を保つ
  return out.join('\n').replace(/\t/g, '\u3000\u3000');
}

async function takeFiles(fileList){
  const files = [...fileList];
  const out = [];
  if (files.some(f=>/\.(pdf|jpe?g|png|gif|bmp|webp)$/i.test(f.name)))
    setBatchNote('読み取っています…');
  for (const f of files){
    const ext = (f.name.split('.').pop()||'').toLowerCase();
    const rel = f.webkitRelativePath || f.name;
    const folder = rel.includes('/') ? rel.split('/').slice(-2)[0] : '取り込み';
    let text = '';
    try{
      if (ext === 'md' || ext === 'txt') text = await readText(f);
      else if (ext === 'doc' || ext === 'docx' || ext === 'dot')
        text = (await isOle2(f)) ? await readDoc(f) : await readDocx(f);
      else if (ext === 'pdf') text = await readPdf(f);
      else if (['jpg','jpeg','png','gif','bmp','webp'].includes(ext)){
        setBatchNote(`「${f.name}」から文字を読み取っています…`);
        text = await readImage(f);
      }
      else { out.push({name:f.name, folder, ok:false, why:'.'+ext+' は未対応'}); continue; }
    }catch(e){ out.push({name:f.name, folder, ok:false, why:(e.message||'読めません').slice(0,40)}); continue; }
    if (!text.trim()){ out.push({name:f.name, folder, ok:false, why:'中身が読めない'}); continue; }
    const p = parseSheet(text);
    const nC = p.blocks.filter(b=>(b.chords||[]).length).length;
    // 曲名やアーティストの行は欄に移し、本文には残さない
    out.push({name:f.name, ok:true, pick:true,
      text: p.body || text,
      folder: p.folder || folder,
      title: p.title || f.name.replace(/\.[^.]+$/,''),
      artist: p.artist || '',
      vname: p.vname || '',
      key: p.key, keyGuessed: !!p.keyGuessed, capo: p.capo || 0,
      bpm: p.bpm || 100, nChord:nC,
      nLyric: p.blocks.reduce((a,b)=>a+((b.lyrics||[]).length),0)});
  }
  batch = out;
  checkBatchDup();
  drawBatch();
}

// 取り込む曲と同じ曲名がすでにあるか調べ、歌詞の一致率から初期の扱いを決める
function checkBatchDup(){
  batch.forEach(b=>{
    b.dup = null;
    if (!b.ok) return;
    const hit = findDuplicate(b.title, b.text);
    if (!hit) return;
    const pct = Math.round(hit.sim.ratio * 100);
    b.dup = {
      group: groupKey(hit.rep),
      repTitle: hit.rep.title,
      matchName: vLabel(hit.song),
      matchId: hit.song.id,
      nVer: versionsOf(hit.rep).length,
      pct,
      onlyA: hit.sim.onlyA.slice(0, 2),
      onlyB: hit.sim.onlyB.slice(0, 2)
    };
    b.dupMode = dupVerdict(pct).mode;
    b.vname = '';
  });
}
function setDupMode(i, mode){
  if (!batch[i] || !batch[i].dup) return;
  batch[i].dupMode = mode;
  drawBatch();
}
function setDupName(i, v){ if (batch[i]) batch[i].vname = v; }

function drawBatch(){
  const box = document.getElementById('batchOut');
  if (!box) return;
  if (!batch.length){ box.innerHTML = ''; return; }
  const good = batch.filter(b=>b.ok);
  const opts = genreOptions();
  const nEdited = good.filter(b=>b.edited).length;
  box.innerHTML = `<div class="secthead" style="margin-top:18px">読み取れたファイル ${good.length} / ${batch.length}</div>
    <div class="selbar" style="position:static;margin-bottom:10px">
      <button class="mini" onclick="pickBatch('all')">すべて選ぶ</button>
      <button class="mini" onclick="pickBatch('none')">すべて外す</button>
      <button class="mini" onclick="pickBatch('edited')" ${nEdited?'':'disabled'}>直した曲だけ選ぶ${nEdited?`（${nEdited}）`:''}</button>
    </div>` +
    batch.map((b,i)=>`<label class="brow${b.ok?'':' bad'}">
      ${b.ok?`<input type="checkbox" ${b.pick?'checked':''} onchange="batch[${i}].pick=this.checked;refreshCount()">`:'<span style="width:17px"></span>'}
      <span class="bn">${esc(b.title||b.name)}${b.edited?'<em class="edited">直した</em>':''}
        <div class="bf">${b.artist?esc(b.artist)+' · ':''}${esc(b.folder||'未分類')}${
          b.key?' · '+esc(b.key)+(b.keyGuessed?'(推測)':''):''}</div></span>
      <span class="bs${b.ok&&!b.nChord?' warn':''}">${b.ok
        ? (b.nChord ? `${b.nChord}行` : 'コード行なし')
        : esc(b.why)}</span>
      ${b.ok?`<button class="mini" onclick="event.preventDefault();peekBatch(${i})">中身を見る</button>`:''}</label>
    ${b.dup ? dupBox(b, i) : ''}`).join('') +
    (good.length ? `
      <div class="card" style="margin-top:12px">
        <label style="display:block;font-size:.74rem;font-weight:700;letter-spacing:.05em;color:var(--fg-dim);margin-bottom:7px">選んだ曲のジャンルをまとめて変える</label>
        <div class="picker cp">${opts.slice(0,10).map(f=>
          `<button class="pk sub" onclick="setBatchGenre('${esc(f)}')">${esc(f)}</button>`).join('')}</div>
      </div>
      <div class="btnrow" style="margin-top:12px">
      <button class="act" onclick="importBatch()">選んだ曲を取り込む（<span id="bCount">${good.filter(b=>b.pick).length}</span>曲）</button>
      <button class="ghost" onclick="batch=[];batchEdit=null;drawBatch()">やめる</button></div>` : '');
}
function peekBatch(i){
  const b = batch[i]; if (!b || !b.ok) return;
  batchEdit = i;
  render();
  document.getElementById('main').scrollTop = 0;
}

// 一覧に戻す（直した内容は候補の中に残す）
function closeBatchEdit(save){
  const b = batch[batchEdit];
  if (b && save){
    const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    b.title  = g('bTitle').trim() || b.title;
    b.artist = g('bArtist').trim();
    b.key    = g('bKey').trim();
    b.capo   = Math.max(0, Math.min(12, parseInt(g('bCapo'),10) || 0));
    b.folder = g('bFolder').trim() || b.folder;
    b.text   = g('bText');
    const p = parseSheet(b.text);
    b.nChord = p.blocks.filter(x=>(x.chords||[]).length).length;
    b.edited = true;
    b.pick = true;
    checkBatchDup();
  }
  batchEdit = null;
  render();
  setTimeout(()=>{
    const el = document.getElementById('batchOut');
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 80);
}

function batchPreview(){

// 取り込む前に、選んだ曲のジャンルをまとめて変える
function setBatchGenre(v){

  batch.forEach(b=>{ if (b.ok && b.pick) b.folder = g; });
  drawBatch();
  alertShare(`ジャンルを「${g}」にしました`);
}

// 同じ曲名があったときの選択肢
function dupBox(b, i){
  const d = b.dup;
  const vd = dupVerdict(d.pct);
  const btn = (m, label) =>
    `<button class="${b.dupMode===m?'on':''}" onclick="event.preventDefault();setDupMode(${i},'${m}')">${label}</button>`;
  const diff = [
    d.onlyA.length ? '読み込む側だけ: ' + d.onlyA.map(esc).join(' / ') : '',
    d.onlyB.length ? 'いまある側だけ: ' + d.onlyB.map(esc).join(' / ') : ''
  ].filter(Boolean).join('<br>');
  return `<div class="dup">
    <b>同じ曲名があります</b> —「${esc(d.repTitle)}」（${d.nVer}バージョン）<br>
    歌詞の一致 <b>${d.pct}%</b>（いちばん近いのは「${esc(d.matchName)}」）。${vd.note}
    ${diff ? `<div class="diff">${diff}</div>` : ''}
    <div class="ch">
      ${btn('version','別バージョンとして足す')}
      ${btn('overwrite','上書きする')}
      ${btn('separate','別の曲として入れる')}
    </div>
    ${b.dupMode==='version'
      ? `<input type="text" placeholder="バージョン名（例: 2015年版 / 女性キー）空なら自動で付けます"
           value="${esc(b.vname||'')}" oninput="setDupName(${i}, this.value)">`
      : b.dupMode==='overwrite'
      ? `<div class="diff">「${esc(d.matchName)}」の中身をこのファイルで置き換えます。元には戻せません。</div>`
      : ''}
  </div>`;
}

function pickBatch(mode){
  batch.forEach(b=>{
    if (!b.ok) return;
    b.pick = mode === 'all' ? true : mode === 'none' ? false : !!b.edited;
  });
  drawBatch();
}

function refreshCount(){
  const el = document.getElementById('bCount');
  if (el) el.textContent = batch.filter(b=>b.ok&&b.pick).length;
}
function importBatch(){
  const take = batch.filter(b=>b.ok&&b.pick);
  if (!take.length) return;
  let added = 0, versions = 0, over = 0;
  take.forEach((b,i)=>{
    const mode = b.dup ? b.dupMode : 'separate';
    if (mode === 'overwrite'){
      const t = songs.find(x=>x.id === b.dup.matchId);
      if (t){
        t.text = b.text;
        t.title = b.title; t.artist = b.artist||''; t.folder = b.folder||'未分類';
        t.key = (b.key||t.key||'C').trim(); t.capo = b.capo||0; t.bpm = b.bpm||t.bpm||100;
        over++;
        return;
      }
    }
    const id = 'b' + Date.now() + '_' + i;
    const grp = mode === 'version' ? b.dup.group : id;
    if (mode === 'version'){
      // もとの版に名前が無いままだと見分けがつかないので付けておく
      const sib = songs.filter(x=>groupKey(x) === grp);
      if (sib.length === 1 && !(sib[0].vname||'').trim()) sib[0].vname = 'もとの版';
      versions++;
    } else added++;
    songs.push({id, vgroup: grp,
      vname: mode === 'version' ? uniqueVersionName(grp, b.vname) : '',
      folder:b.folder||'未分類', title:b.title,
      artist:b.artist||'', key:(b.key||'C').trim(), capo:b.capo||0,
      bpm:b.bpm||100, barsPerLine:8, transpose:0, plays:0, v:2, text:b.text});
  });
  persist();
  batch = []; batchEdit = null;
  folderFilter = null;
  go('list');
  const msg = [added?added+'曲を追加':'', versions?versions+'バージョンを追加':'', over?over+'件を上書き':'']
    .filter(Boolean).join(' / ');
  if (msg) alertShare(msg);
}

let _objUrl = null;
async function loadAudioSlot(song){
  const slot = document.getElementById('audioSlot');
  if (!slot) return;
  const blob = await getAudio(song.id);
  if (!document.getElementById('audioSlot')) return;
  if (_objUrl){ URL.revokeObjectURL(_objUrl); _objUrl = null; }
  if (!blob){
    slot.innerHTML = `<div class="btnrow" style="margin:0">
      <button class="act" id="songRecBtn" onclick="toggleSongRec('${song.id}')">ここで録音する</button>
      <button class="ghost" onclick="document.getElementById('attachAudio').click()">ファイルから選ぶ</button></div>
      <p class="hint" id="songRecMsg">譜面を見ながらそのまま録れます。止めると自動でこの曲に付きます。</p>`;
    return;
  }
  _objUrl = URL.createObjectURL(blob);
  slot.innerHTML = `<audio controls preload="metadata" src="${_objUrl}" style="width:100%"></audio>
    <div class="btnrow" style="margin-top:9px">
      <button class="ghost" id="songRecBtn" onclick="toggleSongRec('${song.id}')">録り直す</button>
      <button class="ghost" onclick="document.getElementById('attachAudio').click()">ファイルから選ぶ</button>

    <p class="hint" id="songRecMsg" style="margin-top:7px"></p>`;

/* ---- 曲画面での録音 ---- */
let songRec = null, songRecChunks = [], songRecTimer = null, songRecStart = 0;

async function toggleSongRec(id){
  const btn = document.getElementById('songRecBtn');
  const msg = document.getElementById('songRecMsg');
  if (songRec && songRec.state === 'recording'){ songRec.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if (msg) msg.textContent = 'このブラウザではマイクを使えません。';
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    songRecChunks = [];
    songRec = new MediaRecorder(stream);
    songRec.ondataavailable = e=>{ if (e.data.size) songRecChunks.push(e.data); };
    songRec.onstop = async ()=>{
      clearInterval(songRecTimer);
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(songRecChunks, {type: songRec.mimeType || 'audio/webm'});
      songRec = null;
      const ok = await putAudio(id, blob);
      const song = songs.find(x=>x.id===id);
      if (song){ song.hasAudio = ok; persist(); }
      loadAudioSlot(song);
      alertShare(ok ? '録音をこの曲に付けました' : '保存できませんでした');
    };
    songRec.start();
    songRecStart = Date.now();
    if (btn){ btn.textContent = '停止して付ける'; btn.classList.add('rec'); btn.classList.remove('ghost'); }
    songRecTimer = setInterval(()=>{
      const m = document.getElementById('songRecMsg');
      if (!m) return;
      const t = Math.floor((Date.now()-songRecStart)/1000);
      m.textContent = '録音中 ' + Math.floor(t/60) + ':' + String(t%60).padStart(2,'0');
    }, 250);
  }catch(e){
    if (msg) msg.textContent = e.name === 'NotAllowedError'
      ? 'マイクの使用が許可されませんでした。ブラウザの設定から許可してください。'
      : 'マイクを開けませんでした（' + (e.message||e.name) + '）。';
  }
}

async function attachTo(id, file){
  const ok = await putAudio(id, file);
  const song = songs.find(x=>x.id===id);
  if (song){ song.hasAudio = ok; persist(); }
  loadAudioSlot(song);
}
async function removeAudio(id){
  await delAudio(id);
  const song = songs.find(x=>x.id===id);
  if (song){ song.hasAudio = false; persist(); }
  loadAudioSlot(song);
}

      : 'マイクを開けませんでした（' + (e.message||e.name) + '）。';

/* ---- 音源解析 ---- */
let anaResult = null;

async function runAnalysis(file){
  const box = document.getElementById('anaOut');
  box.innerHTML = `<p class="hint" id="anaMsg">「${esc(file.name)}」を読み込んでいます…</p>`;
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    const buf = await file.arrayBuffer();
    const AC = window.AudioContext || window.webkitAudioContext;
    const tmp = new AC();
    const decoded = await tmp.decodeAudioData(buf);
    tmp.close();
    document.getElementById('anaMsg').textContent = '解析しています…（曲の長さによって数秒かかります）';
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    // モノラル 22050Hz に揃える
    const SR = 22050;
    const off = new OfflineAudioContext(1, Math.ceil(decoded.duration*SR), SR);
    const src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start();
    const mono = await off.startRendering();
    const y = mono.getChannelData(0);

    anaResult = analyze(y, SR);
    anaResult.name = file.name;
    anaResult.file = file;
    drawAnalysis();
  }catch(e){
    box.innerHTML = `<p class="hint">このファイルは読み込めませんでした（${esc(e.message||'形式が未対応')}）。mp3 / m4a / wav を試してください。</p>`;
  }
}

function fmtTime(t){ return Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0'); }

function drawAnalysis(){
  const r = anaResult, box = document.getElementById('anaOut');
  if (!r) return;
  const cnt = {};
  r.sequence.forEach(x=>cnt[x.chord] = (cnt[x.chord]||0)+1);
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
  box.innerHTML = `
    <div class="stat" style="margin-top:14px">
      <span>テンポ <b>${Math.round(r.bpm)}</b> BPM</span>
      <span>キー <b>${esc(r.key.root)}</b> ${r.key.mode==='major'?'メジャー':'マイナー'}</span>
      <span>長さ <b>${fmtTime(r.duration)}</b></span>
      <span>コードチェンジ <b>${r.sequence.length}</b> 回</span>
    </div>
    <div class="secthead" style="margin-top:16px">よく出てくるコード</div>
    <div class="picker">${top.map(([c,n])=>`<button class="pk" onclick="showChord('${c}')">${esc(c)}<i>${n}回</i></button>`).join('')}</div>
    <div class="secthead" style="margin-top:16px">コード進行</div>
    <div class="tl">${r.sequence.slice(0,80).map(x=>
      `<div class="tlr"><span class="tt">${fmtTime(x.t)}</span><span class="tc">${esc(x.chord)}</span></div>`).join('')}
    </div>
    ${r.sequence.length>80?`<p class="hint">※ 冒頭80個まで表示しています（全${r.sequence.length}個）</p>`:''}
    <div class="btnrow" style="margin-top:14px">
      <button class="act" onclick="saveAnalysis()">この内容で曲として保存</button>
      <button class="ghost" onclick="halveTempo()">テンポを半分にする</button>
      <button class="ghost" onclick="anaResult=null;document.getElementById('anaOut').innerHTML=''">やめる</button>
    </div>
    <p class="hint">テンポは実際の倍や半分に出ることがあります（この曲なら 68 と 136 のどちらも正解になりえます）。合わないときは上のボタンで切り替えてください。</p>`;
}
function halveTempo(){
  if (!anaResult) return;
  anaResult.bpm = anaResult.bpm > 100 ? anaResult.bpm/2 : anaResult.bpm*2;
  drawAnalysis();
}

// 解析結果をコード譜テキストに起こす（歌詞は空けておく）
function sheetFromAnalysis(r){
  const per = 4;
  const lines = [];
  for (let i=0;i<r.sequence.length;i+=per){
    const grp = r.sequence.slice(i, i+per);
    let line = '';
    grp.forEach((x,k)=>{
      const target = k*10;
      while (line.length < target) line += ' ';
      line += x.chord;
    });
    lines.push(line);
    lines.push('');          // 歌詞を書き込む行
  }
  return lines.join('\n');
}

function saveAnalysis(){
  const r = anaResult; if (!r) return;
  const id = 'a'+Date.now();
  songs.push({id, folder:'解析', title: r.name.replace(/\.[^.]+$/,''), artist:'',
    key: r.key.root, capo:0, bpm: Math.round(r.bpm), barsPerLine:8, transpose:0, plays:0,
    hasAudio:true, text: sheetFromAnalysis(r)});
  persist();
  if (r.file) putAudio(id, r.file);   // 解析に使った音源をそのまま添付
  anaResult = null;
  folderFilter = null;
  go('list');
}

function alert0(){
  const b = event.target; const o = b.textContent;
  b.textContent = '解析エンジン未接続';
  setTimeout(()=>{ b.textContent = o; }, 1400);
}

// 読み込んだ内容から、曲名・アーティスト・キー・カポを欄に反映する
function applyParsedToDraft(text, fileName){
  const p = parseSheet(text);
  draft.text   = text;
  draft.title  = p.title || (fileName || '').replace(/\.[^.]+$/,'') || '';
  draft.artist = p.artist || '';
  draft.key    = p.key || '';
  draft.capo   = p.capo || 0;
  if (p.folder) draft.folder = p.folder;
  draft.keyGuessed = !!p.keyGuessed;
  draft.keyEdited  = false;
}

async function loadOne(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  let text = '';
  const busy = (msg)=>{ const el = document.getElementById('draftPrev');
    if (el) el.innerHTML = `<p class="empty">${esc(msg)}</p>`; };
  try{
    if (ext === 'doc' || ext === 'docx' || ext === 'dot' || ext === 'rtf'){
      busy('Word を読んでいます…');
      // 拡張子より中身を信じる
      text = (await isOle2(file)) ? await readDoc(file) : await readDocx(file);
    }
    else if (ext === 'pdf'){ busy('PDF を読んでいます…'); text = await readPdf(file); }
    else if (['jpg','jpeg','png','gif','bmp','webp'].includes(ext)){
      busy('画像から文字を読み取っています…');
      text = await readImage(file, (pct, note)=>{
        busy(note || (pct != null ? `文字を読み取っています… ${pct}%` : '準備しています…'));
      });
    }
    else text = await readText(file);
  }catch(e){
    busy('読み取れませんでした: ' + (e.message||''));
    return;
  }
  if (!text.trim()){
    const el = document.getElementById('draftPrev');
    if (el) el.innerHTML = `<p class="empty">文字が見つかりませんでした。<br>
      <span style="font-size:.76rem">画像として作られた PDF には文字の情報がありません。その場合は画像に書き出してから読み込んでください。</span></p>`;
    return;
  }
  applyParsedToDraft(text, file.name);
  render();
  setTimeout(()=>{
    const el = document.getElementById('draftPrev');
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 80);
}

function previewDraft(){
  const prev = document.getElementById('draftPrev');
  const stat = document.getElementById('draftStat');
  if (!prev) return;
  if (!draft.text.trim()){
    prev.innerHTML = '<p class="empty">テキストを貼り付けると、ここに判定結果が出ます。</p>';
    if (stat) stat.innerHTML = '';
    return;
  }
  const p = parseSheet(draft.text);
  // 欄が空なら、貼り付けた内容から拾って埋める
  if (!draft.title && p.title) draft.title = p.title;
  if (!draft.artist && p.artist) draft.artist = p.artist;
  if (!draft.keyEdited && !draft.key && p.key){
    draft.key = p.key; draft.keyGuessed = !!p.keyGuessed;
  }
  const nChord = p.blocks.filter(b=>(b.chords||[]).length).length;
  const nLyric = p.blocks.reduce((a,b)=>a+((b.lyrics||[]).length),0);
  const chords = new Set();
  p.blocks.forEach(b=>(b.chords||[]).forEach(c=>{ if(c.kind==='c') chords.add(c.text); }));
  if (stat) stat.innerHTML = `<div class="stat"><span>コード行 <b>${nChord}</b></span>
    <span>歌詞行 <b>${nLyric}</b></span><span>種類 <b>${chords.size}</b></span></div>`;

  const key = (draft.key || p.key || '').trim();
  const noChord = nChord === 0 && draft.text.trim()
    ? `<div class="warnbox"><b>コード行として読めた行がありません</b>
        コード行にしたい行の<b>先頭に @ を付けて</b>ください。その行はそのままコード行になります。
        読み取りの間違い（O と 0、l と 1 など）も、上の欄で直せます。</div>`
    : '';
  prev.innerHTML = noChord + `<div class="prevhead">
      <div class="ph"><span>曲名</span><b>${esc(draft.title || '(未設定)')}</b></div>
      <div class="ph"><span>アーティスト</span><b>${esc(draft.artist || '(未設定)')}</b></div>
      <div class="ph"><span>原曲キー</span><b>${esc(key || '(未設定)')}${
        (draft.keyGuessed && !draft.keyEdited && key) ? '<i>自動推測</i>' : ''}</b></div>
      ${draft.capo ? `<div class="ph"><span>カポ</span><b>${esc(String(draft.capo))}</b></div>` : ''}
      <div class="ph"><span>ジャンル</span><b>${esc(draft.folder || '未分類')}</b></div>
    </div>`;
  const tmp = {...draft, key, capo:(parseInt(draft.capo,10)||0), transpose:0,
               bpm:100, barsPerLine:8, text:draft.text};
  prev.appendChild(renderSheet(tmp));
}

function saveDraft(){
  if (!draft.text.trim()) return;
  const p = parseSheet(draft.text);
  const title = draft.title || p.title || '無題';
  const text = p.body || draft.text;
  const make = (mode, grp, vname)=>{
    const id = 'u'+Date.now();
    songs.push({id, vgroup: grp || id, vname: vname || '',
      folder:(draft.folder||'').trim()||p.folder||'未分類', title,
      artist: draft.artist || p.artist || '',
      key: (draft.key || p.key || 'C').trim(),
      capo: Math.max(0, Math.min(12, parseInt(draft.capo,10) || p.capo || 0)),
      bpm: p.bpm || 100, barsPerLine:8, transpose:0, plays:0, v:2, text});
    persist();
    draft = {text:'', title:'', artist:'', key:'', capo:0, folder:'', keyEdited:false, keyGuessed:false};
    go('list');
    if (mode === 'version') alertShare('「' + vname + '」として足しました');
  };
  const hit = findDuplicate(title, text);
  if (!hit){ make('new'); return; }
  askDupChoice(hit, title, {
    version: ()=>{
      const grp = groupKey(hit.rep);
      const sib = songs.filter(x=>groupKey(x)===grp);
      if (sib.length === 1 && !(sib[0].vname||'').trim()) sib[0].vname = 'もとの版';
      askText('バージョン名', 'このバージョンの名前を入れてください（例: 女性キー、2015年版）', '',
        v=>make('version', grp, uniqueVersionName(grp, v)));
    },
    overwrite: ()=>{
      const t = songs.find(x=>x.id===hit.song.id);
      if (t){
        t.text = text;
        t.artist = draft.artist || p.artist || t.artist;
        t.key = (draft.key || p.key || t.key || 'C').trim();
        t.capo = Math.max(0, Math.min(12, parseInt(draft.capo,10) || p.capo || 0));
        if (p.bpm) t.bpm = p.bpm;
        persist();
      }
      draft = {text:'', title:'', artist:'', key:'', capo:0, folder:'', keyEdited:false, keyGuessed:false};
      go('list');
      alertShare('上書きしました');
    },
    separate: ()=>make('new')
  });
}

// 同じ曲名が見つかったときに、どう入れるか聞く
function askDupChoice(hit, title, acts){
  const pct = Math.round(hit.sim.ratio * 100);
  const vd = dupVerdict(pct);
  const near = vd.mode === 'version';
  const nVer = versionsOf(hit.rep).length;
  const diff = [
    hit.sim.onlyA.slice(0,2).length ? '読み込む側だけ: ' + hit.sim.onlyA.slice(0,2).map(esc).join(' / ') : '',
    hit.sim.onlyB.slice(0,2).length ? 'いまある側だけ: ' + hit.sim.onlyB.slice(0,2).map(esc).join(' / ') : ''
  ].filter(Boolean).join('<br>');
  _dupActs = acts;
  document.getElementById('popName').textContent = '「' + title + '」はすでにあります';
  document.getElementById('popDesc').textContent =
    `歌詞の一致は ${pct}%（いちばん近いのは「${vLabel(hit.song)}」／ぜんぶで ${nVer}バージョン）。` + vd.note;
  document.getElementById('popGrid').innerHTML = `<div style="flex:1 1 100%">
    ${diff ? `<p class="hint" style="margin:0 0 10px;line-height:1.6">${diff}</p>` : ''}
    <div class="btnrow" style="flex-direction:column;align-items:stretch;gap:8px">
      <button class="${near?'act':'ghost'}" onclick="dupPick('version')">別バージョンとして足す</button>
      <button class="ghost" onclick="dupPick('overwrite')">「${esc(vLabel(hit.song))}」を上書きする</button>
      <button class="${near?'ghost':'act'}" onclick="dupPick('separate')">別の曲として入れる</button>
      <button class="ghost" onclick="closePop();_dupActs=null">やめる</button>
    </div></div>`;
  document.getElementById('pop').hidden = false;
}
let _dupActs = null;
function dupPick(k){
  const a = _dupActs; _dupActs = null;
  closePop();
  if (a && a[k]) a[k]();
}

// ドラッグ&ドロップ（フォルダごと落とされた場合も中を辿る）
async function walkEntry(entry, path, acc){
  if (entry.isFile){
    const f = await new Promise(r=>entry.file(r));
    Object.defineProperty(f, 'webkitRelativePath', {value: path + f.name});
    acc.push(f);
  } else if (entry.isDirectory){
    const reader = entry.createReader();
    const kids = await new Promise(r=>reader.readEntries(r));
    for (const k of kids) await walkEntry(k, path + entry.name + '/', acc);
  }
}
document.addEventListener('dragover', e=>{
  const z = e.target.closest && (e.target.closest('#dropZone') || e.target.closest('#audioZone'));
  if (z){ e.preventDefault(); z.classList.add('hot'); }
});
document.addEventListener('dragleave', e=>{
  const z = e.target.closest && (e.target.closest('#dropZone') || e.target.closest('#audioZone'));
  if (z) z.classList.remove('hot');
});
document.addEventListener('drop', async e=>{
  const az = e.target.closest && e.target.closest('#audioZone');
  if (az){
    e.preventDefault(); az.classList.remove('hot');
    const f = e.dataTransfer.files[0];
    if (f) runAnalysis(f);
    return;
  }
  const z = e.target.closest && e.target.closest('#dropZone');
  if (!z) return;
  e.preventDefault(); z.classList.remove('hot');
  const items = [...(e.dataTransfer.items||[])];
  const acc = [];
  const entries = items.map(i=>i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length){ for (const en of entries) await walkEntry(en, '', acc); }
  else acc.push(...e.dataTransfer.files);
  if (acc.length) takeFiles(acc);
});

initSync();
