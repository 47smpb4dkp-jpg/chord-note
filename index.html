/* ============ 4.8 Google ドライブへのバックアップ ============ */
/* 普段の読み書きは Firebase。ドライブには保存のたびに .md を書き出して、
   自分で見られる控え（正本）を置いておく。
   アプリが触れるのは自分で作ったファイルだけ（drive.file の権限）。 */
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_ROOT  = 'コードノート';
let driveToken = null;          // アクセス用の鍵。1時間ほどで切れる
let driveRootId = null;
let driveState  = 'off';        // off / on / error
let driveError  = '';
let driveBusy   = false;
let driveTimer  = null;
let drivePushed = new Map();    // 書き出し済みの内容。変わった曲だけ送る

function driveWanted(){
  try{ return localStorage.getItem('cn_drive') === 'on'; }catch(e){ return false; }
}
function rememberDriveToken(t){
  driveToken = t || null;
  try{
    if (t) sessionStorage.setItem('cn_drive_tok', t);
    else sessionStorage.removeItem('cn_drive_tok');
  }catch(e){}
}
function restoreDriveToken(){
  try{ driveToken = sessionStorage.getItem('cn_drive_tok') || null; }catch(e){ driveToken = null; }
  if (driveToken && driveWanted()) driveState = 'on';
}

// ドライブにつなぐ。Google のログイン画面が1回出る
async function connectDrive(){
  if (typeof firebase === 'undefined'){ alertShare('この環境では使えません'); return; }
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.addScope(DRIVE_SCOPE);
    const res = await firebase.auth().signInWithPopup(provider);
    const tok = res && res.credential && res.credential.accessToken;
    if (!tok) throw new Error('鍵を受け取れませんでした');
    rememberDriveToken(tok);
    try{ localStorage.setItem('cn_drive', 'on'); }catch(e){}
    driveState = 'on'; driveError = '';
    driveRootId = null;
    await driveFindRoot();
    alertShare('ドライブにつながりました');
    drawDrive();
    scheduleDriveBackup(true);
  }catch(e){
    driveState = 'error';
    driveError = ((e && (e.code || e.name)) || '') + ' ' + ((e && e.message) || String(e));
    drawDrive();
  }
}
function disconnectDrive(){
  try{ localStorage.setItem('cn_drive', 'off'); }catch(e){}
  rememberDriveToken(null);
  driveState = 'off'; driveError = ''; driveRootId = null;
  drivePushed = new Map();
  alertShare('ドライブとの連携をやめました');
  drawDrive();
}

// ドライブへの問い合わせ。鍵が切れていたら分かるようにする
async function driveFetch(url, opts){
  if (!driveToken) throw new Error('まだドライブにつないでいません');
  const o = Object.assign({}, opts || {});
  o.headers = Object.assign({Authorization: 'Bearer ' + driveToken}, o.headers || {});
  const r = await fetch(url, o);
  if (r.status === 401 || r.status === 403){
    rememberDriveToken(null);
    driveState = 'error';
    driveError = 'つなぎ直しが要ります（鍵の期限切れ）';
    throw new Error('EXPIRED');
  }
  if (!r.ok){
    let t = '';
    try{ t = (await r.json()).error.message; }catch(e){ t = r.status + ''; }
    throw new Error(t);
  }
  return r.json();
}

// フォルダを探す。無ければ作る
async function driveFolder(name, parentId){
  const q = encodeURIComponent(
    `name='${name.replace(/'/g, "\\'")}' and mimeType='application/vnd.google-apps.folder'` +
    ` and '${parentId}' in parents and trashed=false`);
  const found = await driveFetch(
    'https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=1');
  if (found.files && found.files.length) return found.files[0].id;
  const made = await driveFetch('https://www.googleapis.com/drive/v3/files?fields=id', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, mimeType: 'application/vnd.google-apps.folder', parents: [parentId]})
  });
  return made.id;
}
async function driveFindRoot(){
  if (driveRootId) return driveRootId;
  driveRootId = await driveFolder(DRIVE_ROOT, 'root');
  return driveRootId;
}

// 同じ名前のファイルを探す（あれば中身を差し替える）
async function driveFindFile(name, parentId){
  const q = encodeURIComponent(
    `name='${name.replace(/'/g, "\\'")}' and '${parentId}' in parents and trashed=false`);
  const r = await driveFetch(
    'https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=1');
  return (r.files && r.files[0]) ? r.files[0].id : null;
}

// 1曲を .md として書き出す
async function drivePutSong(s, parentId){
  const name = exportFileName(s) + '.md';
  const body = songToMd(s);
  const id = await driveFindFile(name, parentId);
  const meta = id ? {} : {name, parents: [parentId]};
  const boundary = '-----cn' + Date.now();
  const payload =
    '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
    JSON.stringify(meta) + '\r\n' +
    '--' + boundary + '\r\nContent-Type: text/markdown; charset=UTF-8\r\n\r\n' +
    body + '\r\n--' + boundary + '--';
  const url = 'https://www.googleapis.com/upload/drive/v3/files' +
    (id ? '/' + id + '?uploadType=multipart&fields=id' : '?uploadType=multipart&fields=id');
  await driveFetch(url, {
    method: id ? 'PATCH' : 'POST',
    headers: {'Content-Type': 'multipart/related; boundary=' + boundary},
    body: payload
  });
}

function driveSnap(s){ return songToMd(s).replace(/^updated:.*$/m, ''); }

// 変わった曲だけドライブへ送る
async function runDriveBackup(all){
  if (driveBusy || driveState !== 'on' || isViewer || !songs.length) return;
  driveBusy = true;
  let done = 0, failed = 0;
  try{
    const root = await driveFindRoot();
    const folders = {};
    for (const s of songs){
      const snap = driveSnap(s);
      if (!all && drivePushed.get(s.id) === snap) continue;
      const g = (s.folder || '未分類').trim() || '未分類';
      if (!folders[g]) folders[g] = await driveFolder(safeName(g), root);
      try{
        await drivePutSong(s, folders[g]);
        drivePushed.set(s.id, snap);
        done++;
      }catch(e){
        if ((e && e.message) === 'EXPIRED') throw e;
        lastDriveErr = (e && e.message) || String(e);
        failed++;
      }
    }
    driveError = failed ? failed + ' 曲を書き出せませんでした（' + lastDriveErr + '）' : '';
    if (done) driveLastAt = Date.now();
  }catch(e){
    if ((e && e.message) !== 'EXPIRED'){
      driveState = 'error';
      driveError = (e && e.message) || String(e);
    }
  }
  driveBusy = false;
  drawDrive();
}
let driveLastAt = 0, lastDriveErr = '';
function scheduleDriveBackup(all){
  if (driveState !== 'on') return;
  clearTimeout(driveTimer);
  driveTimer = setTimeout(()=>runDriveBackup(!!all), all ? 300 : 8000);
}

// ドライブから読み戻す
async function driveRestore(){
  if (driveState !== 'on'){ alertShare('先にドライブにつないでください'); return; }
  const box = document.getElementById('driveMsg');
  if (box) box.innerHTML = '<p class="hint" style="margin:8px 0 0">ドライブを見ています…</p>';
  try{
    const root = await driveFindRoot();
    // フォルダ（ジャンル）を全部拾う
    const dirs = await driveFetch('https://www.googleapis.com/drive/v3/files?q=' +
      encodeURIComponent(`'${root}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`) +
      '&fields=files(id,name)&pageSize=200');
    const found = [];
    const scan = async (id, genre)=>{
      let token = '';
      do {
        const r = await driveFetch('https://www.googleapis.com/drive/v3/files?q=' +
          encodeURIComponent(`'${id}' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'`) +
          '&fields=nextPageToken,files(id,name)&pageSize=200' + (token ? '&pageToken=' + token : ''));
        (r.files || []).forEach(f=>{ if (/\.md$/i.test(f.name)) found.push({...f, genre}); });
        token = r.nextPageToken || '';
      } while (token);
    };
    await scan(root, '');
    for (const d of (dirs.files || [])) await scan(d.id, d.name);
    if (!found.length){
      showBoxError('driveMsg', 'ドライブに譜面が見つかりませんでした',
        'フォルダ「' + DRIVE_ROOT + '」の中に .md がありません。');
      return;
    }
    // 中身を読み込んで、取り込み候補として一覧に並べる
    const out = [];
    for (const f of found){
      try{
        const r = await fetch('https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media',
          {headers: {Authorization: 'Bearer ' + driveToken}});
        const text = await r.text();
        if (!text.trim()) continue;
        const p = parseSheet(text);
        out.push({name: f.name, ok: true, pick: true,
          text: p.body || text,
          folder: p.folder || f.genre || '取り込み',
          title: p.title || f.name.replace(/\.[^.]+$/, ''),
          artist: p.artist || '', vname: p.vname || '', capoBase: p.capoBase || '',
          key: p.key, keyGuessed: !!p.keyGuessed, capo: p.capo || 0,
          bpm: p.bpm || 100,
          nChord: p.blocks.filter(b=>(b.chords||[]).length).length,
          nLyric: p.blocks.reduce((a,b)=>a+((b.lyrics||[]).length), 0)});
      }catch(e){ out.push({name: f.name, ok: false, why: (e.message||'読めません').slice(0,40)}); }
    }
    batch = out;
    checkBatchDup();
    if (box) box.innerHTML = '';
    storageOpen = false;
    go('new');
    setTimeout(()=>{
      drawBatch();
      const el = document.getElementById('batchOut');
      if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }, 60);
    alertShare('ドライブから ' + out.length + ' 曲を読みました。取り込む曲を選んでください');
  }catch(e){
    showBoxError('driveMsg', 'ドライブから読めませんでした', (e && e.message) || String(e),
      (e && e.message) === 'EXPIRED' ? 'もう一度「ドライブにつなぐ」を押してください。' : '');
  }
}

function drawDrive(){
  const box = document.getElementById('driveBox');
  if (!box) return;
  const on = driveState === 'on';
  const when = driveLastAt ? new Date(driveLastAt).toLocaleString('ja-JP',
    {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '';
  box.innerHTML = `
    <div class="syncbar" style="margin:0 0 10px">
      <span class="sdot ${on?'ok':(driveState==='error'?'err':'')}"></span>
      ${on ? 'ドライブにバックアップ中' : driveState==='error' ? 'ドライブでつまずいています' : 'ドライブは使っていません'}
      ${when ? `<span class="who">最後: ${esc(when)}</span>` : ''}
    </div>
    <p class="sub">マイドライブの中に「<b>${DRIVE_ROOT}</b>」というフォルダを作って、

/* ============ 6. 描画: コード譜 ============ */
// コード1つと、その下にくる歌詞の一部分を1組にする。
// 組ごと折り返すので、画面が狭くてもコードと歌詞がずれない。
function makeSegments(chords, lyricText){
  const chars = [...(lyricText || '')];
  // 表示幅の列番号 → 歌詞の何文字目か
  const idxAt = col => {
    let w = 0, i = 0;
    while (i < chars.length && w < col){ w += charWidth(chars[i]); i++; }
    return {i, w};
  };
  const segs = [];
  const hasLyric = !!(lyricText || '').trim();
  if (!chords.length) return [{chord:null, text: lyricText || ''}];

  // 最初のコードより前にある歌詞
  if (chords[0].col > 0){
    const a = idxAt(chords[0].col);
    if (a.i > 0) segs.push({chord:null, text: chars.slice(0, a.i).join('')});
  }
  for (let k = 0; k < chords.length; k++){
    const here = idxAt(chords[k].col);
    const last = k + 1 >= chords.length;
    const nextCol = last ? null : chords[k+1].col;
    const to = last ? chars.length : idxAt(nextCol).i;
    let text = chars.slice(here.i, to).join('');
    // 次のコードまでの間隔を空白で埋める。
    // ただし空白が長すぎると1行が横に伸びるので、上限を設ける
    if (!last){
      const want = Math.min(nextCol - chords[k].col, hasLyric ? 4 : 8);
      let have = 0;
      for (const c of text) have += charWidth(c);
      if (have < want) text += ' '.repeat(want - have);
    }
    segs.push({chord: chords[k], text});
  }
  return segs;
}

// opts.lineToggle を渡すと、各行の左に「コード行/歌詞行」の切り替えが出る
function renderSheet(song, opts){
  opts = opts || {};
  const blocks = parseBody(song.text);
  const n = shiftOf(song);
  const pref = n ? keyPrefersFlat(shownKeyOf(song)) : false;
  const el = document.createElement('div');
  el.id = 'sheet';
  el.style.setProperty('--sheet-size', (song.sheetSize || 16) + 'px');

  for (const b of blocks){
    if (b.blank){
      const sp = document.createElement('div');
      sp.className = 'spacer';
      el.appendChild(sp);
      continue;
    }
    const blk = document.createElement('div');
    blk.className = 'blk';
    if (opts.lineToggle){
      blk.classList.add('withtg');
      const line = b.chords.length ? b.srcLine
                 : (b.lyrics[0] && b.lyrics[0].srcLine);
      if (line != null){
        blk.appendChild(toggleBtn(line, b.chords.length > 0, opts.lineToggle,
          b.chords.length ? '' : (b.lyrics[0] && b.lyrics[0].text)));
      }
    }

    if (b.chords.length){
      const row = document.createElement('div');
      row.className = 'pairrow';
      const first = (b.lyrics[0] && b.lyrics[0].text) || '';
      for (const sg of makeSegments(b.chords, first)){
        const seg = document.createElement('span');
        seg.className = 'seg';
        const top = document.createElement('span');
        top.className = 'sc';
        if (sg.chord){
          const c = sg.chord;
          top.classList.add(c.kind);
          top.textContent = c.kind === 'c' ? transposeChord(c.disp || c.text, n, pref) : c.text;
          if (c.kind === 'c'){
            const forLookup = transposeChord(c.text, n, pref);
            top.tabIndex = 0;
            top.onclick = ()=>showChord(forLookup);
            top.onkeydown = e=>{ if (e.key === 'Enter') showChord(forLookup); };
          }
        }
        const bot = document.createElement('span');
        bot.className = 'sl';
        bot.textContent = sg.text;
        seg.appendChild(top);
        seg.appendChild(bot);
        row.appendChild(seg);
      }
      blk.appendChild(row);
      // 2行目以降の歌詞（同じコードで歌う替わりの歌詞）
      for (let i = 1; i < b.lyrics.length; i++){
        const lr = document.createElement('div');
        lr.className = 'lrow extra';
        lr.textContent = b.lyrics[i].text;
        blk.appendChild(lr);
      }
    } else {
      for (const L of b.lyrics){
        const lr = document.createElement('div');
        lr.className = 'lrow';
        lr.textContent = L.text;
        blk.appendChild(lr);
      }
    }
    el.appendChild(blk);
  }
  return el;
}

// 行の左に置く切り替えボタン。コードらしい行ほど目立たせる
function toggleBtn(srcLine, isChord, cb, text){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'lntg' + (isChord ? ' on' : (looksChordish(text) ? ' hint' : ''));
  b.textContent = isChord ? '♪' : '＋';
  b.title = isChord ? 'この行を歌詞に戻す' : 'この行をコード行にする';
  b.setAttribute('aria-label', b.title);
  b.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); cb(srcLine); };
  return b;
}
// コードが混ざっていそうな行か（ボタンを目立たせる判断に使う）
function looksChordish(text){
  if (!text) return false;
  if (/[ぁ-んァ-ヶ一-龠]/.test(text)) return false;
  const toks = tokenize(text);
  if (!toks.length) return false;
  const nc = toks.filter(t=>{
    if (t.joined) return true;
    const c = classify(t.raw); return c && c.kind === 'c';
  }).length;
  return nc >= 1;
}

function alignNav(id){

// 指でなぞって離したときに、動かした距離と速さで判定する
function bindSwipe(el){
  let x0 = null, y0 = null, t0 = 0, lock = false;
  const reset = ()=>{ el.style.transition='transform .18s ease'; el.style.transform=''; x0=null; };
  el.addEventListener('touchstart', e=>{
    if (e.touches.length !== 1){ x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    t0 = Date.now(); lock = false;
    el.style.transition = 'none';
  }, {passive:true});
  el.addEventListener('touchmove', e=>{
    if (x0 === null) return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    // 横に 10px 以上、かつ縦より明らかに横が大きいときだけ横スワイプとみなす
    if (!lock && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.4) lock = true;
    if (lock){
      if (e.cancelable) e.preventDefault();
      el.style.transform = 'translateX(' + (dx * 0.32).toFixed(1) + 'px)';
    }
  }, {passive:false});
  el.addEventListener('touchend', e=>{
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dt = Date.now() - t0;
    const go = lock && (Math.abs(dx) > 58 || (dt < 400 && Math.abs(dx) > 32));
    reset();
    if (go) songStep(dx < 0 ? 1 : -1);
  }, {passive:true});
  el.addEventListener('touchcancel', reset, {passive:true});
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============ バージョン（同じ曲の別アレンジ） ============ */
// 同じ vgroup を持つ曲どうしが「同じ曲の別バージョン」
function groupKey(s){ return (s && (s.vgroup || s.id)) || ''; }
function versionsOf(s){ const k = groupKey(s); return songs.filter(x=>groupKey(x) === k); }

// 楽曲リストには、まとまりごとに1曲だけ出す（最後に開いたバージョン）
function groupReps(){
  const best = new Map();
  for (const s of songs){
    const k = groupKey(s), cur = best.get(k);
    if (!cur || (s.lastOpen||0) > (cur.lastOpen||0)) best.set(k, s);
  }
  const seen = new Set(), out = [];
  for (const s of songs){
    const k = groupKey(s);
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(best.get(k) || s);
  }
  return out;
}

// 歌詞だけを取り出して比べる。コード行・空白・記号は落とす
function lyricFingerprint(text){
  return String(text||'').replace(/\r\n/g,'\n').split('\n')
    .filter(L=>L.trim() && !isChordLine(L))
    .map(L=>L.normalize('NFKC').replace(/[\s\u3000！-／：-＠［-｀｛-～、-〜()（）「」『』。、,.!?・…ー—–-]/g,''))
    .filter(Boolean);
}
// 2文字ずつの並びを数える。改行の位置がずれていても比べられるようにするため
function charPairs(str){
  const m = new Map();
  const a = [...str];
  for (let i = 0; i + 1 < a.length; i++){
    const g = a[i] + a[i+1];
    m.set(g, (m.get(g)||0) + 1);
  }
  return m;
}
// 歌詞がどれくらい同じかを 0〜1 で出す
function lyricSimilarity(aText, bText){
  const A = lyricFingerprint(aText), B = lyricFingerprint(bText);
  const ja = A.join(''), jb = B.join('');
  // 行の切れ目が違うだけの行は「違う」に数えない（相手の歌詞のどこかに入っていれば同じ扱い）
  const onlyA = A.filter(L => L.length > 1 && !jb.includes(L));
  const onlyB = B.filter(L => L.length > 1 && !ja.includes(L));
  let ratio;
  if (!ja && !jb) ratio = 1;
  else if (!ja || !jb) ratio = 0;
  else if ([...ja].length < 2 || [...jb].length < 2) ratio = ja === jb ? 1 : 0;
  else {
    const PA = charPairs(ja), PB = charPairs(jb);
    let inter = 0, total = 0;
    PA.forEach((n, g)=>{ total += n; inter += Math.min(n, PB.get(g) || 0); });
    PB.forEach(n=>{ total += n; });
    ratio = (2 * inter) / total;
  }
  return {ratio, onlyA, onlyB};
}
// 比べるための形にそろえる（改行の違い・行末の空白・全角半角だけの差は無視）
function sameKey(text){
  return String(text == null ? '' : text)
    .replace(/\r\n/g, '\n')
    .split('\n')
    .map(L=>L.replace(/[\s\u3000]+$/, ''))
    .join('\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim()
    .normalize('NFKC');
}
// 曲名も中身もまったく同じものが、すでに入っていないか
function findSame(title, text, excludeId){
  const tk = titleKey(title), body = sameKey(text);
  if (!body) return null;
  return songs.find(x=>x.id !== excludeId &&
    titleKey(x.title) === tk && sameKey(x.text) === body) || null;
}
// 空いている欄だけを埋める（中身は同じなので本文は触らない）
function mergeInto(target, src){
  const filled = [];
  const put = (k, v, label)=>{
    if (v == null || v === '' || v === 0) return;
    if (target[k] == null || target[k] === '' || target[k] === 0 || target[k] === '未分類'){
      target[k] = v; filled.push(label);
    }
  };
  put('artist', (src.artist||'').trim(), 'アーティスト');
  put('key', (src.key||'').trim(), 'キー');
  put('capo', src.capo, 'カポ');
  put('bpm', src.bpm, 'テンポ');
  put('folder', (src.folder||'').trim(), 'ジャンル');
  put('vname', (src.vname||'').trim(), 'バージョン名');
  if (src.capoBase && !target.capoBase){ target.capoBase = src.capoBase; filled.push('譜面の書き方'); }
  return filled;
}

// 一致率から、おすすめの扱いと言い方を決める
function dupVerdict(pct){
  if (pct >= 70) return {mode:'version', note:'歌詞はほぼ同じです。同じ曲の別アレンジとみてよさそうです。'};
  if (pct >= 30) return {mode:'version', note:'歌詞の一部が同じです。歌い回しを変えた別バージョンかもしれません。'};
  return {mode:'separate', note:'曲名は同じですが歌詞はかなり違います。別の曲かもしれません。'};
}

// 曲名をゆるく揃えて比べる（全角半角・空白・記号の違いは無視）
function titleKey(t){
  return String(t||'').normalize('NFKC').toLowerCase()
    .replace(/[\s\u3000~～!！?？.。,、'"“”‘’()（）\[\]「」【】_\-–—]/g,'');
}
// 取り込もうとしている曲が、すでにある曲と同じ名前かどうか調べる
function findDuplicate(title, text, excludeGroup){
  const tk = titleKey(title);
  if (!tk) return null;
  const reps = groupReps().filter(x=>titleKey(x.title) === tk && groupKey(x) !== excludeGroup);
  if (!reps.length) return null;
  let best = null;
  for (const r of reps){
    for (const v of versionsOf(r)){
      const sim = lyricSimilarity(text, v.text);
      if (!best || sim.ratio > best.sim.ratio) best = {song:v, rep:r, sim};
    }
  }
  return best;
}
// バージョン名が重ならないようにする
function uniqueVersionName(groupId, want){
  const used = new Set(songs.filter(x=>groupKey(x)===groupId).map(x=>(x.vname||'').trim()).filter(Boolean));
  let base = String(want||'').trim();
  if (!base){
    let n = songs.filter(x=>groupKey(x)===groupId).length + 1;
    while (used.has('バージョン' + n)) n++;
    return 'バージョン' + n;
  }
  if (!used.has(base)) return base;
  let n = 2;
  while (used.has(base + ' (' + n + ')')) n++;
  return base + ' (' + n + ')';
}
// 表示用。名前が無いバージョンは「もとの版」と出す
function vLabel(s){ return (s && (s.vname||'').trim()) || 'もとの版'; }

// 曲画面のバージョン切り替え
function switchVersion(id){
  const s = songs.find(x=>x.id===id);
  if (!s) return;
  stopScroll(); stopSongRec();
  // ページめくりの並びのなかで、今いる位置を新しいバージョンに差し替える
  const cur = navIds.indexOf(openSong);
  if (cur >= 0) navIds[cur] = id; else alignNav(id);
  openSong = id;
  s.lastOpen = Date.now();
  s.plays = (s.plays||0) + 1;
  persistCount();
  render();
  document.getElementById('main').scrollTop = 0;
}

/* ============ 8. 操作 ============ */
function tr(n){ const s=songs.find(x=>x.id===openSong); s.transpose=(s.transpose||0)+n; persist(); render(); }
// キーを選ぶ画面。選んだキーで鳴るように移調する
function openKeyPick(){
  const s = songs.find(x=>x.id===openSong); if (!s) return;
  const now = soundKeyOf(s);
  const minor = /m$/.test(normTok(String(now||'')));
  const list = minor ? KEY_MINOR : KEY_MAJOR;
  const same = k => normTok(k).toLowerCase() === normTok(String(now||'')).toLowerCase();
  document.getElementById('popName').textContent = 'キーを選ぶ';
  document.getElementById('popDesc').textContent =
    `いま ${now || '—'} で鳴ります。選ぶとその音で鳴るように移調します（カポはそのまま）。`;
  document.getElementById('popGrid').innerHTML = `<div style="flex:1 1 100%">
    <div class="picker kp"><span class="kprow">${
      list.map(k=>`<button class="pk${same(k)?' on':''}" onclick="pickKey('${k}')">${k}</button>`).join('')
    }</span></div>
    <p class="hint">元のキーは ${esc(s.key || '—')} です。
      ${s.transpose ? `いま ${s.transpose > 0 ? '+' : ''}${s.transpose} 半音ずらしています。` : ''}</p>
    <div class="btnrow" style="margin-top:10px">
      ${s.transpose ? '<button class="ghost" onclick="pickKeyReset()">元のキーに戻す</button>' : ''}
    </div></div>`;
  document.getElementById('pop').hidden = false;
}
function pickKey(k){
  const s = songs.find(x=>x.id===openSong); if (!s) return;
  const from = pc(normTok(String(s.key||'C')).replace(/m$/,''));
  const to   = pc(normTok(k).replace(/m$/,''));
  if (from >= 0 && to >= 0){
    let d = (to - from + 12) % 12;
    if (d > 6) d -= 12;                 // 近い方へ回す
    s.transpose = d;
  }
  persist(); closePop(); render();
}
function pickKeyReset(){
  const s = songs.find(x=>x.id===openSong); if (!s) return;
  s.transpose = 0; persist(); closePop(); render();
}

// カポを選ぶ画面。何カポで何の押さえ方になるかを並べて見せる
function openCapo(){
  const s = songs.find(x=>x.id===openSong); if (!s) return;
  const sound = shiftKey(s.key, s.transpose || 0);
  const rows = [];
  for (let n = 0; n <= 12; n++){
    const play = shiftKey(sound, -n);
    rows.push({n, play, easy: isEasyKey(play), cur: n === (s.capo||0)});
  }
  const easy = rows.filter(r=>r.easy && r.n > 0);
  document.getElementById('popName').textContent = 'カポを選ぶ';
  document.getElementById('popDesc').textContent =
    `この曲は ${sound || '—'} で鳴ります。鳴る音は変えずに、押さえる形だけを選びます。` +
    (easy.length ? `　押さえやすいのは ${easy.map(r=>'カポ'+r.n+'（'+r.play+'）').join('、')} です。` : '');
  document.getElementById('popGrid').innerHTML = `<div style="flex:1 1 100%">
    <div class="capolist">${rows.map(r=>`
      <button class="capor${r.cur?' on':''}${r.easy?' easy':''}" onclick="setCapo(${r.n})">
        <span class="cn">${r.n === 0 ? 'カポなし' : 'カポ ' + r.n}</span>
        <span class="cp">${esc(r.play || '—')}</span>
        <span class="ce">${r.easy ? '押さえやすい' : ''}</span>
      </button>`).join('')}</div>
    <p class="hint">左が位置、右がそのときに押さえるコードの形です。鳴る音はどれも ${esc(sound||'—')} のまま変わりません。</p>
    </div>`;
  document.getElementById('pop').hidden = false;
}
function setCapo(n){
  const s = songs.find(x=>x.id===openSong); if (!s) return;
  if (s.textCapo == null) s.textCapo = s.capo || 0;
  s.capo = Math.max(0, Math.min(12, n));
  persist(); closePop(); render();
}
function capo(n){
  const s = songs.find(x=>x.id===openSong); if (!s) return;
  // 最初に動かすとき、いま書いてある譜面が何カポ用だったかを記録する
  if (s.textCapo == null) s.textCapo = s.capo || 0;
  s.capo = Math.max(0, Math.min(12, (s.capo||0)+n));
  persist(); render();
}
function setBpm(v){
  const s=songs.find(x=>x.id===openSong); s.bpm=+v;
  document.getElementById('bpmOut').textContent = v+' BPM';
  const st = document.querySelector('.stat'); if (st) st.children[1].innerHTML = `1行あたり <b>${(60/s.bpm*s.barsPerLine*4).toFixed(1)}</b> 秒`;
  persist();
}
function toggleScroll(){ scrolling ? stopScroll() : startScroll(); }
function startScroll(){
  const s=songs.find(x=>x.id===openSong); if(!s) return;
  scrolling = true;
  const main = document.getElementById('main');
  const pxPerSec = (s.bpm/60) * 9;  // 目安
  let last = performance.now(), acc = 0;
  const step = (t)=>{
    if (!scrolling) return;
    acc += (t-last)/1000 * pxPerSec; last = t;
    if (acc >= 1){ main.scrollTop += Math.floor(acc); acc -= Math.floor(acc); }
    if (main.scrollTop + main.clientHeight >= main.scrollHeight - 1){ stopScroll(); return; }
    scrollTimer = requestAnimationFrame(step);
  };
  scrollTimer = requestAnimationFrame(step);
  const b = document.getElementById('scrollBtn'); if (b) b.textContent='停止';
}
function stopScroll(){
  scrolling = false;
  if (scrollTimer) cancelAnimationFrame(scrollTimer);
  const b = document.getElementById('scrollBtn'); if (b) b.textContent='自動スクロール';
}
document.getElementById('main').addEventListener('touchstart', ()=>{ if(scrolling) stopScroll(); }, {passive:true});

// パソコンでは ← → キーでも前後の曲へ移動できる
document.addEventListener('keydown', e=>{
  if (!openSong || editing) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  const dlg = document.getElementById('pop');
  if (dlg && !dlg.hidden) return;
  e.preventDefault();
  songStep(e.key === 'ArrowRight' ? 1 : -1);
});



/* ---- 書き出し ---- */
function download(name, text){
  const blob = new Blob([text], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function songToMd(s){
  const fm = ['---', 'title: ' + s.title, 'artist: ' + (s.artist||''),
    ...((s.vname||'').trim() ? ['version: ' + s.vname.trim()] : []),
    ...(capoBaseOf(s) === 'sound' ? ['capobase: sound'] : []),
    'key: ' + (s.key||''), 'capo: ' + (s.capo||0), 'bpm: ' + (s.bpm||''),
    'transpose: ' + (s.transpose||0), 'folder: ' + (s.folder||'未分類'),
    'updated: ' + new Date().toISOString(), 'format: 1', '---', '', ''].join('\n');
  return fm + s.text + '\n';
}
function safeName(t){ return String(t).replace(/[\\/:*?"<>|]/g,'_').slice(0,80); }
function exportFileName(s){
  const v = (s.vname||'').trim();
  return safeName(s.title || '無題') + (v ? ' - ' + safeName(v) : '');
}
function exportSong(id){
  const s = songs.find(x=>x.id===id); if (!s) return;
  download(exportFileName(s) + '.md', songToMd(s));
}
async function exportSelected(){
  if (isViewer || !selected.size) return;
  const items = withVersions(songs.filter(x=>selected.has(x.id)));
  if (!items.length) return;
  if (items.length === 1){ exportSong(items[0].id); selectMode = false; selected.clear(); render(); return; }
  await zipSongs(items, '選んだ' + selected.size + '曲');
  selectMode = false; selected.clear();
  render();
}

// 複数の曲をまとめて1つの zip にする
async function zipSongs(items, name){
  if (typeof JSZip === 'undefined'){ items.forEach(s=>exportSong(s.id)); return; }
  const zip = new JSZip(), dir = zip.folder(safeName(name));
  const used = new Set();
  items.forEach(s=>{
    const base = exportFileName(s);
    let fn = base, n = 2;
    while (used.has(fn)){ fn = base + ' (' + (n++) + ')'; }
    used.add(fn);
    dir.file(fn + '.md', songToMd(s));
  });
  const blob = await zip.generateAsync({type:'blob'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = safeName(name) + '.zip';

// そのキーでよく使うコードを並べる
function paletteFor(keyStr){
  const m = String(keyStr||'C').trim().match(/^([A-G][#b]?)\s*(m|min|minor)?/i);
  const root = m ? (FLATEQ[m[1]] || m[1]) : 'C';
  const minor = !!(m && m[2]);
  const r = pc(root); if (r < 0) return {main:['C','Dm','Em','F','G','Am'], extra:[]};
  // フラット系のキーは ♭ 表記で出す
  const FLATN = {1:'Db', 3:'Eb', 6:'Gb', 8:'Ab', 10:'Bb'};
  const useFlat = /b/.test(m ? m[1] : '') ||
    (!minor && [5,10,3,8,1].includes(r)) || (minor && [2,7,0,5,10].includes(r));
  const name = n => { const i = (r + n + 12) % 12;
    return (useFlat && FLATN[i]) ? FLATN[i] : SHARP[i]; };
  const at = (n, q) => name(n) + q;
  const main = minor
    ? [at(0,'m'), at(3,''), at(5,'m'), at(7,'m'), at(8,''), at(10,''), at(2,'dim')]
    : [at(0,''), at(2,'m'), at(4,'m'), at(5,''), at(7,''), at(9,'m'), at(11,'dim')];
  const extra = minor
    ? [at(7,'7'), at(0,'m7'), at(3,'maj7'), at(5,'m7'), at(8,'maj7')]
    : [at(7,'7'), at(0,'maj7'), at(9,'m7'), at(5,'maj7'), at(7,'sus4'), at(2,'7')];
  return {main, extra};
}

// 一番長い行が収まるまで文字を少しずつ小さくする（横スクロールを出さないため）
// 編集画面の確認用。入力欄とまったく同じ文字・同じ桁で出し、コードだけ色を付ける。
// 折り返しも組み直しもしないので、左右の窓が1行ずつぴったり対応する
function renderAligned(song, opts){
  opts = opts || {};
  const n = shiftOf(song);
  const pref = n ? keyPrefersFlat(shownKeyOf(song)) : false;
  const el = document.createElement('div');
  el.className = 'aligned';
  const lines = String(song.text == null ? '' : song.text).replace(/\r\n/g,'\n').split('\n');
  lines.forEach((line, i)=>{
    const row = document.createElement('div');
    row.className = 'arow';
    let kind = line.trim() ? lineKind(line) : 'blank';
    // 括弧だけの行（メモ）は、歌詞ではなくメモとして薄く出す
    if (kind === 'lyric' && /^[\s\u3000]*[(（][^)）]*[)）][\s\u3000]*$/.test(line)) kind = 'memo';
    if (opts.lineToggle)
      row.appendChild(toggleBtn(i, kind === 'chord', opts.lineToggle, line));
    const tx = document.createElement('span');
    tx.className = 'atx';
    if (kind === 'memo'){
      const sp = document.createElement('span');
      sp.className = 'at-n';
      sp.textContent = line;
      tx.appendChild(sp);
    } else if (kind === 'chord' || kind === 'section'){
      // @ は目印なので色を付けず、その分だけ位置をずらして中身を見る
      const sm = stripMark(line);
      const base = sm.mark.length;
      let at = 0;
      if (base){
        // ＠ は「この行はコード行」という目印なので、字は出さずに幅だけ空けておく。
        // コード行であることは左の ♪ で分かる
        const mk = document.createElement('span');
        mk.className = 'at-m';
        mk.textContent = sm.mark.replace(/[@＠]/, c=>c === '＠' ? '\u3000' : ' ');
        tx.appendChild(mk);
        at = base;
      }
      for (const t0 of tokenize(sm.body)){
        const t = {...t0, ci: t0.ci == null ? null : t0.ci + base};
        if (t.ci == null || t.ci < at) continue;
        // 元の行と1文字でも食い違うなら色を付けない（文字を書き換えないため）
        if (line.substr(t.ci, t.raw.length) !== t.raw) continue;
        const c = t.joined ? {kind:'c', text:t.joined} : classify(t.raw);
        if (!c) continue;
        if (t.ci > at) tx.appendChild(document.createTextNode(line.slice(at, t.ci)));
        const sp = document.createElement('span');
        sp.className = 'at-' + c.kind;
        sp.textContent = t.raw;
        if (c.kind === 'c'){
          const look = transposeChord(c.text, n, pref);
          sp.tabIndex = 0;
          sp.onclick = e=>{ e.stopPropagation(); showChord(look); };
          sp.onkeydown = e=>{ if (e.key === 'Enter'){ e.preventDefault(); showChord(look); } };
        }
        tx.appendChild(sp);
        at = t.ci + t.raw.length;
      }
      if (at < line.length) tx.appendChild(document.createTextNode(line.slice(at)));
    } else {
      tx.textContent = line;
    }
    if (!line.length) tx.appendChild(document.createTextNode('\u00a0'));
    row.appendChild(tx);
    el.appendChild(row);
  });
  return el;
}

function fitSheet(box){
  const sheet = box.querySelector('#sheet');
  if (!sheet) return;
  const avail = box.clientWidth - 44;
  if (avail <= 0) return;
  let size = 16;
  sheet.style.setProperty('--sheet-size', size + 'px');
  for (let i = 0; i < 14; i++){
    let widest = 0;
    sheet.querySelectorAll('.lrow, .crow').forEach(r=>{
      const w = r.scrollWidth || 0;
      if (w > widest) widest = w;
    });
    if (widest <= avail || size <= 9) break;
    size = Math.max(9, size - 1);
    sheet.style.setProperty('--sheet-size', size + 'px');
  }
}

// その行をコード行にする／歌詞行に戻す（本文の先頭の @ を付け外しする）
function toggleLineAt(i){
  const ta = document.getElementById('eText') || document.getElementById('bText')
          || document.getElementById('draftText');
  if (!ta) return;
  const lines = ta.value.replace(/\r\n/g,'\n').split('\n');
  if (i < 0 || i >= lines.length) return;
  lines[i] = /^[@＠]/.test(lines[i])
    ? lines[i].replace(/^[@＠]\s?/, '')
    : '@' + lines[i];
  ta.value = lines.join('\n');
  ta.dispatchEvent(new Event('input', {bubbles:true}));
}

// 上下（または左右）のスクロールを合わせる
let _syncing = false;
function syncScroll(fromId, toId){
  if (_syncing) return;
  const a = document.getElementById(fromId), b = document.getElementById(toId);
  if (!a || !b) return;
  const ra = a.scrollHeight - a.clientHeight;
  const rb = b.scrollHeight - b.clientHeight;
  if (ra <= 0 || rb <= 0){
    // 縦に動かせなくても、横だけは合わせる
    if (!_syncing){
      _syncing = true;
      b.scrollLeft = a.scrollLeft;
      requestAnimationFrame(()=>{ _syncing = false; });
    }
    return;
  }
  _syncing = true;
  b.scrollTop = (a.scrollTop / ra) * rb;
  // 横にずらしたときも合わせる（左右の余白をそろえてあるので同じ値でよい）
  b.scrollLeft = a.scrollLeft;
  requestAnimationFrame(()=>{ _syncing = false; });
}

// コード譜のカーソル位置にメモを差し込む。括弧で囲むのでコードとは読まれない
function insertMemo(text){
  const ta = document.getElementById('eText') || document.getElementById('bText');
  if (!ta) return;
  const box = document.getElementById('memoBox');
  let t = String(text != null ? text : (box ? box.value : '')).trim();
  if (!t){ alertShare('入れたい内容を書いてください'); return; }
  // すでに括弧で囲まれていれば二重にしない
  if (!/^[(（][\s\S]*[)）]$/.test(t)) t = '（' + t + '）';

  const v = ta.value;
  let a = ta.selectionStart, b = ta.selectionEnd;
  if (a == null){ a = b = v.length; }
  // 選んでいる範囲があれば、それを置き換える
  let before = v.slice(0, a), after = v.slice(b);
  // コードや文字にくっつかないよう、前後に空白を1つずつ足す
  const pad0 = before && !/[\s\u3000]$/.test(before) ? ' ' : '';
  const pad1 = after && !/^[\s\u3000\n]/.test(after) ? ' ' : '';
  const ins = pad0 + t + pad1;
  ta.value = before + ins + after;
  const pos = a + ins.length;
  ta.focus();
  ta.setSelectionRange(pos, pos);
  ta.dispatchEvent(new Event('input', {bubbles:true}));
  if (box && text == null) box.value = '';
  alertShare('メモを入れました');
}

// 譜面のコードが「押さえる形」か「鳴る音」かを決める。文字も合わせて書き換える
function setCapoBase(v){
  const s = curEdit(); if (!s) return;
  const next = v === 'sound' ? 'sound' : 'play';
  if (capoBaseOf(s) === next) return;
  const ta = curEditText();
  const c = parseInt(s.capo, 10) || 0;
  if (ta && c){
    const sound = shiftKey(s.key, s.transpose || 0);
    // 押さえる形 ⇄ 鳴る音 を行き来する
    const nShift = next === 'sound' ? c : -c;
    const pref = keyPrefersFlat(next === 'sound' ? sound : shiftKey(sound, -c));
    ta.value = retuneText(ta.value, nShift, pref);
    if (s === draft) draft.text = ta.value;
  }
  s.capoBase = next;
  s.textCapo = next === 'play' ? c : 0;
  redrawKeyCard();
}

// クラウド側の曲を少しずつ消す。1回に送る数を抑え、失敗した分は入れ直して3回まで試す
async function deleteRemote(ids, onProgress){
  if (!fb || !fbUser || !ids.length) return {done:0, left:0, error:null};
  const CHUNK = 80;
  let done = 0, error = null;
  let rest = [...new Set(ids)];
  const total = rest.length;
  for (let pass = 0; pass < 3 && rest.length; pass++){
    const failed = [];
    for (let i = 0; i < rest.length; i += CHUNK){
      const part = rest.slice(i, i + CHUNK);
      try{
        const b = fb.batch();
        part.forEach(id=>b.delete(songsCol().doc(id)));
        await b.commit();
        done += part.length;
        part.forEach(id=>pushed.delete(id));
        if (onProgress) onProgress(done, total);
      }catch(e){ error = e; failed.push(...part); }
    }
    rest = failed;
    if (rest.length) await new Promise(r=>setTimeout(r, 900));
  }
  return {done, left: rest.length, error};
}

// 何が変わるかを先に出す（まだ保存はしない）
function tidyPlan(){
  const out = [];
  songs.forEach(s=>{
    const p = parseSheet(s.text || '');
    const next = {...s}, why = [];
    if (p.body && p.body !== s.text){
      next.text = p.body;
      const before = (s.text||'').split('\n').length;
      const after  = p.body.split('\n').length;
      why.push('本文から曲情報の行を外す（' + before + '行 → ' + after + '行）');
    }
    if (!s.artist && p.artist){ next.artist = p.artist; why.push('アーティスト: ' + p.artist); }
    if (!s.capo && p.capo){ next.capo = p.capo; why.push('カポ: ' + p.capo); }
    if (!s.bpm && p.bpm){ next.bpm = p.bpm; why.push('テンポ: ' + p.bpm); }
    if (!s.key && p.key){ next.key = p.key; why.push('キー: ' + p.key); }
    else if (tidyRekey && p.key && p.key !== s.key){
      next.key = p.key;
      why.push('キー: ' + (s.key||'—') + ' → ' + p.key + (p.keyGuessed ? '（推測）' : ''));
    }

    // カポ付きなのに、キーの欄に「押さえ方」のキーが入っている曲を直す。
    // 以前は譜面のコードからキーを決めていたので、カポのぶん低いまま入っている
    const capoNow = next.capo || s.capo || 0;
    const keyNow  = next.key  || s.key  || '';
    if (capoNow > 0 && keyNow){
      const g = guessKey(parseBody(next.text != null ? next.text : (s.text || '')));
      if (g){
        const played = g.root + (g.mode === 'minor' ? 'm' : '');
        const sameAsPlayed = pc(normTok(keyNow).replace(/m$/,'')) === pc(normTok(played).replace(/m$/,''));
        const raised = shiftKey(keyNow, capoNow);
        if (sameAsPlayed && pc(normTok(raised).replace(/m$/,'')) !== pc(normTok(keyNow).replace(/m$/,''))){
          next.key = raised;
          why.push('キーの欄が押さえ方のままでした: ' + keyNow + ' → ' + raised +
                   '（カポ' + capoNow + 'ぶん上げて鳴る音にする）');
        }
      }
    }
    if (why.length) out.push({id:s.id, title:s.title, next, why});
  });
  return out;
}

function resetProgress(txt){
  const el = document.getElementById('resetProg');
  if (el) el.textContent = txt;
}
async function doResetAll(){
  const w = document.getElementById('resetWord');
  if (!w || w.value.trim() !== '消す'){ alertShare('「消す」と入力してください'); return; }

  // 消している間は押せないようにして、進み具合を出す
  document.getElementById('popGrid').innerHTML =
    `<div style="flex:1 1 100%"><p id="resetProg" style="margin:0">消しています…</p></div>`;

  syncPaused = true;
  let left = 0, err = null;
  try{
    // 手元に無くてもクラウドに残っている分まで拾う
    let ids = songs.map(x=>x.id);
    if (fb && fbUser){
      try{
        const snap = await songsCol().get();
        ids = [...new Set([...ids, ...snap.docs.map(d=>d.id)])];
      }catch(e){}
    }
    songs = []; playlists = []; openList = null;
    selectMode = false; selected.clear();
    editing = null; openSong = null; folderFilter = null;
    navIds = []; listOrder = []; plOrder = [];
    pushed = new Map();                 // 二重に消しにいかないようにする
    ids.forEach(id=>delAudio(id));
    try{ localStorage.removeItem('cn_songs'); localStorage.removeItem('cn_playlist'); }catch(e){}
    persistMeta();

    if (fb && fbUser && ids.length){
      resetProgress(`消しています… 0 / ${ids.length}`);
      const r = await deleteRemote(ids, (d,t)=>resetProgress(`消しています… ${d} / ${t}`));
      err = r.error;
      left = r.left;
      // 本当に空になったか、サーバーに聞いて確かめる
      resetProgress('確かめています…');
      let n = await remoteCount();
      if (n > 0){
        const snap = await songsCol().get({source:'server'}).catch(()=>null);
        if (snap){
          const r2 = await deleteRemote(snap.docs.map(d=>d.id),
            (d,t)=>resetProgress(`残りを消しています… ${d} / ${t}`));
          err = r2.error || err;
          n = await remoteCount();
        }
      }
      left = n > 0 ? n : (n < 0 ? left : 0);
    }
  } finally {
    syncPaused = false;
  }
  closePop(); render();
  if (left > 0){
    if (err) showSyncError(err, '全消去');
    alertShare(left + '曲が消しきれませんでした。もう一度「すべて消す」を押してください');
  } else {
    alertShare('すべて消しました');
  }
}

/* ---- 指でつかんで並べ替える ---- */
function enableReorder(){
  const box = document.getElementById('plBox');
  if (!box) return;
  let dragEl = null, startY = 0, placeholder = null;

  box.querySelectorAll('.r.drag').forEach(row=>{
    const grip = row.querySelector('.grip');
    if (!grip) return;
    grip.style.touchAction = 'none';
    grip.addEventListener('pointerdown', e=>{
      e.preventDefault();
      dragEl = row; startY = e.clientY;
      row.setPointerCapture?.(e.pointerId);
      row.classList.add('dragging');
      placeholder = document.createElement('div');
      placeholder.className = 'ph-slot';
      placeholder.style.height = row.offsetHeight + 'px';
      row.after(placeholder);
      row.style.position = 'fixed';
      row.style.width = box.offsetWidth + 'px';
      row.style.zIndex = 40;
      const r = row.getBoundingClientRect();
      row._dy = e.clientY - r.top;
      row.style.top = (e.clientY - row._dy) + 'px';
      row.style.left = box.getBoundingClientRect().left + 'px';

      const move = ev=>{
        if (!dragEl) return;
        ev.preventDefault();
        dragEl.style.top = (ev.clientY - dragEl._dy) + 'px';
        const rows = [...box.querySelectorAll('.r:not(.dragging)')];
        let placed = false;
        for (const other of rows){
          const b = other.getBoundingClientRect();
          if (ev.clientY < b.top + b.height / 2){
            other.before(placeholder); placed = true; break;
          }
        }
        if (!placed) box.appendChild(placeholder);
      };
      const up = ()=>{
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        document.removeEventListener('pointercancel', up);
        if (!dragEl) return;
        placeholder.replaceWith(dragEl);
        dragEl.classList.remove('dragging');
        dragEl.style.cssText = '';
        dragEl = null;
        // 画面の並びをデータに書き戻す
        const pl = playlists.find(x=>x.id===openList);
        if (pl){
          const order = [...box.querySelectorAll('.r')].map(r=>r.dataset.id).filter(Boolean);
          if (order.length === pl.songs.length) pl.songs = order;
          persistMeta();
        }
        render();
      };
      document.addEventListener('pointermove', move, {passive:false});
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', up);
    });
  });
}

/* ---- 旧 Word（.doc / OLE2 複合文書）---- */
function readDocBuffer(arrayBuffer){
  const u8 = new Uint8Array(arrayBuffer);
  if (u8.length < 512) throw new Error('ファイルが小さすぎます');
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  // OLE2 の目印
  if (dv.getUint32(0, true) !== 0xE011CFD0 || dv.getUint32(4, true) !== 0xE11AB1A1)
    throw new Error('古い Word 形式ではありません');

  const sect = 1 << dv.getUint16(30, true);
  const dirStart = dv.getUint32(48, true);
  const fatCount = dv.getUint32(44, true);

  // FAT（セクタのつながり表）を組み立てる
  const fat = [];
  for (let i = 0; i < Math.min(fatCount, 109); i++){
    const sc = dv.getUint32(76 + i * 4, true);
    if (sc === 0xFFFFFFFF) break;
    const off = (sc + 1) * sect;
    if (off + sect > u8.length) break;
    for (let j = 0; j < sect; j += 4) fat.push(dv.getUint32(off + j, true));
  }
  const chain = s=>{
    const out = []; let c = s, g = 0;
    while (c !== 0xFFFFFFFE && c < fat.length && g++ < 200000){ out.push(c); c = fat[c]; }
    return out;
  };

  // ディレクトリから WordDocument を探す
  let wd = null;
  for (const sc of chain(dirStart)){
    const base = (sc + 1) * sect;
    for (let k = 0; k + 128 <= sect; k += 128){
      const o = base + k;
      if (o + 128 > u8.length) break;
      const nlen = dv.getUint16(o + 64, true);
      if (nlen < 2) continue;
      let name = '';
      for (let i = 0; i < nlen - 2; i += 2) name += String.fromCharCode(dv.getUint16(o + i, true));
      if (name === 'WordDocument'){
        wd = {start: dv.getUint32(o + 116, true), size: dv.getUint32(o + 120, true)};
      }
    }
    if (wd) break;
  }
  if (!wd || !wd.size) throw new Error('本文が見つかりません');

  // ストリームを連結
  const bytes = new Uint8Array(wd.size);
  let p = 0;
  for (const sc of chain(wd.start)){
    const off = (sc + 1) * sect;
    const n = Math.min(sect, wd.size - p);
    if (n <= 0) break;
    if (off + n > u8.length) break;
    bytes.set(u8.subarray(off, off + n), p);
    p += n;
  }
  const d2 = new DataView(bytes.buffer);
  const fcMin = d2.getUint32(24, true);
  const fcMac = d2.getUint32(28, true);
  const len = fcMac - fcMin;
  if (!(len > 0) || fcMin >= bytes.length) throw new Error('本文の位置を読めません');

  const tidy = t => t
    .replace(/[\r\x07\x0B\x0C]/g, '\n')
    .replace(/[\x00-\x08\x0E-\x1F]/g, '')
    .replace(/\u0013[^\u0014\u0015]*\u0014?/g, '')   // フィールドの指示部分
    .replace(/[\u0013\u0014\u0015]/g, '')
    .replace(/\n{3,}/g, '\n\n');
  // 文字化けは英数字だらけになるので、日本語の字を重く見る
  const score = t => {
    const cjk = (t.match(/[ぁ-んァ-ヶ一-龠ー、。]/g) || []).length;
    const lat = (t.match(/[A-Za-z]/g) || []).length;
    const bad = (t.match(/[\uFFFD\u0000-\u0008]/g) || []).length;
    return cjk * 4 + lat - bad * 6;
  };

  // 2バイト（UTF-16LE）として読む
  let a = '';
  for (let i = fcMin; i + 1 < Math.min(fcMin + len * 2, bytes.length); i += 2){
    const c = bytes[i] | (bytes[i+1] << 8);
    if (c === 9) a += '\t'; else if (c >= 10) a += String.fromCharCode(c);
  }
  a = tidy(a);

  // 1バイト（Shift-JIS）として読む
  let b = '';
  try{
    const slice = bytes.subarray(fcMin, Math.min(fcMin + len, bytes.length));
    b = tidy(new TextDecoder('shift-jis', {fatal:false}).decode(slice));
  }catch(e){ b = ''; }

  const best = score(a) >= score(b) ? a : b;
  if (!score(best)) throw new Error('文字を取り出せませんでした');
  return best;
}

async function readDoc(file){
  return readDocBuffer(await file.arrayBuffer());
}

// 中身が旧 Word 形式かどうか（拡張子があてにならないので先頭を見る）
async function isOle2(file){
  try{
    const head = new Uint8Array(await file.slice(0, 8).arrayBuffer());
    return head[0]===0xD0 && head[1]===0xCF && head[2]===0x11 && head[3]===0xE0;
  }catch(e){ return false; }
}

// XML の実体参照をもとの文字に戻す
function xmlUnescape(t){
  return t.replace(/&#x([0-9a-fA-F]+);/g, (m,h)=>String.fromCodePoint(parseInt(h,16)))
          .replace(/&#(\d+);/g, (m,d)=>String.fromCodePoint(+d))
          .replace(/&lt;/g,'<').replace(/&gt;/g,'>')
          .replace(/&quot;/g,'"').replace(/&apos;/g,"'")
          .replace(/&amp;/g,'&');
}

// .docx は ZIP を展開して word/document.xml から段落を取り出す
async function readDocx(file){
  if (typeof JSZip === 'undefined') throw new Error('展開の準備ができていません');
  let zip;
  try{ zip = await JSZip.loadAsync(file); }
  catch(e){ throw new Error('ZIP として開けません（古い .doc 形式かもしれません）'); }

  // 本体の場所は決め打ちにせず、word/ の中から探す
  let entry = zip.file('word/document.xml');
  if (!entry){
    const cand = Object.keys(zip.files)
      .filter(n=>/^word\/document\d*\.xml$/i.test(n) || /document\.xml$/i.test(n));
    if (cand.length) entry = zip.file(cand[0]);
  }
  if (!entry) throw new Error('本文（document.xml）が見つかりません');
  const xml = await entry.async('string');

  // <w:p/> のように中身が空の段落もあるので、開始位置で区切る
  const out = [];
  const re = /<w:p(\s[^>]*)?>/g;
  const pieces = [];
  let m;
  while ((m = re.exec(xml)) !== null){
    // <w:p ... /> は中身のない段落（＝空行）
    if ((m[1] || '').endsWith('/')){ pieces.push({self:true}); continue; }
    const end = xml.indexOf('</w:p>', re.lastIndex);
    pieces.push({self:false, body: end < 0 ? '' : xml.slice(re.lastIndex, end)});
    if (end >= 0) re.lastIndex = end + 6;
  }
  for (const pc of pieces){
    if (pc.self){ out.push(''); continue; }
    let line = '';
    // 文字・タブ・改行を、書かれている順に組み立てる
    const tre = /<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:tab\s*\/?>|<w:br\s*\/?>|<w:cr\s*\/?>/g;
    let t;
    while ((t = tre.exec(pc.body)) !== null){
      if (t[1] !== undefined) line += xmlUnescape(t[1]);
      else if (/^<w:tab/.test(t[0])) line += '\t';
      else line += '\n';
    }
    out.push(line);
  }
  // タブは全角スペース2つぶんに均して、桁を保つ
  return out.join('\n').replace(/\t/g, '\u3000\u3000');
}

// ZIP の中から、読めるファイルだけを取り出して普通のファイルと同じ形にする
const READABLE = /\.(md|txt|doc|docx|dot|pdf|jpe?g|png|gif|bmp|webp)$/i;
async function openZip(file){
  if (typeof JSZip === 'undefined') throw new Error('展開の準備ができていません');
  const zip = await JSZip.loadAsync(file);
  const base = file.name.replace(/\.zip$/i, '');
  const out = [];
  const names = Object.keys(zip.files).sort();
  for (const name of names){
    const entry = zip.files[name];
    if (entry.dir) continue;
    const leaf = name.split('/').pop();
    // Mac で作った ZIP に混ざる管理用ファイルは飛ばす
    if (!leaf || leaf.startsWith('.') || leaf.startsWith('._')) continue;
    if (name.startsWith('__MACOSX/')) continue;
    if (!READABLE.test(leaf)) continue;
    const blob = await entry.async('blob');
    const f = new File([blob], leaf, {type: blob.type || 'application/octet-stream'});
    // フォルダの代わりに ZIP の中の道のりを渡す（ジャンル名の手がかりになる）
    Object.defineProperty(f, 'webkitRelativePath', {value: base + '/' + name});
    out.push(f);
  }
  return out;
}

async function takeFiles(fileList){
  let files = [...fileList];

  // ZIP が混じっていたら、先に中身を出しておく
  const zips = files.filter(f=>/\.zip$/i.test(f.name));
  if (zips.length){
    setBatchNote('ZIP を開いています…');
    const expanded = [];
    const bad = [];
    for (const z of zips){
      try{
        const inner = await openZip(z);
        if (inner.length) expanded.push(...inner);
        else bad.push({name:z.name, why:'中に読めるファイルがありません'});
      }catch(e){
        const raw = (e && e.message) || '';
        const why = /end of central directory|corrupted zip|invalid signature|not a zip/i.test(raw)
          ? 'ZIP として開けません（壊れているかもしれません）'
          : /encrypted|password/i.test(raw) ? 'パスワード付きの ZIP は開けません'
          : (raw || '開けません').slice(0, 40);
        bad.push({name:z.name, why});
      }
    }
    files = files.filter(f=>!/\.zip$/i.test(f.name)).concat(expanded);
    if (bad.length){
      batch = bad.map(b=>({name:b.name, ok:false, why:b.why}));
      if (!files.length){ setBatchNote(''); drawBatch(); return; }
    }
    setBatchNote(expanded.length + ' 件のファイルを取り出しました');
  }

  const out = [];
  if (files.some(f=>/\.(pdf|jpe?g|png|gif|bmp|webp)$/i.test(f.name)))
    setBatchNote('読み取っています…');
  for (const f of files){
    const ext = (f.name.split('.').pop()||'').toLowerCase();
    const rel = f.webkitRelativePath || f.name;
    const folder = rel.includes('/') ? rel.split('/').slice(-2)[0] : '取り込み';
    let text = '';
    try{
      if (ext === 'md' || ext === 'txt') text = await readText(f);
      else if (ext === 'doc' || ext === 'docx' || ext === 'dot')
        text = (await isOle2(f)) ? await readDoc(f) : await readDocx(f);
      else if (ext === 'pdf') text = await readPdf(f);
      else if (['jpg','jpeg','png','gif','bmp','webp'].includes(ext)){
        setBatchNote(`「${f.name}」から文字を読み取っています…`);
        text = await readImage(f);
      }
      else { out.push({name:f.name, folder, ok:false, why:'.'+ext+' は未対応'}); continue; }
    }catch(e){ out.push({name:f.name, folder, ok:false, why:(e.message||'読めません').slice(0,40)}); continue; }
    if (!text.trim()){ out.push({name:f.name, folder, ok:false, why:'中身が読めない'}); continue; }
    const p = parseSheet(text);
    const nC = p.blocks.filter(b=>(b.chords||[]).length).length;
    // 曲名やアーティストの行は欄に移し、本文には残さない
    out.push({name:f.name, ok:true, pick:true,
      text: p.body || text,
      folder: p.folder || folder,
      title: p.title || f.name.replace(/\.[^.]+$/,''),
      artist: p.artist || '',
      vname: p.vname || '',
      capoBase: p.capoBase || '',
      key: p.key, keyGuessed: !!p.keyGuessed, capo: p.capo || 0,
      bpm: p.bpm || 100, nChord:nC,
      nLyric: p.blocks.reduce((a,b)=>a+((b.lyrics||[]).length),0)});
  }
  const failedZips = batch.filter(b=>!b.ok && /\.zip$/i.test(b.name||''));
  batch = [...failedZips, ...out];
  checkBatchDup();
  drawBatch();
}

// 取り込む曲と同じ曲名がすでにあるか調べ、歌詞の一致率から初期の扱いを決める
function checkBatchDup(){
  batch.forEach(b=>{
    b.dup = null;
    if (!b.ok) return;
    // まったく同じものが入っていれば、増やさずにまとめる
    const twin = findSame(b.title, b.text);
    if (twin){
      b.dup = {same:true, matchId:twin.id, repTitle:twin.title,
               matchName:vLabel(twin), nVer:versionsOf(twin).length, pct:100,
               group:groupKey(twin), onlyA:[], onlyB:[]};
      b.dupMode = 'same';
      b.vname = '';
      return;
    }
    const hit = findDuplicate(b.title, b.text);
    if (!hit) return;
    const pct = Math.round(hit.sim.ratio * 100);
    b.dup = {
      group: groupKey(hit.rep),
      repTitle: hit.rep.title,
      matchName: vLabel(hit.song),
      matchId: hit.song.id,
      nVer: versionsOf(hit.rep).length,
      pct,
      onlyA: hit.sim.onlyA.slice(0, 2),
      onlyB: hit.sim.onlyB.slice(0, 2)
    };
    b.dupMode = dupVerdict(pct).mode;
    b.vname = '';
  });
}
function setDupMode(i, mode){
  if (!batch[i] || !batch[i].dup) return;
  batch[i].dupMode = mode;
  drawBatch();
}
function setDupName(i, v){ if (batch[i]) batch[i].vname = v; }

// 同じ曲名があったときの選択肢
function dupBox(b, i){
  const d = b.dup;
  if (d.same){
    const btn = (m, label) =>
      `<button class="${b.dupMode===m?'on':''}" onclick="event.preventDefault();setDupMode(${i},'${m}')">${label}</button>`;
    return `<div class="dup">
      <b>すでに同じものが入っています</b> —「${esc(d.repTitle)}」${d.nVer>1?`（${esc(d.matchName)}）`:''}
      曲名も中身もまったく同じなので、<b>増やさずにまとめます</b>。
      空いている欄（アーティスト・キーなど）があれば、こちらの内容で埋めます。
      <div class="ch">
        ${btn('same','まとめる（増やさない）')}
        ${btn('version','別バージョンとして足す')}
        ${btn('separate','別の曲として入れる')}
      </div></div>`;
  }
  const vd = dupVerdict(d.pct);
  const btn = (m, label) =>
    `<button class="${b.dupMode===m?'on':''}" onclick="event.preventDefault();setDupMode(${i},'${m}')">${label}</button>`;
  const diff = [
    d.onlyA.length ? '読み込む側だけ: ' + d.onlyA.map(esc).join(' / ') : '',
    d.onlyB.length ? 'いまある側だけ: ' + d.onlyB.map(esc).join(' / ') : ''
  ].filter(Boolean).join('<br>');
  return `<div class="dup">
    <b>同じ曲名があります</b> —「${esc(d.repTitle)}」（${d.nVer}バージョン）<br>
    歌詞の一致 <b>${d.pct}%</b>（いちばん近いのは「${esc(d.matchName)}」）。${vd.note}
    ${diff ? `<div class="diff">${diff}</div>` : ''}
    <div class="ch">
      ${btn('version','別バージョンとして足す')}
      ${btn('overwrite','上書きする')}
      ${btn('separate','別の曲として入れる')}
    </div>
    ${b.dupMode==='version'
      ? `<input type="text" placeholder="バージョン名（例: 2015年版 / 女性キー）空なら自動で付けます"
           value="${esc(b.vname||'')}" oninput="setDupName(${i}, this.value)">`
      : b.dupMode==='overwrite'
      ? `<div class="diff">「${esc(d.matchName)}」の中身をこのファイルで置き換えます。元には戻せません。</div>`
      : ''}
  </div>`;
}

function pickBatch(mode){
  batch.forEach(b=>{
    if (!b.ok) return;
    b.pick = mode === 'all' ? true : mode === 'none' ? false : !!b.edited;
  });
  drawBatch();
}

function refreshCount(){
  const el = document.getElementById('bCount');
  if (el) el.textContent = batch.filter(b=>b.ok&&b.pick).length;
}
function importBatch(){
  const take = batch.filter(b=>b.ok&&b.pick);
  if (!take.length) return;
  let added = 0, versions = 0, over = 0, same = 0;
  take.forEach((b,i)=>{
    const mode = b.dup ? b.dupMode : 'separate';
    if (mode === 'same'){
      const t = songs.find(x=>x.id === b.dup.matchId);
      if (t){ mergeInto(t, b); same++; return; }
    }
    if (mode === 'overwrite'){
      const t = songs.find(x=>x.id === b.dup.matchId);
      if (t){
        t.text = b.text;
        t.title = b.title; t.artist = b.artist||''; t.folder = b.folder||'未分類';
        t.key = (b.key||t.key||'C').trim(); t.capo = b.capo||0; t.bpm = b.bpm||t.bpm||100;
        over++;
        return;
      }
    }
    const id = 'b' + Date.now() + '_' + i;
    const grp = mode === 'version' ? b.dup.group : id;
    if (mode === 'version'){
      // もとの版に名前が無いままだと見分けがつかないので付けておく
      const sib = songs.filter(x=>groupKey(x) === grp);
      if (sib.length === 1 && !(sib[0].vname||'').trim()) sib[0].vname = 'もとの版';
      versions++;
    } else added++;
    songs.push({id, vgroup: grp,
      vname: mode === 'version' ? uniqueVersionName(grp, b.vname) : '',
      ...(b.capoBase ? {capoBase: b.capoBase} : {}),
      folder:b.folder||'未分類', title:b.title,
      artist:b.artist||'', key:(b.key||'C').trim(), capo:b.capo||0,
      bpm:b.bpm||100, barsPerLine:8, transpose:0, plays:0, v:2, text:b.text});
  });
  persist();
  batch = []; batchEdit = null;
  folderFilter = null;
  go('list');
  const msg = [added?added+'曲を追加':'', versions?versions+'バージョンを追加':'',
               over?over+'件を上書き':'', same?same+'件は同じ内容なのでまとめた':'']
    .filter(Boolean).join(' / ');
  if (msg) alertShare(msg);
}

/* ---- 別々に入っている曲を、ひとつのバージョン違いにまとめる ---- */
let mergeIds = [], mergeBase = null;

function openMerge(){
  if (isViewer) return;
  // 選んだ曲に含まれるバージョンを全部集める
  const picked = songs.filter(x=>selected.has(x.id));
  const keys = new Set(picked.map(groupKey));
  mergeIds = songs.filter(x=>keys.has(groupKey(x))).map(x=>x.id);
  if (keys.size < 2){ alertShare('2曲以上えらんでください'); return; }
  mergeBase = picked[0].id;
  drawMerge();
}
function setMergeBase(id){ mergeBase = id; drawMerge(); }
function closeMerge(){ mergeIds = []; mergeBase = null; closePop(); }

function drawMerge(){
  const items = mergeIds.map(id=>songs.find(x=>x.id===id)).filter(Boolean);
  if (!items.length){ closeMerge(); return; }
  const base = songs.find(x=>x.id===mergeBase) || items[0];
  mergeBase = base.id;
  document.getElementById('popName').textContent = items.length + '曲をひとつにまとめます';
  document.getElementById('popDesc').textContent =
    'どれを「もとの版」にするか選んでください。ほかはその別バージョンになります。曲名は「もとの版」に合わせます。';
  const rows = items.map(x=>{
    const sim = x.id === base.id ? null : Math.round(lyricSimilarity(base.text, x.text).ratio * 100);
    const nm = (x.vname||'').trim();
    return `<div class="mgr${x.id===base.id?' on':''}">
      <label class="mgpick">
        <input type="radio" name="mgbase" ${x.id===base.id?'checked':''}
          onchange="setMergeBase('${x.id}')">
        <span class="mgt">${esc(x.title || '(曲名なし)')}${nm?`<i class="verbadge">${esc(nm)}</i>`:''}
          <div class="ar">${[esc(x.key||'?'), x.capo?'Capo'+x.capo:'', x.bpm?x.bpm+'BPM':'',
            (x.text||'').split('\n').filter(L=>L.trim()).length + '行',
            sim === null ? 'もとの版' : '歌詞の一致 ' + sim + '%'].filter(Boolean).join(' · ')}</div></span>
      </label>
      ${x.id===base.id ? '' :
        `<input type="text" class="mgname" placeholder="バージョン名（空なら自動）"
           value="${esc(nm)}" oninput="mergeName('${x.id}', this.value)">`}
    </div>`;
  }).join('');
  document.getElementById('popGrid').innerHTML = `<div style="flex:1 1 100%">
    <div class="mglist">${rows}</div>
    <p class="hint">譜面はどれも消えません。並びとキー・カポもそのまま残ります。
      あとで「編集」からバージョン名を変えたり、1つだけ削除したりできます。</p>
    <div class="btnrow" style="margin-top:12px">
      <button class="act" onclick="doMerge()">まとめる</button>
      <button class="ghost" onclick="closeMerge()">やめる</button></div></div>`;
  document.getElementById('pop').hidden = false;
}
const _mergeNames = {};
function mergeName(id, v){ _mergeNames[id] = v; }

function doMerge(){
  if (isViewer) return;
  const items = mergeIds.map(id=>songs.find(x=>x.id===id)).filter(Boolean);
  const base = songs.find(x=>x.id===mergeBase);
  if (!base || items.length < 2){ closeMerge(); return; }
  const gid = groupKey(base);
  if (!base.vgroup) base.vgroup = gid;
  if (!(base.vname||'').trim()) base.vname = 'もとの版';
  let n = 0;
  items.forEach(x=>{
    if (x.id === base.id) return;
    x.vgroup = gid;
    x.title = base.title;                       // 曲名はもとの版に合わせる
    x.vname = uniqueVersionName(gid, (_mergeNames[x.id]||'').trim() || x.vname);
    delete _mergeNames[x.id];
    n++;
  });
  persist();
  selectMode = false; selected.clear();
  mergeIds = []; mergeBase = null;
  closePop();
  render();
  alertShare(n + 'つを「' + base.title + '」のバージョンにまとめました');
}

/* ---- 端末の空き容量 ---- */
let storageOpen = false;
function openStorage(){ storageOpen = true; go('list'); setTimeout(drawStorage, 30); }
function closeStorage(){ storageOpen = false; render(); }

async function drawStorage(){
  const box = document.getElementById('storageBox');
  if (!box) return;
  box.innerHTML = '<p class="hint" style="margin:0">調べています…</p>';
  let info, list;
  try{
    [info, list] = await Promise.all([storageInfo(), audioList()]);
  }catch(e){
    showBoxError('storageBox', '空き容量を調べられませんでした',
      (e && (e.name + ': ' + e.message)) || String(e));
    return;
  }
  const total = list.reduce((a,x)=>a+x.size, 0);
  const rows = list.map(x=>{
    const song = songs.find(y=>y.id === x.id);
    return {id:x.id, size:x.size, title: song ? song.title : '（消した曲の音源）',
            vname: song ? (song.vname||'') : '', orphan: !song};
  }).sort((a,b)=>b.size-a.size);
  const orphans = rows.filter(r=>r.orphan);

// 端末に置いてあるオフライン用の控えを捨てる。捨てたあとは読み込み直しが要る
async function clearCache(){
  const log = [];
  const box = document.getElementById('cacheMsg');
  if (box) box.innerHTML = '<p class="hint" style="margin:8px 0 0">捨てています…</p>';
  // 先に受け取りを止める。止めずに閉じると「shutting down」のエラーが出る
  tearingDown = true;
  try{ if (fbUnsub){ fbUnsub(); fbUnsub = null; } }catch(e){}
  try{ if (metaUnsub){ metaUnsub(); metaUnsub = null; } }catch(e){}
  clearTimeout(pushTimer);
  // まずは正規の手順で
  try{
    if (fb){
      if (typeof fb.terminate === 'function') await fb.terminate();
      if (typeof fb.clearPersistence === 'function') await fb.clearPersistence();
      log.push('正規の手順: 成功');
    } else log.push('同期は使っていません');
  }catch(e){
    log.push('正規の手順: ' + ((e && (e.code || e.name)) || '') + ' ' + ((e && e.message) || String(e)));
  }
  // だめでも、端末に残っている控えそのものを消しにいく
  let removed = 0, failed = [];
  try{
    let names = [];
    if (indexedDB.databases){
      names = (await indexedDB.databases()).map(d=>d && d.name).filter(Boolean);
    }
    // 控えそのものだけを対象にする。
    // firebase-heartbeat-database は Firebase が開きっぱなしにしている別物で、
    // 消す必要も無いし消せないので外す
    const targets = names.filter(nm=>/^firestore\b/i.test(nm));
    for (const nm of targets){
      const done = await new Promise(res=>{
        const rq = indexedDB.deleteDatabase(nm);
        rq.onsuccess = ()=>res(true);
        rq.onerror   = ()=>res(false);
        rq.onblocked = ()=>res(false);   // ほかのタブが掴んでいる
        setTimeout(()=>res(false), 4000);
      });
      if (done) removed++; else failed.push(nm);
    }
    log.push('控えの数: ' + targets.length + ' / 消せた: ' + removed +
             (failed.length ? ' / 消せなかった: ' + failed.join(', ') : ''));
  }catch(e){
    log.push('直接の削除: ' + ((e && e.message) || String(e)));
  }

  if (!failed.length){
    alertShare('控えを捨てました。読み込み直します');
    setTimeout(()=>location.reload(), 800);
    return;
  }
  showBoxError('cacheMsg', '控えを捨てきれませんでした', log.join('\n'),
    'このページを<b>ほかのタブやウィンドウでも開いていると</b>、控えを掴んだままになって捨てられません。' +
    'ほかのタブを全部閉じてから、もう一度押してください。それでも消せないときは、' +
    'ブラウザを一度終了してから開き直してください。');
}

/* ---- 曲画面での録音 ---- */
let songRec = null, songRecChunks = [], songRecTimer = null, songRecStart = 0;

async function toggleSongRec(id){
  const btn = document.getElementById('songRecBtn');
  const msg = document.getElementById('songRecMsg');
  if (songRec && songRec.state === 'recording'){ songRec.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if (msg) msg.textContent = 'このブラウザではマイクを使えません。';
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    songRecChunks = [];
    songRec = new MediaRecorder(stream);
    songRec.ondataavailable = e=>{ if (e.data.size) songRecChunks.push(e.data); };
    songRec.onstop = async ()=>{
      clearInterval(songRecTimer);
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(songRecChunks, {type: songRec.mimeType || 'audio/webm'});
      songRec = null;
      const ok = await putAudio(id, blob);
      const song = songs.find(x=>x.id===id);
      if (song){ song.hasAudio = ok; persist(); }
      loadAudioSlot(song);
      alertShare(ok ? '録音をこの曲に付けました' : '保存できませんでした');
    };
    songRec.start();
    songRecStart = Date.now();
    if (btn){ btn.textContent = '停止して付ける'; btn.classList.add('rec'); btn.classList.remove('ghost'); }
    songRecTimer = setInterval(()=>{
      const m = document.getElementById('songRecMsg');
      if (!m) return;
      const t = Math.floor((Date.now()-songRecStart)/1000);
      m.textContent = '録音中 ' + Math.floor(t/60) + ':' + String(t%60).padStart(2,'0');
    }, 250);
  }catch(e){
    if (msg) msg.textContent = e.name === 'NotAllowedError'
      ? 'マイクの使用が許可されませんでした。ブラウザの設定から許可してください。'
      : 'マイクを開けませんでした（' + (e.message||e.name) + '）。';
  }
}

async function attachTo(id, file){
  const ok = await putAudio(id, file);
  const song = songs.find(x=>x.id===id);
  if (song){ song.hasAudio = ok; persist(); }
  loadAudioSlot(song);
}
async function removeAudio(id){
  await delAudio(id);
  const song = songs.find(x=>x.id===id);
  if (song){ song.hasAudio = false; persist(); }
  loadAudioSlot(song);
}

/* ---- 音源解析 ---- */
let anaResult = null;

async function runAnalysis(file){
  const box = document.getElementById('anaOut');
  box.innerHTML = `<p class="hint" id="anaMsg">「${esc(file.name)}」を読み込んでいます…</p>`;
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    const buf = await file.arrayBuffer();
    const AC = window.AudioContext || window.webkitAudioContext;
    const tmp = new AC();
    const decoded = await tmp.decodeAudioData(buf);
    tmp.close();
    document.getElementById('anaMsg').textContent = '解析しています…（曲の長さによって数秒かかります）';
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    // モノラル 22050Hz に揃える
    const SR = 22050;
    const off = new OfflineAudioContext(1, Math.ceil(decoded.duration*SR), SR);
    const src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start();
    const mono = await off.startRendering();
    const y = mono.getChannelData(0);

    anaResult = analyze(y, SR);
    anaResult.name = file.name;
    anaResult.file = file;
    drawAnalysis();
  }catch(e){
    box.innerHTML = `<p class="hint">このファイルは読み込めませんでした（${esc(e.message||'形式が未対応')}）。mp3 / m4a / wav を試してください。</p>`;
  }
}

function fmtTime(t){ return Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0'); }

function drawAnalysis(){
  const r = anaResult, box = document.getElementById('anaOut');
  if (!r) return;
  const cnt = {};
  r.sequence.forEach(x=>cnt[x.chord] = (cnt[x.chord]||0)+1);
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
  box.innerHTML = `
    <div class="stat" style="margin-top:14px">
      <span>テンポ <b>${Math.round(r.bpm)}</b> BPM</span>
      <span>キー <b>${esc(r.key.root)}</b> ${r.key.mode==='major'?'メジャー':'マイナー'}</span>
      <span>長さ <b>${fmtTime(r.duration)}</b></span>
      <span>コードチェンジ <b>${r.sequence.length}</b> 回</span>
    </div>
    <div class="secthead" style="margin-top:16px">よく出てくるコード</div>
    <div class="picker">${top.map(([c,n])=>`<button class="pk" onclick="showChord('${c}')">${esc(c)}<i>${n}回</i></button>`).join('')}</div>
    <div class="secthead" style="margin-top:16px">コード進行</div>
    <div class="tl">${r.sequence.slice(0,80).map(x=>
      `<div class="tlr"><span class="tt">${fmtTime(x.t)}</span><span class="tc">${esc(x.chord)}</span></div>`).join('')}
    </div>
    ${r.sequence.length>80?`<p class="hint">※ 冒頭80個まで表示しています（全${r.sequence.length}個）</p>`:''}
    <div class="btnrow" style="margin-top:14px">
      <button class="act" onclick="saveAnalysis()">この内容で曲として保存</button>
      <button class="ghost" onclick="halveTempo()">テンポを半分にする</button>
      <button class="ghost" onclick="anaResult=null;document.getElementById('anaOut').innerHTML=''">やめる</button>
    </div>
    <p class="hint">テンポは実際の倍や半分に出ることがあります（この曲なら 68 と 136 のどちらも正解になりえます）。合わないときは上のボタンで切り替えてください。</p>`;
}
function halveTempo(){
  if (!anaResult) return;
  anaResult.bpm = anaResult.bpm > 100 ? anaResult.bpm/2 : anaResult.bpm*2;
  drawAnalysis();
}

// 解析結果をコード譜テキストに起こす（歌詞は空けておく）
function sheetFromAnalysis(r){
  const per = 4;
  const lines = [];
  for (let i=0;i<r.sequence.length;i+=per){
    const grp = r.sequence.slice(i, i+per);
    let line = '';
    grp.forEach((x,k)=>{
      const target = k*10;
      while (line.length < target) line += ' ';
      line += x.chord;
    });
    lines.push(line);
    lines.push('');          // 歌詞を書き込む行
  }
  return lines.join('\n');
}

function saveAnalysis(){
  const r = anaResult; if (!r) return;
  const id = 'a'+Date.now();
  songs.push({id, folder:'解析', title: r.name.replace(/\.[^.]+$/,''), artist:'',
    key: r.key.root, capo:0, bpm: Math.round(r.bpm), barsPerLine:8, transpose:0, plays:0,
    hasAudio:true, text: sheetFromAnalysis(r)});
  persist();
  if (r.file) putAudio(id, r.file);   // 解析に使った音源をそのまま添付
  anaResult = null;
  folderFilter = null;
  go('list');
}

function alert0(){
  const b = event.target; const o = b.textContent;
  b.textContent = '解析エンジン未接続';
  setTimeout(()=>{ b.textContent = o; }, 1400);
}

// 読み込んだ内容から、曲名・アーティスト・キー・カポを欄に反映する
function applyParsedToDraft(text, fileName){
  const p = parseSheet(text);
  draft.text   = text;
  draft.title  = p.title || (fileName || '').replace(/\.[^.]+$/,'') || '';
  draft.artist = p.artist || '';
  draft.key    = p.key || '';
  draft.capo   = p.capo || 0;
  if (p.folder) draft.folder = p.folder;
  draft.keyGuessed = !!p.keyGuessed;
  draft.keyEdited  = false;
}

async function loadOne(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  let text = '';
  const busy = (msg)=>{ const el = document.getElementById('draftPrev');
    if (el) el.innerHTML = `<p class="empty">${esc(msg)}</p>`; };
  try{
    if (ext === 'doc' || ext === 'docx' || ext === 'dot' || ext === 'rtf'){
      busy('Word を読んでいます…');
      // 拡張子より中身を信じる
      text = (await isOle2(file)) ? await readDoc(file) : await readDocx(file);
    }
    else if (ext === 'pdf'){ busy('PDF を読んでいます…'); text = await readPdf(file); }
    else if (['jpg','jpeg','png','gif','bmp','webp'].includes(ext)){
      busy('画像から文字を読み取っています…');
      text = await readImage(file, (pct, note)=>{
        busy(note || (pct != null ? `文字を読み取っています… ${pct}%` : '準備しています…'));
      });
    }
    else text = await readText(file);
  }catch(e){
    busy('読み取れませんでした: ' + (e.message||''));
    return;
  }
  if (!text.trim()){
    const el = document.getElementById('draftPrev');
    if (el) el.innerHTML = `<p class="empty">文字が見つかりませんでした。<br>
      <span style="font-size:.76rem">画像として作られた PDF には文字の情報がありません。その場合は画像に書き出してから読み込んでください。</span></p>`;
    return;
  }
  applyParsedToDraft(text, file.name);
  render();
  setTimeout(()=>{
    const el = document.getElementById('draftPrev');
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 80);
}

function refreshKeyChips(){
  const kb = document.getElementById('keyPick');
  if (kb) kb.innerHTML = keyChips();
  const cb = document.getElementById('capoPick');
  if (cb) cb.innerHTML = capoChips();
}
function previewDraft(){
  const prev = document.getElementById('draftPrev');
  const stat = document.getElementById('draftStat');
  if (!prev) return;
  if (!draft.text.trim()){
    prev.innerHTML = '<p class="hint" style="margin:0">コード譜を貼り付けると、ここに同じ内容が出ます。</p>';
    if (stat) stat.innerHTML = '';
    return;
  }
  const p = parseSheet(draft.text);
  // 欄が空なら、貼り付けた内容から拾って埋める
  if (!draft.title && p.title) draft.title = p.title;
  if (!draft.artist && p.artist) draft.artist = p.artist;
  if (!draft.keyEdited && !draft.key && p.key){
    draft.key = p.key; draft.keyGuessed = !!p.keyGuessed;
    const kc = document.getElementById('keyCard');
    if (kc) kc.innerHTML = editKeyCard(draft);
  }
  const nChord = p.blocks.filter(b=>(b.chords||[]).length).length;
  const nLyric = p.blocks.reduce((a,b)=>a+((b.lyrics||[]).length),0);
  const chords = new Set();
  p.blocks.forEach(b=>(b.chords||[]).forEach(c=>{ if(c.kind==='c') chords.add(c.text); }));
  if (stat) stat.innerHTML = `<div class="stat"><span>コード行 <b>${nChord}</b></span>
    <span>歌詞行 <b>${nLyric}</b></span><span>種類 <b>${chords.size}</b></span></div>`;

  const key = (draft.key || p.key || '').trim();
  const noChord = nChord === 0 && draft.text.trim()
    ? `<div class="warnbox"><b>コード行として読めた行がありません</b>
        コード行にしたい行の<b>先頭に @ を付けて</b>ください。その行はそのままコード行になります。
        読み取りの間違い（O と 0、l と 1 など）も、上の欄で直せます。</div>`
    : '';
  const keep = prev.scrollTop, keepX = prev.scrollLeft;
  prev.innerHTML = '';
  const tmp = {...draft, key, capo:(parseInt(draft.capo,10)||0),
               textCapo: textCapoOf({...draft, capo:(parseInt(draft.capo,10)||0)}),
               transpose:0, bpm:100, barsPerLine:8, text:draft.text};
  prev.appendChild(renderAligned(tmp, {lineToggle: toggleLineAt}));
  prev.scrollTop = keep; prev.scrollLeft = keepX;
  // コード行が1つも無いときの注意は、確認の窓の外（統計のところ）に出す
  if (stat && noChord) stat.innerHTML = noChord + stat.innerHTML;
}

function saveDraft(){
  if (!draft.text.trim()) return;
  const p = parseSheet(draft.text);
  const title = draft.title || p.title || '無題';
  const text = p.body || draft.text;
  const make = (mode, grp, vname)=>{
    const id = 'u'+Date.now();
    songs.push({id, vgroup: grp || id, vname: vname || '',
      folder:(draft.folder||'').trim()||p.folder||'未分類', title,
      artist: draft.artist || p.artist || '',
      key: (draft.key || p.key || 'C').trim(),
      capoBase: capoBaseOf(draft),
      textCapo: textCapoOf({...draft, capo: Math.max(0, Math.min(12, parseInt(draft.capo,10) || p.capo || 0))}),
      capo: Math.max(0, Math.min(12, parseInt(draft.capo,10) || p.capo || 0)),
      bpm: p.bpm || 100, barsPerLine:8, transpose:0, plays:0, v:2, text});
    persist();
    draft = {text:'', title:'', artist:'', key:'', capo:0, folder:'', capoBase:'play', transpose:0, keyEdited:false, keyGuessed:false};
    go('list');
    if (mode === 'version') alertShare('「' + vname + '」として足しました');
  };
  // まったく同じものが入っていれば増やさない
  const twin = findSame(title, text);
  if (twin){
    const filled = mergeInto(twin, {
      artist: draft.artist, key: draft.key, capo: parseInt(draft.capo,10)||0,
      folder: (draft.folder||'').trim(), capoBase: capoBaseOf(draft)});
    persist();
    draft = {text:'', title:'', artist:'', key:'', capo:0, folder:'',
             capoBase:'play', transpose:0, keyEdited:false, keyGuessed:false};
    go('list');
    alertShare('すでに同じ内容が入っていたので、まとめました'
      + (filled.length ? '（' + filled.join('・') + 'を埋めました）' : ''));
    return;
  }
  const hit = findDuplicate(title, text);
  if (!hit){ make('new'); return; }
  askDupChoice(hit, title, {
    version: ()=>{
      const grp = groupKey(hit.rep);
      const sib = songs.filter(x=>groupKey(x)===grp);
      if (sib.length === 1 && !(sib[0].vname||'').trim()) sib[0].vname = 'もとの版';
      askText('バージョン名', 'このバージョンの名前を入れてください（例: 女性キー、2015年版）', '',
        v=>make('version', grp, uniqueVersionName(grp, v)));
    },
    overwrite: ()=>{
      const t = songs.find(x=>x.id===hit.song.id);
      if (t){
        t.text = text;
        t.artist = draft.artist || p.artist || t.artist;
        t.key = (draft.key || p.key || t.key || 'C').trim();
        t.capo = Math.max(0, Math.min(12, parseInt(draft.capo,10) || p.capo || 0));
        if (p.bpm) t.bpm = p.bpm;
        persist();
      }
      draft = {text:'', title:'', artist:'', key:'', capo:0, folder:'', capoBase:'play', transpose:0, keyEdited:false, keyGuessed:false};
      go('list');
      alertShare('上書きしました');
    },
    separate: ()=>make('new')
  });
}

// 同じ曲名が見つかったときに、どう入れるか聞く
function askDupChoice(hit, title, acts){
  const pct = Math.round(hit.sim.ratio * 100);
  const vd = dupVerdict(pct);
  const near = vd.mode === 'version';
  const nVer = versionsOf(hit.rep).length;
  const diff = [
    hit.sim.onlyA.slice(0,2).length ? '読み込む側だけ: ' + hit.sim.onlyA.slice(0,2).map(esc).join(' / ') : '',
    hit.sim.onlyB.slice(0,2).length ? 'いまある側だけ: ' + hit.sim.onlyB.slice(0,2).map(esc).join(' / ') : ''
  ].filter(Boolean).join('<br>');
  _dupActs = acts;
  document.getElementById('popName').textContent = '「' + title + '」はすでにあります';
  document.getElementById('popDesc').textContent =
    `歌詞の一致は ${pct}%（いちばん近いのは「${vLabel(hit.song)}」／ぜんぶで ${nVer}バージョン）。` + vd.note;
  document.getElementById('popGrid').innerHTML = `<div style="flex:1 1 100%">
    ${diff ? `<p class="hint" style="margin:0 0 10px;line-height:1.6">${diff}</p>` : ''}
    <div class="btnrow" style="flex-direction:column;align-items:stretch;gap:8px">
      <button class="${near?'act':'ghost'}" onclick="dupPick('version')">別バージョンとして足す</button>
      <button class="ghost" onclick="dupPick('overwrite')">「${esc(vLabel(hit.song))}」を上書きする</button>
      <button class="${near?'ghost':'act'}" onclick="dupPick('separate')">別の曲として入れる</button>
      <button class="ghost" onclick="closePop();_dupActs=null">やめる</button>
    </div></div>`;
  document.getElementById('pop').hidden = false;
}
let _dupActs = null;
function dupPick(k){
  const a = _dupActs; _dupActs = null;
  closePop();
  if (a && a[k]) a[k]();
}

// ドラッグ&ドロップ（フォルダごと落とされた場合も中を辿る）
async function walkEntry(entry, path, acc){
  if (entry.isFile){
    const f = await new Promise(r=>entry.file(r));
    Object.defineProperty(f, 'webkitRelativePath', {value: path + f.name});
    acc.push(f);
  } else if (entry.isDirectory){
    const reader = entry.createReader();
    const kids = await new Promise(r=>reader.readEntries(r));
    for (const k of kids) await walkEntry(k, path + entry.name + '/', acc);
  }
}
document.addEventListener('dragover', e=>{
  const z = e.target.closest && (e.target.closest('#dropZone') || e.target.closest('#audioZone'));
  if (z){ e.preventDefault(); z.classList.add('hot'); }
});
document.addEventListener('dragleave', e=>{
  const z = e.target.closest && (e.target.closest('#dropZone') || e.target.closest('#audioZone'));
  if (z) z.classList.remove('hot');
});
document.addEventListener('drop', async e=>{
  const az = e.target.closest && e.target.closest('#audioZone');
  if (az){
    e.preventDefault(); az.classList.remove('hot');
    const f = e.dataTransfer.files[0];
    if (f) runAnalysis(f);
    return;
  }
  const z = e.target.closest && e.target.closest('#dropZone');
  if (!z) return;
  e.preventDefault(); z.classList.remove('hot');
  const items = [...(e.dataTransfer.items||[])];
  const acc = [];
  const entries = items.map(i=>i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length){ for (const en of entries) await walkEntry(en, '', acc); }
  else acc.push(...e.dataTransfer.files);
  if (acc.length) takeFiles(acc);
});
