      <button class="ghost danger" onclick="removeAudio('${song.id}')">外す</button>
    </div>
    <p class="hint" id="songRecMsg" style="margin-top:7px"></p>`;
}
/* ---- 曲画面での録音 ---- */
let songRec = null, songRecChunks = [], songRecTimer = null, songRecStart = 0;

async function toggleSongRec(id){
  const btn = document.getElementById('songRecBtn');
  const msg = document.getElementById('songRecMsg');
  if (songRec && songRec.state === 'recording'){ songRec.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if (msg) msg.textContent = 'このブラウザではマイクを使えません。';
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    songRecChunks = [];
    songRec = new MediaRecorder(stream);
    songRec.ondataavailable = e=>{ if (e.data.size) songRecChunks.push(e.data); };
    songRec.onstop = async ()=>{
      clearInterval(songRecTimer);
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(songRecChunks, {type: songRec.mimeType || 'audio/webm'});
      songRec = null;
      const ok = await putAudio(id, blob);
      const song = songs.find(x=>x.id===id);
      if (song){ song.hasAudio = ok; persist(); }
      loadAudioSlot(song);
      alertShare(ok ? '録音をこの曲に付けました' : '保存できませんでした');
    };
    songRec.start();
    songRecStart = Date.now();
    if (btn){ btn.textContent = '停止して付ける'; btn.classList.add('rec'); btn.classList.remove('ghost'); }
    songRecTimer = setInterval(()=>{
      const m = document.getElementById('songRecMsg');
      if (!m) return;
      const t = Math.floor((Date.now()-songRecStart)/1000);
      m.textContent = '録音中 ' + Math.floor(t/60) + ':' + String(t%60).padStart(2,'0');
    }, 250);
  }catch(e){
    if (msg) msg.textContent = e.name === 'NotAllowedError'
      ? 'マイクの使用が許可されませんでした。ブラウザの設定から許可してください。'
      : 'マイクを開けませんでした（' + (e.message||e.name) + '）。';
  }
}

async function attachTo(id, file){
  const ok = await putAudio(id, file);
  const song = songs.find(x=>x.id===id);
  if (song){ song.hasAudio = ok; persist(); }
  loadAudioSlot(song);
}
async function removeAudio(id){
  await delAudio(id);
  const song = songs.find(x=>x.id===id);
  if (song){ song.hasAudio = false; persist(); }
  loadAudioSlot(song);
}

/* ---- マイク録音 ---- */
let rec = null, recChunks = [], recTimer = null, recStart = 0;

async function toggleRec(){
  const btn = document.getElementById('recBtn');
  const msg = document.getElementById('recMsg');
  if (rec && rec.state === 'recording'){
    rec.stop();
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    msg.hidden = false;
    msg.textContent = 'このブラウザではマイクを使えません。';
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    recChunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e=>{ if (e.data.size) recChunks.push(e.data); };
    rec.onstop = ()=>{
      clearInterval(recTimer);
      stream.getTracks().forEach(t=>t.stop());
      btn.textContent = 'マイクで録音する';
      btn.classList.remove('rec');
      msg.hidden = true;
      const blob = new Blob(recChunks, {type: rec.mimeType || 'audio/webm'});
      const f = new File([blob], '録音_' + new Date().toLocaleString('ja-JP').replace(/[\/:]/g,'-') + '.webm',
        {type: blob.type});
      runAnalysis(f);
    };
    rec.start();
    recStart = Date.now();
    btn.textContent = '停止して解析';
    btn.classList.add('rec');
    msg.hidden = false;
    recTimer = setInterval(()=>{
      const s = Math.floor((Date.now()-recStart)/1000);
      msg.textContent = '録音中 ' + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0')
        + '　— 30秒以上録ると解析が安定します';
    }, 250);
  }catch(e){
    msg.hidden = false;
    msg.textContent = e.name === 'NotAllowedError'
      ? 'マイクの使用が許可されませんでした。ブラウザの設定から許可してください。'
      : 'マイクを開けませんでした（' + (e.message||e.name) + '）。';
  }
}

/* ---- 音源解析 ---- */
let anaResult = null;

async function runAnalysis(file){
  const box = document.getElementById('anaOut');
  box.innerHTML = `<p class="hint" id="anaMsg">「${esc(file.name)}」を読み込んでいます…</p>`;
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    const buf = await file.arrayBuffer();
    const AC = window.AudioContext || window.webkitAudioContext;
    const tmp = new AC();
    const decoded = await tmp.decodeAudioData(buf);
    tmp.close();
    document.getElementById('anaMsg').textContent = '解析しています…（曲の長さによって数秒かかります）';
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    // モノラル 22050Hz に揃える
    const SR = 22050;
    const off = new OfflineAudioContext(1, Math.ceil(decoded.duration*SR), SR);
    const src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start();
    const mono = await off.startRendering();
    const y = mono.getChannelData(0);

    anaResult = analyze(y, SR);
    anaResult.name = file.name;
    anaResult.file = file;
    drawAnalysis();
  }catch(e){
    box.innerHTML = `<p class="hint">このファイルは読み込めませんでした（${esc(e.message||'形式が未対応')}）。mp3 / m4a / wav を試してください。</p>`;
  }
}

function fmtTime(t){ return Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0'); }

function drawAnalysis(){
  const r = anaResult, box = document.getElementById('anaOut');
  if (!r) return;
  const cnt = {};
  r.sequence.forEach(x=>cnt[x.chord] = (cnt[x.chord]||0)+1);
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
  box.innerHTML = `
    <div class="stat" style="margin-top:14px">
      <span>テンポ <b>${Math.round(r.bpm)}</b> BPM</span>
      <span>キー <b>${esc(r.key.root)}</b> ${r.key.mode==='major'?'メジャー':'マイナー'}</span>
      <span>長さ <b>${fmtTime(r.duration)}</b></span>
      <span>コードチェンジ <b>${r.sequence.length}</b> 回</span>
    </div>
    <div class="secthead" style="margin-top:16px">よく出てくるコード</div>
    <div class="picker">${top.map(([c,n])=>`<button class="pk" onclick="showChord('${c}')">${esc(c)}<i>${n}回</i></button>`).join('')}</div>
    <div class="secthead" style="margin-top:16px">コード進行</div>
    <div class="tl">${r.sequence.slice(0,80).map(x=>
      `<div class="tlr"><span class="tt">${fmtTime(x.t)}</span><span class="tc">${esc(x.chord)}</span></div>`).join('')}
    </div>
    ${r.sequence.length>80?`<p class="hint">※ 冒頭80個まで表示しています（全${r.sequence.length}個）</p>`:''}
    <div class="btnrow" style="margin-top:14px">
      <button class="act" onclick="saveAnalysis()">この内容で曲として保存</button>
      <button class="ghost" onclick="halveTempo()">テンポを半分にする</button>
      <button class="ghost" onclick="anaResult=null;document.getElementById('anaOut').innerHTML=''">やめる</button>
    </div>
    <p class="hint">テンポは実際の倍や半分に出ることがあります（この曲なら 68 と 136 のどちらも正解になりえます）。合わないときは上のボタンで切り替えてください。</p>`;
}
function halveTempo(){
  if (!anaResult) return;
  anaResult.bpm = anaResult.bpm > 100 ? anaResult.bpm/2 : anaResult.bpm*2;
  drawAnalysis();
}

// 解析結果をコード譜テキストに起こす（歌詞は空けておく）
function sheetFromAnalysis(r){
  const per = 4;
  const lines = [];
  for (let i=0;i<r.sequence.length;i+=per){
    const grp = r.sequence.slice(i, i+per);
    let line = '';
    grp.forEach((x,k)=>{
      const target = k*10;
      while (line.length < target) line += ' ';
      line += x.chord;
    });
    lines.push(line);
    lines.push('');          // 歌詞を書き込む行
  }
  return lines.join('\n');
}

function saveAnalysis(){
  const r = anaResult; if (!r) return;
  const id = 'a'+Date.now();
  songs.push({id, folder:'解析', title: r.name.replace(/\.[^.]+$/,''), artist:'',
    key: r.key.root, capo:0, bpm: Math.round(r.bpm), barsPerLine:8, transpose:0, plays:0,
    hasAudio:true, text: sheetFromAnalysis(r)});
  persist();
  if (r.file) putAudio(id, r.file);   // 解析に使った音源をそのまま添付
  anaResult = null;
  folderFilter = null;
  go('list');
}

function alert0(){
  const b = event.target; const o = b.textContent;
  b.textContent = '解析エンジン未接続';
  setTimeout(()=>{ b.textContent = o; }, 1400);
}

// 読み込んだ内容から、曲名・アーティスト・キー・カポを欄に反映する
function applyParsedToDraft(text, fileName){
  const p = parseSheet(text);
  draft.text   = text;
  draft.title  = p.title || (fileName || '').replace(/\.[^.]+$/,'') || '';
  draft.artist = p.artist || '';
  draft.key    = p.key || '';
  draft.capo   = p.capo || 0;
  if (p.folder) draft.folder = p.folder;
  draft.keyGuessed = !!p.keyGuessed;
  draft.keyEdited  = false;
}

async function loadOne(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  let text = '';
  const busy = (msg)=>{ const el = document.getElementById('draftPrev');
    if (el) el.innerHTML = `<p class="empty">${esc(msg)}</p>`; };
  try{
    if (ext === 'docx'){ busy('Word を読んでいます…'); text = await readDocx(file); }
    else if (ext === 'pdf'){ busy('PDF を読んでいます…'); text = await readPdf(file); }
    else if (['jpg','jpeg','png','gif','bmp','webp'].includes(ext)){
      busy('画像から文字を読み取っています…');
      text = await readImage(file, (pct, note)=>{
        busy(note || (pct != null ? `文字を読み取っています… ${pct}%` : '準備しています…'));
      });
    }
    else text = await readText(file);
  }catch(e){
    busy('読み取れませんでした: ' + (e.message||''));
    return;
  }
  if (!text.trim()){
    const el = document.getElementById('draftPrev');
    if (el) el.innerHTML = `<p class="empty">文字が見つかりませんでした。<br>
      <span style="font-size:.76rem">画像として作られた PDF には文字の情報がありません。その場合は画像に書き出してから読み込んでください。</span></p>`;
    return;
  }
  applyParsedToDraft(text, file.name);
  render();
  setTimeout(()=>{
    const el = document.getElementById('draftPrev');
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 80);
}

function previewDraft(){
  const prev = document.getElementById('draftPrev');
  const stat = document.getElementById('draftStat');
  if (!prev) return;
  if (!draft.text.trim()){
    prev.innerHTML = '<p class="empty">テキストを貼り付けると、ここに判定結果が出ます。</p>';
    if (stat) stat.innerHTML = '';
    return;
  }
  const p = parseSheet(draft.text);
  // 欄が空なら、貼り付けた内容から拾って埋める
  if (!draft.title && p.title) draft.title = p.title;
  if (!draft.artist && p.artist) draft.artist = p.artist;
  if (!draft.keyEdited && !draft.key && p.key){
    draft.key = p.key; draft.keyGuessed = !!p.keyGuessed;
  }
  const nChord = p.blocks.filter(b=>(b.chords||[]).length).length;
  const nLyric = p.blocks.reduce((a,b)=>a+((b.lyrics||[]).length),0);
  const chords = new Set();
  p.blocks.forEach(b=>(b.chords||[]).forEach(c=>{ if(c.kind==='c') chords.add(c.text); }));
  if (stat) stat.innerHTML = `<div class="stat"><span>コード行 <b>${nChord}</b></span>
    <span>歌詞行 <b>${nLyric}</b></span><span>種類 <b>${chords.size}</b></span></div>`;

  const key = (draft.key || p.key || '').trim();
  const noChord = nChord === 0 && draft.text.trim()
    ? `<div class="warnbox"><b>コード行として読めた行がありません</b>
        コード行にしたい行の<b>先頭に @ を付けて</b>ください。その行はそのままコード行になります。
        読み取りの間違い（O と 0、l と 1 など）も、上の欄で直せます。</div>`
    : '';
  prev.innerHTML = noChord + `<div class="prevhead">
      <div class="ph"><span>曲名</span><b>${esc(draft.title || '(未設定)')}</b></div>
      <div class="ph"><span>アーティスト</span><b>${esc(draft.artist || '(未設定)')}</b></div>
      <div class="ph"><span>原曲キー</span><b>${esc(key || '(未設定)')}${
        (draft.keyGuessed && !draft.keyEdited && key) ? '<i>自動推測</i>' : ''}</b></div>
      ${draft.capo ? `<div class="ph"><span>カポ</span><b>${esc(String(draft.capo))}</b></div>` : ''}
      <div class="ph"><span>ジャンル</span><b>${esc(draft.folder || '未分類')}</b></div>
    </div>`;
  const tmp = {...draft, key, capo:(parseInt(draft.capo,10)||0), transpose:0,
               bpm:100, barsPerLine:8, text:draft.text};
  prev.appendChild(renderSheet(tmp));
}

function saveDraft(){
  if (!draft.text.trim()) return;
  const p = parseSheet(draft.text);
  const id = 'u'+Date.now();
  songs.push({id, folder:(draft.folder||'').trim()||p.folder||'未分類', title:draft.title||p.title||'無題',
    artist: draft.artist || p.artist || '',
    key: (draft.key || p.key || 'C').trim(),
    capo: Math.max(0, Math.min(12, parseInt(draft.capo,10) || p.capo || 0)),
    bpm: p.bpm || 100, barsPerLine:8, transpose:0, plays:0, v:2, text: p.body || draft.text});
  persist();
  draft = {text:'', title:'', artist:'', key:'', capo:0, folder:'', keyEdited:false, keyGuessed:false};
  go('list');
}

// ドラッグ&ドロップ（フォルダごと落とされた場合も中を辿る）
async function walkEntry(entry, path, acc){
  if (entry.isFile){
    const f = await new Promise(r=>entry.file(r));
    Object.defineProperty(f, 'webkitRelativePath', {value: path + f.name});
    acc.push(f);
  } else if (entry.isDirectory){
    const reader = entry.createReader();
    const kids = await new Promise(r=>reader.readEntries(r));
    for (const k of kids) await walkEntry(k, path + entry.name + '/', acc);
  }
}
document.addEventListener('dragover', e=>{
  const z = e.target.closest && (e.target.closest('#dropZone') || e.target.closest('#audioZone'));
  if (z){ e.preventDefault(); z.classList.add('hot'); }
});
document.addEventListener('dragleave', e=>{
  const z = e.target.closest && (e.target.closest('#dropZone') || e.target.closest('#audioZone'));
  if (z) z.classList.remove('hot');
});
document.addEventListener('drop', async e=>{
  const az = e.target.closest && e.target.closest('#audioZone');
  if (az){
    e.preventDefault(); az.classList.remove('hot');
    const f = e.dataTransfer.files[0];
    if (f) runAnalysis(f);
    return;
  }
  const z = e.target.closest && e.target.closest('#dropZone');
  if (!z) return;
  e.preventDefault(); z.classList.remove('hot');
  const items = [...(e.dataTransfer.items||[])];
  const acc = [];
  const entries = items.map(i=>i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length){ for (const en of entries) await walkEntry(en, '', acc); }
  else acc.push(...e.dataTransfer.files);
  if (acc.length) takeFiles(acc);
});
