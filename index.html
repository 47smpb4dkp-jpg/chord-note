<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コード譜ノート</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="コード譜">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&family=BIZ+UDGothic:wght@400;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* レイアウト: 固定ヘッダー + スクロールする本文 + 固定フッタータブ の1画面アプリ */
:root{
  --bg:#f6f4ef;
  --surface:#ffffff;
  --surface-2:#eceae3;
  --line:#d8d4c8;
  --fg:#1f1e1b;
  --fg-dim:#6b675d;
  --accent:#b4621a;        /* コード: 夕焼けの琥珀 */
  --accent-soft:#f2e3d4;
  --on-accent:#ffffff;
  --teal:#2b6b66;          /* セクション */
  --note:#8a6d3b;          /* 演奏指示 */
  --font-ja:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --font-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* 日本語を含む本文の入力欄用。半角2つと全角1つが同じ幅になる */
  --font-grid:"BIZ UDGothic","MS Gothic","Osaka-Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161a; --surface:#1c1f24; --surface-2:#252930; --line:#343a43;
  --fg:#eceae6; --fg-dim:#9aa0ab; --accent:#e8a24a; --accent-soft:#3a2d1c;
  --teal:#5fb3ab; --note:#c6a675; --on-accent:#14161a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1c1f24; --surface-2:#252930; --line:#343a43;
  --fg:#eceae6; --fg-dim:#9aa0ab; --accent:#e8a24a; --accent-soft:#3a2d1c;
  --teal:#5fb3ab; --note:#c6a675; --on-accent:#14161a; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ja);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ヘッダー */
#hdr{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;z-index:20}
.hdr-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:34px}
.hdr-title{font-weight:700;font-size:1.05rem;letter-spacing:.01em;min-width:0;flex:1 1 auto}
.hdr-sub{font-size:.72rem;color:var(--fg-dim);letter-spacing:.06em;text-transform:uppercase}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chipbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:4px 9px;
  font-size:.78rem;font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chipbtn b{color:var(--accent);font-weight:700}
.chipbtn .stp{color:var(--fg-dim);font-weight:700;padding:0 2px}
.chipbtn .stp:hover{color:var(--accent)}
.act.rec{background:#c0392b;color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.62}}
.act{background:var(--accent);color:var(--on-accent);border-radius:7px;padding:6px 13px;font-size:.8rem;font-weight:700}
.ghost{border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:.8rem}

/* 本文 */
#main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 28px}
.wrap{max-width:760px;margin:0 auto}
.wrap.wide{max-width:1700px}

/* フッタータブ */
#tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));z-index:20}
#tabs button{padding:9px 4px 11px;font-size:.68rem;color:var(--fg-dim);display:flex;flex-direction:column;
  align-items:center;gap:3px;border-top:2px solid transparent;margin-top:-1px}
#tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent);font-weight:700}
#tabs svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* 曲リスト */
.songlist{display:flex;flex-direction:column;gap:8px}
.songrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;text-align:left;width:100%}
.songrow:hover{border-color:var(--accent)}
.songrow .nm{flex:1 1 auto;min-width:0;font-weight:500;text-align:left;padding:2px 0}
.star{flex:0 0 auto;font-size:1.05rem;color:var(--fg-dim);line-height:1;padding:3px 2px}
.star.on{color:var(--accent)}
.star:hover{color:var(--accent)}
.tabdiv{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.moderow{display:flex;align-items:center;gap:7px;margin-bottom:16px;font-size:.72rem;color:var(--fg-dim)}
.mini{border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:.72rem;background:var(--surface)}
.mini.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.songrow .ar{font-size:.76rem;color:var(--fg-dim);margin-top:2px}
.songrow .kv{font-family:var(--font-mono);font-size:.74rem;color:var(--accent);
  background:var(--accent-soft);padding:3px 7px;border-radius:5px;white-space:nowrap}
.secthead{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-dim);
  margin:4px 0 10px;font-weight:700}

/* コード譜 */
#sheet{font-size:var(--sheet-size,16px)}
.blk{margin-bottom:2px}
.spacer{height:1.1em}
/* コードと、その下の歌詞を1組にして並べる。狭いときは組ごと折り返す */
.pairrow{display:block}
.seg{display:inline-block;vertical-align:top;max-width:100%}
.seg .sc{display:block;height:1.5em;line-height:1.5;white-space:nowrap;
  font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:.92em}
.seg .sc.s{color:var(--teal);font-family:var(--font-ja);font-weight:700}
.seg .sc.n{color:var(--note);font-family:var(--font-ja);font-weight:400;font-size:.8em}
.seg .sc.b{color:var(--fg-dim)}
.seg .sc.c{cursor:pointer;border-bottom:1px dotted transparent}
.seg .sc.c:hover{border-bottom-color:var(--accent)}
/* 長い歌詞は、日本語の折り返しのきまりに従って自然な位置で改行する */
/* 歌詞が無い塊でも高さを保ち、コードが下にずり落ちないようにする */
.seg .sl{display:block;line-height:1.5;min-height:1.5em;white-space:pre-wrap;
  overflow-wrap:break-word;word-break:normal;line-break:strict}
.lrow{line-height:1.5;white-space:pre-wrap;overflow-wrap:break-word;
  word-break:normal;line-break:strict}
.lrow.extra{opacity:.92}

/* ダイアグラム */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px 8px;text-align:center}
.dcard .dn{font-family:var(--font-mono);font-weight:700;font-size:.92rem;color:var(--accent);margin-bottom:2px}
.dcard .dl{font-size:.66rem;color:var(--fg-dim);margin-top:4px}
.dcard svg{width:76px;height:92px}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
  z-index:50;padding:20px}
#popbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:440px;width:100%}
#popbox h3{margin:0 0 4px;font-family:var(--font-mono);color:var(--accent);font-size:1.3rem}
#popbox p{margin:0 0 14px;font-size:.78rem;color:var(--fg-dim)}

/* コード選択 */
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker .pk{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:7px 11px;font-family:var(--font-mono);font-weight:700;font-size:.86rem;
  display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25;min-width:48px}
.picker .pk i{font-style:normal;font-family:var(--font-ja);font-weight:400;font-size:.62rem;color:var(--fg-dim)}
.picker .pk:hover{border-color:var(--accent)}
.picker .pk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.picker .pk.on i{color:var(--on-accent);opacity:.8}
.picker.q .pk{min-width:0;align-items:flex-start;padding:7px 12px}
.picker.q .pk b{font-weight:700}

/* 一括読み込み */
.drop{border:2px dashed var(--line);border-radius:11px;padding:22px 14px;text-align:center;
  color:var(--fg-dim);font-size:.84rem;transition:border-color .15s,background .15s}
.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0 0 12px}
.brow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:9px;margin-bottom:6px;background:var(--surface)}
.brow input{accent-color:var(--accent);width:17px;height:17px;flex:0 0 auto}
.brow .bn{flex:1 1 auto;min-width:0;font-size:.84rem}
.brow .bf{font-size:.7rem;color:var(--fg-dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bs{font-family:var(--font-mono);font-size:.7rem;color:var(--accent);white-space:nowrap}
.brow.bad{opacity:.5}
.brow.bad .bs{color:var(--fg-dim)}

.brow .edited{font-style:normal;font-size:.62rem;color:var(--accent);background:var(--accent-soft);
  padding:1px 6px;border-radius:4px;margin-left:7px}
.warnbox{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:10px 13px;margin-bottom:14px;font-size:.8rem;line-height:1.7}
.warnbox b{color:var(--accent)}
.brow .bs.warn{color:var(--accent)}

/* コードのボタン */
.picker.cp{gap:5px}
.picker.cp .pk{min-width:0;padding:6px 11px;font-size:.82rem}
.picker.cp .pk.sub{opacity:.78;font-size:.76rem;padding:5px 9px}
.mypk{display:inline-flex;align-items:center;gap:5px}
.mypk input{width:118px;padding:5px 9px;font-size:.8rem;border-radius:7px;
  font-family:var(--font-mono);background:var(--surface);color:var(--fg);border:1px solid var(--line)}

/* 左右並び（広い画面）／上下（狭い画面） */
.split{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:900px){ .split{grid-template-columns:1fr 1fr;align-items:start} }
.split .card{margin-bottom:0;display:flex;flex-direction:column;min-width:0}
.split textarea{min-height:52vh;max-height:68vh;margin:0}
.split #editPrev,.split #bPrev{min-height:52vh;max-height:68vh;overflow-y:auto;overflow-x:hidden;
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px}
.split #editPrev .lrow,.split #bPrev .lrow{overflow:visible}

/* 行ごとの切り替えボタン */
.lntg{position:absolute;left:-30px;top:0;width:24px;height:1.5em;border-radius:6px;
  font-size:.74rem;line-height:1;color:var(--fg-dim);border:1px solid transparent;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.lntg:hover{border-color:var(--accent);color:var(--accent)}
.lntg.on{color:var(--accent)}
.lntg.hint{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.blk.withtg{position:relative}
.blk.withtg .lntg{position:absolute;left:-30px;top:0}
#editPrev #sheet,#bPrev #sheet{padding-left:32px}

/* 読み取り結果の見出し */
.prevhead{display:flex;flex-wrap:wrap;gap:9px 20px;padding:11px 13px;margin-bottom:14px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px}
.ph{display:flex;flex-direction:column;gap:2px;min-width:0}
.ph span{font-size:.66rem;letter-spacing:.06em;color:var(--fg-dim)}
.ph b{font-size:.88rem;word-break:break-all}
.ph i{font-style:normal;font-size:.62rem;color:var(--accent);background:var(--accent-soft);
  padding:1px 6px;border-radius:4px;margin-left:6px}

/* 曲画面ヘッダ */
.hdr-row1{display:flex;align-items:center;gap:8px;flex:1 1 100%;min-width:0}
.hdr-sub2{font-size:.72rem;color:var(--fg-dim);font-weight:400;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 曲名のところを左右にスワイプしてページをめくる */
.songnav{touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab}
.songnav .tt{min-width:0}
.pg{flex:0 0 auto;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;
  font-size:1.15rem;line-height:1;color:var(--fg);display:inline-flex;
  align-items:center;justify-content:center}
.pg:hover{background:var(--surface-2)}
.pg[disabled]{opacity:.28;pointer-events:none}
/* バージョン切り替えの帯 */
.vrow{display:flex;align-items:center;gap:7px;flex:1 1 100%;flex-wrap:wrap;margin-top:2px}
.vlab{font-size:.68rem;letter-spacing:.07em;font-weight:700;color:var(--fg-dim);flex:0 0 auto}
.vb{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.78rem;
  background:var(--surface);color:var(--fg);display:inline-flex;align-items:baseline;gap:6px}
.vb i{font-style:normal;font-size:.68rem;color:var(--fg-dim)}
.vb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vb.on i{color:var(--on-accent);opacity:.75}
.vb:not(.on):hover{background:var(--surface-2)}
/* 取り込みのときの重複おしらせ */
.dup{border:1px solid var(--warn);background:var(--warn-bg);border-radius:0 0 9px 9px;
  border-top:none;padding:10px 12px;margin:-7px 0 9px;font-size:.8rem}
.dup b{color:var(--warn)}
.dup .ch{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dup .ch button{border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:7px;padding:5px 10px;font-size:.76rem}
.dup .ch button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dup input[type=text]{width:100%;margin-top:8px;padding:6px 9px;font-size:.8rem;
  border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg)}
.dup .diff{margin-top:7px;font-size:.73rem;color:var(--fg-dim);line-height:1.6;
  max-height:5.2em;overflow:hidden}
.verbadge{font-style:normal;font-size:.66rem;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:1px 6px;margin-left:6px;white-space:nowrap}

/* 編集・選択 */
.erow{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.erow .field{margin-bottom:0}
.ghost.danger,.mini.danger{color:#c0392b;border-color:#c0392b}
.ghost.danger:hover,.mini.danger:hover{background:#c0392b;color:#fff}
.mini[disabled]{opacity:.4;pointer-events:none}
.songrow.sel{border-color:var(--accent);background:var(--accent-soft)}
.songrow input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex:0 0 auto}
.selbar{display:flex;gap:7px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;margin-bottom:14px;position:sticky;
  top:env(safe-area-inset-top,0px);z-index:5}

.tidylist{max-height:46vh;overflow-y:auto;margin-bottom:4px}
.resetline{margin-top:26px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.resetline button{font-size:.74rem;color:var(--fg-dim);padding:6px 12px;border-radius:7px;
  border:1px solid transparent}
.resetline button:hover{color:#c0392b;border-color:#c0392b}

/* 押さえ方の手入力 */
.fretrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
.fc{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;padding:7px 3px}
.fc span{font-size:.62rem;color:var(--fg-dim)}
.fc b{font-family:var(--font-mono);font-size:.95rem;color:var(--accent);min-height:1.2em}
.fc .mini{padding:2px 7px;font-size:.72rem}

/* セットリストの並べ替え */
.pl .r.drag{user-select:none}
.pl .grip{cursor:grab;color:var(--fg-dim);font-size:.9rem;letter-spacing:-2px;padding:0 6px;
  flex:0 0 auto;touch-action:none}
.pl .r.dragging{box-shadow:0 6px 20px rgba(0,0,0,.28);border-color:var(--accent);opacity:.95}
.ph-slot{border:2px dashed var(--accent);border-radius:9px;margin-bottom:6px;background:var(--accent-soft)}
.pl .r.missing{opacity:.6}
.pl .ar{font-size:.72rem;color:var(--fg-dim);margin-top:2px}
#popbox input[type=text]{background:var(--surface);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;font-size:.9rem;width:100%}

/* 共有 */
#shareToast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:9px;
  font-size:.82rem;max-width:84vw;text-align:center;word-break:break-all;
  box-shadow:0 4px 18px rgba(0,0,0,.25)}
.shrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);
  border-radius:9px;margin-bottom:6px;background:var(--surface);flex-wrap:wrap}
.shrow .sn{flex:1 1 auto;min-width:0;font-size:.84rem}
.shrow .sf{font-size:.7rem;color:var(--fg-dim);margin-top:2px}

/* 同期バー */
.syncbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:.76rem;color:var(--fg-dim);
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-bottom:14px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--fg-dim);flex:0 0 auto}
.sdot.ok{background:#3f9e5a}
.sdot.wait{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.sdot.err{background:#c0392b}
.syncerr{flex:1 1 100%;background:var(--accent-soft);border-radius:7px;padding:9px 11px;margin-top:4px;
  display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.syncerr b{color:var(--accent);font-size:.78rem}
.syncerr code{font-family:var(--font-mono);font-size:.68rem;line-height:1.5;word-break:break-all;
  background:none;border:none;padding:0;color:var(--fg)}
.syncbar .who{margin-left:auto;font-size:.7rem;opacity:.75;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:48%}

/* 解析結果のタイムライン */
.tl{display:flex;flex-wrap:wrap;gap:5px}
.tlr{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:4px 9px}
.tlr .tt{font-family:var(--font-mono);font-size:.64rem;color:var(--fg-dim);font-variant-numeric:tabular-nums}

<body>

<header id="hdr">
  <div class="hdr-row" id="hdrInner"></div>
</header>

<div id="main"><div class="wrap" id="view"></div></div>

<nav id="tabs"></nav>

<div id="shareToast" hidden></div>

<div id="pop" hidden><div id="popbox">
  <h3 id="popName"></h3>
  <p id="popDesc"></p>
  <div class="dgrid" id="popGrid"></div>
  <div class="btnrow" style="margin-top:14px"><button class="ghost" onclick="closePop()">閉じる</button></div>
</div></div>

<script>
/* ============ 0. 音源の解析エンジン ============ */
/* 音源からコード進行を推定する（ブラウザでも node でも動く純粋処理） */
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function fft(re, im){
  const n = re.length;
  for (let i=1, j=0; i<n; i++){
    let bit = n>>1;
    for (; j & bit; bit>>=1) j ^= bit;
    j ^= bit;
    if (i<j){ [re[i],re[j]]=[re[j],re[i]]; [im[i],im[j]]=[im[j],im[i]]; }
  }
  for (let len=2; len<=n; len<<=1){
    const ang = -2*Math.PI/len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i=0; i<n; i+=len){
      let cr=1, ci=0;
      for (let k=0; k<len/2; k++){
        const ur=re[i+k], ui=im[i+k];
        const vr=re[i+k+len/2]*cr - im[i+k+len/2]*ci;
        const vi=re[i+k+len/2]*ci + im[i+k+len/2]*cr;
        re[i+k]=ur+vr; im[i+k]=ui+vi;
        re[i+k+len/2]=ur-vr; im[i+k+len/2]=ui-vi;
        const ncr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=ncr;
      }
    }
  }
}

// 波形 → フレームごとのスペクトル、クロマ、オンセット強度
function spectra(y, sr, N=4096, H=2048){
  const win = new Float32Array(N);
  for (let i=0;i<N;i++) win[i] = 0.5 - 0.5*Math.cos(2*Math.PI*i/(N-1));
  const nF = Math.max(1, Math.floor((y.length - N)/H) + 1);
  const chroma = [], flux = [];
  let prev = null;
  // ビン → ピッチクラス の対応表（55Hz〜2000Hz）
  const binPc = new Int16Array(N/2).fill(-1);
  const binW  = new Float32Array(N/2);
  for (let b=1;b<N/2;b++){
    const f = b*sr/N;
    if (f<55 || f>2000) continue;
    const p = 69 + 12*Math.log2(f/440);
    binPc[b] = ((Math.round(p)%12)+12)%12;
    binW[b]  = 1/(1+Math.abs(p-Math.round(p))*2);   // 中心から離れるほど弱く
  }
  const re = new Float32Array(N), im = new Float32Array(N);
  for (let t=0;t<nF;t++){
    const off = t*H;
    for (let i=0;i<N;i++){ re[i] = (y[off+i]||0)*win[i]; im[i]=0; }
    fft(re, im);
    const mag = new Float32Array(N/2);
    for (let b=0;b<N/2;b++) mag[b] = Math.hypot(re[b], im[b]);
    const c = new Float32Array(12);
    for (let b=1;b<N/2;b++) if (binPc[b]>=0) c[binPc[b]] += mag[b]*binW[b];
    chroma.push(c);
    let f = 0;
    if (prev) for (let b=0;b<N/2;b++){ const d = mag[b]-prev[b]; if (d>0) f += d; }
    flux.push(f);
    prev = mag;
  }
  return {chroma, flux, hop:H, nF};
}

// オンセット強度の自己相関からテンポを出す
function estimateTempo(flux, sr, hop){
  const fps = sr/hop;
  const m = flux.reduce((a,b)=>a+b,0)/flux.length;
  const x = flux.map(v=>Math.max(0, v-m));
  let best = {bpm:120, score:-1};
  for (let bpm=60; bpm<=200; bpm+=0.5){
    const lag = Math.round(fps*60/bpm);
    if (lag<2 || lag>=x.length) continue;
    let s=0, n=0;
    for (let i=0;i+lag<x.length;i++){ s += x[i]*x[i+lag]; n++; }
    s = n? s/n : 0;
    if (s>best.score) best = {bpm, score:s};
  }
  return best.bpm;
}

const KS_MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
const KS_MIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
function corr(a,b){
  const ma=a.reduce((x,y)=>x+y,0)/12, mb=b.reduce((x,y)=>x+y,0)/12;
  let n=0,da=0,db=0;
  for(let i=0;i<12;i++){ n+=(a[i]-ma)*(b[i]-mb); da+=(a[i]-ma)**2; db+=(b[i]-mb)**2; }
  return n/(Math.sqrt(da*db)+1e-9);
}
function estimateKey(chroma){
  const p = new Array(12).fill(0);
  for (const c of chroma) for (let i=0;i<12;i++) p[i]+=c[i];
  const s = p.reduce((a,b)=>a+b,0)||1;
  for (let i=0;i<12;i++) p[i]/=s;
  let best=null;
  for (let i=0;i<12;i++) for (const [mode,ks] of [['major',KS_MAJ],['minor',KS_MIN]]){
    const rot = ks.map((_,j)=>ks[(j-i+12)%12]);
    const c = corr(p, rot);
    if (!best || c>best.c) best = {c, root:NAMES[i], mode};
  }
  return best;
}

const QUAL={'':[0,4,7],'m':[0,3,7],'7':[0,4,7,10],'m7':[0,3,7,10],'maj7':[0,4,7,11],'sus4':[0,5,7]};
function templates(){
  const labels=[], T=[];
  for (let r=0;r<12;r++) for (const q in QUAL){
    const v=new Array(12).fill(0);
    QUAL[q].forEach((s,k)=>{ v[(r+s)%12] = k===0?1.0:0.85; });
    const nrm=Math.hypot(...v);
    T.push(v.map(x=>x/nrm)); labels.push(NAMES[r]+q);
  }
  return {labels, T};
}
function diatonicBonus(labels, key){
  const ki = NAMES.indexOf(key.root);
  const map = key.mode==='major'
    ? {0:'',2:'m',4:'m',5:'',7:'',9:'m',11:'m7'}
    : {0:'m',2:'m7',3:'',5:'m',7:'m',8:'',10:''};
  const bonus = labels.map(()=>1);
  for (const d in map){
    const root = NAMES[(ki+ +d)%12], nm = root + map[d];
    labels.forEach((l,i)=>{
      if (l===nm) bonus[i]=1.22;
      else if (l.startsWith(root) && l.length<=nm.length+2) bonus[i]=Math.max(bonus[i],1.10);
    });
  }
  return bonus;
}

// ビート単位にクロマをまとめる
function syncToBeats(chroma, sr, hop, bpm){
  const fps = sr/hop, per = fps*60/bpm;
  const out = [], times = [];
  for (let b=0; b*per < chroma.length; b++){
    const s = Math.floor(b*per), e = Math.min(chroma.length, Math.floor((b+1)*per));
    if (e<=s) continue;
    const c = new Float32Array(12);
    for (let i=s;i<e;i++) for (let k=0;k<12;k++) c[k]+=chroma[i][k];
    out.push(c); times.push(s*hop/sr);
  }
  return {beats:out, times};
}

function analyze(y, sr, opts={}){
  const {chroma, flux, hop} = spectra(y, sr);
  const bpm = opts.bpm || estimateTempo(flux, sr, hop);
  const key = estimateKey(chroma);
  const {beats, times} = syncToBeats(chroma, sr, hop, bpm);
  const {labels, T} = templates();
  const bonus = diatonicBonus(labels, key);
  const N = labels.length, F = beats.length;
  // 当てはまり
  const logp = [];
  for (let t=0;t<F;t++){
    const c = beats[t], nrm = Math.hypot(...c)||1;
    const col = new Float32Array(N);
    for (let i=0;i<N;i++){
      let d=0; for (let k=0;k<12;k++) d += T[i][k]*c[k]/nrm;
      col[i] = Math.log(Math.max(1e-6, d*bonus[i]))*12;
    }
    logp.push(col);
  }
  // 同じコードに留まりやすくする
  const STAY = 2.4;
  let dp = Float32Array.from(logp[0]||[]);
  const back = [];
  for (let t=1;t<F;t++){
    let bestPrev=-Infinity, argPrev=0;
    for (let i=0;i<N;i++) if (dp[i]>bestPrev){ bestPrev=dp[i]; argPrev=i; }
    const nx = new Float32Array(N), bk = new Int16Array(N);
    for (let i=0;i<N;i++){
      const stay = dp[i]+STAY;
      if (stay>bestPrev){ nx[i]=stay; bk[i]=i; } else { nx[i]=bestPrev; bk[i]=argPrev; }
      nx[i]+=logp[t][i];
    }
    dp = nx; back.push(bk);
  }
  let cur=0; for (let i=0;i<N;i++) if (dp[i]>dp[cur]) cur=i;
  const path = new Array(F); path[F-1]=cur;
  for (let t=F-1;t>0;t--){ cur = back[t-1][cur]; path[t-1]=cur; }
  const seq = [];
  for (let t=0;t<F;t++){
    const nm = labels[path[t]];
    if (seq.length && seq[seq.length-1].chord===nm) continue;
    seq.push({t: times[t], chord: nm});
  }
  return {bpm, key, sequence:seq, beatCount:F, duration:y.length/sr};
}

/* ============ 1. 正規化とパーサー ============ */
const SEP = new Set([' ','　','\t','・','･']);

function charWidth(ch){
  const c = ch.codePointAt(0);
  if (c === 0x3000) return 2;
  if (c < 0x1100) return 1;
  if ((c>=0x1100&&c<=0x115f)||(c>=0x2e80&&c<=0xa4cf)||(c>=0xac00&&c<=0xd7a3)||
      (c>=0xf900&&c<=0xfaff)||(c>=0xfe30&&c<=0xfe6f)||(c>=0xff00&&c<=0xff60)||
      (c>=0xffe0&&c<=0xffe6)) return 2;
  return 1;
}
function dispWidth(s){ let w=0; for(const ch of s) w+=charWidth(ch); return w; }

// 全角・音楽記号をコード判定用に正規化（位置計算は元テキストで済ませてある）
function normTok(t){
  let s = t.normalize('NFKC');
  s = s.replace(/♭/g,'b').replace(/♯/g,'#').replace(/♮/g,'');
  s = s.replace(/[\u2212\u2013\u2014]/g,'-');   // 各種のマイナス記号
  s = s.replace(/[△Δ]/g,'M');                   // △ Δ はメジャーセブンス
  s = s.replace(/[【】\[\]]/g,'');
  return s.trim();
}

// コード名の後ろに付きうる部分。長いものから順に消費して判定する
const CHORD_SUFFIX = [
  // マイナーメジャー系（mM7 など）は m より先に見る必要がある
  'minmaj7','minMaj7','mmaj7','mMaj7','mMAJ7','mM7','mM9','mM',
  'maj13','maj11','maj9','maj7','Maj13','Maj11','Maj9','Maj7','MAJ7',
  'M13','M11','M9','M7','MA7',
  'min13','min11','min9','min7','min6','min',
  'm13','m11','m9','m7','m6','m',
  'dim7','dim','°7','°','aug','ø7','ø','hdim',
  'sus4','sus2','sus',
  'add13','add11','add9','add4','add2',
  'omit3','omit5','no3','no5','alt',
  '6/9','69','13','11','9','7','6','5','4','3','2',
  'b13','-13','#11','+11','b11','b9','-9','#9','+9','b5','-5','#5','+5',
  'maj','Maj','MAJ','M','+','-',
  '(',')',' '
].sort((a,b)=>b.length - a.length);

// コード名として読めるか
function isChordName(s){
  if (!s) return false;
  const m = /^([A-G][#b]?)(.*)$/.exec(s);
  if (!m) return false;
  let rest = m[2];
  // 分数コードのベース音を先に外す
  const sl = /\/([A-G][#b]?)$/.exec(rest);
  if (sl) rest = rest.slice(0, rest.length - sl[0].length);
  let guard = 0;
  while (rest && guard++ < 16){
    const hit = CHORD_SUFFIX.find(p=>rest.startsWith(p));
    if (!hit) return false;
    rest = rest.slice(hit.length);
  }
  return !rest;
}
// 既存の呼び出しと形を合わせる
const CHORD_RE = {test: isChordName};
const SECTIONS = ['イントロ','前奏','間奏','アウトロ','エンディング','サビ','リフレイン',
  'Aメロ','Bメロ','Cメロ','ソロ','ブレイク','Break','Intro','Outro','Solo','Coda','Fine'];

function classify(raw){
  const s = normTok(raw);
  if (!s) return null;
  if (CHORD_RE.test(s)) return {kind:'c', text:s};
  // 「D/」「D//」のように後ろにスラッシュだけ付くのは拍の印。コードとして読む
  const bare = s.replace(/[\/|｜]+$/, '');
  if (bare !== s && bare && CHORD_RE.test(bare)) return {kind:'c', text:bare, beat:true};
  // 「ConG」「C(onG)」「Cオン G」のような オン表記 も分数コードとして読む
  const onm = s.match(/^(.+?)[(（]?\s*(?:on|ON|On|oN|オン)\s*([A-G][#b]?)[)）]?$/);
  if (onm){
    const head = onm[1].replace(/[(（)）]/g, '').trim();
    if (CHORD_RE.test(head)){
      // 表示は元の書き方のまま、中身は分数コードとして扱う
      return {kind:'c', text: head + '/' + onm[2], disp: raw.trim()};
    }
  }
  if (/^[\/|｜]+$/.test(s)) return {kind:'b', text:s};
  if (/^[xX×]\s*\d+$/.test(s)||/^\d+\s*回$/.test(s)) return {kind:'s', text:s};
  for (const w of SECTIONS){
    if (s===w) return {kind:'s', text:s};
    if (new RegExp('^'+w+'[0-9\\-~〜ｰ－—・]*$').test(s)) return {kind:'s', text:s};
  }
  if (/^[→⇒←↓↑]+$/.test(s)) return {kind:'b', text:s};
  if (/^[(（].*[)）]$/.test(raw.trim())||/^[→⇒]/.test(s)) return {kind:'n', text:raw.trim()};
  return {kind:'x', text:s};
}

// 「CGEmAm」のように区切りなしで繋がったコードを分割する
function splitRunOn(tok){
  const s = normTok(tok);
  if (s.length < 2 || !/^[A-G]/.test(s)) return null;
  const out = [];
  let rest = s, guard = 0;
  while (rest && guard++ < 20){
    let hit = null;
    for (let len = Math.min(rest.length, 7); len >= 1; len--){
      const head = rest.slice(0, len);
      if (CHORD_RE.test(head)){ hit = head; break; }
    }
    if (!hit) return null;
    out.push(hit);
    rest = rest.slice(hit.length);
  }
  return out.length >= 2 ? out : null;
}

function tokenize(line){
  // 括弧つきの演奏指示は切り離すが、「(onG)」はコードの一部なので残す
  line = line.replace(/([(（][^)）]*[)）])/g, m=>
    /^[(（]\s*(?:on|ON|On|oN|オン)\s*[A-G][#b♭♯]?\s*[)）]$/.test(m) ? m : ' ' + m + ' ');
  const toks=[]; let col=0, buf='', start=0, depth=0;
  for (const ch of line){
    if (ch==='('||ch==='（') depth++;
    if (depth===0 && SEP.has(ch)){
      if (buf){ toks.push({raw:buf,col:start}); buf=''; }
    } else {
      if (!buf) start=col;
      buf+=ch;
    }
    if (ch===')'||ch==='）') depth=Math.max(0,depth-1);
    col+=charWidth(ch);
  }
  if (buf) toks.push({raw:buf,col:start});

  // 「C on G」のように離れて書かれたオン表記を1つにまとめる
  for (let i = 0; i < toks.length - 2; i++){
    if (!/^(on|ON|On|oN|オン)$/.test(normTok(toks[i+1].raw))) continue;
    const head = normTok(toks[i].raw).replace(/[(（)）]/g, '');
    const bass = normTok(toks[i+2].raw).replace(/[)）]/g, '');
    if (!CHORD_RE.test(head) || !/^[A-G][#b]?$/.test(bass)) continue;
    const disp = toks[i].raw + ' ' + toks[i+1].raw + ' ' + toks[i+2].raw;
    toks.splice(i, 3, {raw: disp, col: toks[i].col, joined: head + '/' + bass});
  }

  // 連結コードを展開（位置はトークン内の表示幅で按分）
  const out = [];
  for (const t of toks){
    if (t.joined){ out.push(t); continue; }
    if (classify(t.raw) && classify(t.raw).kind !== 'x'){ out.push(t); continue; }
    const parts = splitRunOn(t.raw);
    if (!parts){ out.push(t); continue; }
    let off = 0;
    for (const pt of parts){ out.push({raw:pt, col:t.col + off}); off += dispWidth(pt); }
  }
  return out;
}

// 'chord' = コードを含む行 / 'section' = セクション名だけの行 / 'lyric' = それ以外
function lineKind(line){
  const toks = tokenize(line);
  if (!toks.length) return 'lyric';
  const cls = toks.map(t=>t.joined ? {kind:'c', text:t.joined} : classify(t.raw));
  const bad = cls.filter(c=>!c || c.kind==='x');
  if (!bad.length){
    if (cls.some(c=>c.kind==='c')) return 'chord';
    if (cls.some(c=>c.kind==='s')) return 'section';
    return 'lyric';
  }
  // 読み違いが少し混ざっていても、大半がコードならコード行とみなす
  const nc = cls.filter(c=>c && c.kind==='c').length;
  const looksLyric = bad.some(c=>!c || /[ぁ-んァ-ヶ一-龠]/.test(c.text) || c.text.length > 6);
  if (nc >= 2 && nc / cls.length >= 0.6 && !looksLyric) return 'chord';
  return 'lyric';
}
function isChordLine(line){ return lineKind(line) !== 'lyric'; }

// コードの並びからキーを推測する
function guessKey(blocks){
  const count = {}, seq = [];
  blocks.forEach(b=>(b.chords||[]).forEach(c=>{
    if (c.kind !== 'c') return;
    const m = c.text.match(/^([A-G][#b]?)(m(?!aj))?/);
    if (!m) return;
    const root = pc(m[1]);
    if (root < 0) return;
    const k = root + '|' + (m[2] ? 'm' : 'M');
    count[k] = (count[k] || 0) + 1;
    seq.push(k);
  }));
  const total = Object.values(count).reduce((a,b)=>a+b, 0);
  if (total < 3) return null;
  // 曲の最初と最後は主和音になりやすい
  const edge = {};
  if (seq.length){
    edge[seq[0]] = (edge[seq[0]] || 0) + 2.5;
    edge[seq[seq.length-1]] = (edge[seq[seq.length-1]] || 0) + 3.5;
  }

  // メジャーキーの I ii iii IV V vi / マイナーキーの i ii° III iv v VI VII
  const MAJ = [[0,'M'],[2,'m'],[4,'m'],[5,'M'],[7,'M'],[9,'m'],[11,'m']];
  const MIN = [[0,'m'],[3,'M'],[5,'m'],[7,'m'],[8,'M'],[10,'M'],[2,'m']];
  // 主要な和音ほど重くみる
  const W_MAJ = {0:3, 7:2.4, 5:2.2, 9:1.8, 2:1.2, 4:1.0, 11:0.8};
  const W_MIN = {0:3, 7:2.2, 5:2.0, 8:1.8, 10:1.6, 3:1.4, 2:0.8};

  let best = null;
  for (let r = 0; r < 12; r++){
    for (const [mode, set, W] of [['major', MAJ, W_MAJ], ['minor', MIN, W_MIN]]){
      let score = 0;
      for (const k in count){
        const [pcs, q] = k.split('|');
        const deg = ((+pcs - r) + 12) % 12;
        const hit = set.find(d=>d[0] === deg && d[1] === q);
        if (hit) score += count[k] * (W[deg] || 1);
        else score -= count[k] * 0.45;      // キー外は減点
      }
      const tonic = r + '|' + (mode === 'minor' ? 'm' : 'M');
      score += (edge[tonic] || 0);
      if (!best || score > best.score) best = {score, root: SHARP[r], mode};
    }
  }
  if (!best || best.score <= 0) return null;
  return best;
}

// 本文だけを行に分ける。空行はそのまま残し、@ で始まる行はコード行として扱う
function parseBody(text){
  const lines = String(text == null ? '' : text).replace(/\r\n/g,'\n').split('\n');
  const blocks = [];
  let cur = null;
  for (let idx = 0; idx < lines.length; idx++){
    const raw = lines[idx];
    if (!raw.trim()){
      if (cur){ blocks.push(cur); cur = null; }
      blocks.push({blank:true, srcLine: idx});
      continue;
    }
    let line = raw, forced = false;
    if (/^[@＠]/.test(line)){ line = line.replace(/^[@＠]\s?/, ''); forced = true; }
    if (forced || isChordLine(line)){
      if (cur) blocks.push(cur);
      cur = {forced, srcLine: idx, chords: tokenize(line).map(t=>{
        const c = t.joined
          ? {kind:'c', text:t.joined, disp:t.raw.trim()}
          : (classify(t.raw) || {kind:'x', text:t.raw});
        // コードとして読めない語は注記として残す（直す目印になる）
        return {...c, kind: (c.kind === 'x' ? 'n' : c.kind), col:t.col};
      }), lyrics:[]};
    } else {
      if (cur) cur.lyrics.push({text:line, srcLine: idx});
      else blocks.push({chords:[], lyrics:[{text:line, srcLine: idx}]});
    }
  }
  if (cur) blocks.push(cur);
  return blocks;
}

function parseSheet(text){
  let lines = text.replace(/\r\n/g,'\n').split('\n');
  const out = {title:'', artist:'', credit:'', key:null, keyGuessed:false,
               capo:null, bpm:null, transpose:0, folder:'', vname:'', blocks:[]};

  // --- 冒頭の --- で挟まれた情報欄を読み取り、本文からは外す ---
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  if (lines[i] !== undefined && lines[i].trim() === '---'){
    let j = i + 1;
    while (j < lines.length && lines[j].trim() !== '---') j++;
    if (j < lines.length){
      lines.slice(i + 1, j).forEach(L=>{
        const m = L.match(/^\s*([A-Za-z_]+)\s*:\s*(.*)$/);
        if (!m) return;
        const k = m[1].toLowerCase(), v = m[2].trim();
        if (k === 'title') out.title = v;
        else if (k === 'artist') out.artist = v;
        else if (k === 'key') out.key = normTok(v);
        else if (k === 'capo') out.capo = parseInt(v, 10) || 0;
        else if (k === 'bpm') out.bpm = parseInt(v, 10) || null;
        else if (k === 'folder') out.folder = v;
        else if (k === 'version') out.vname = v;
        else if (k === 'transpose') out.transpose = parseInt(v, 10) || 0;
        else if (k === 'speed' && !out.bpm){
          const sp = parseFloat(v);
          if (sp > 0 && sp < 2) out.bpm = Math.round(sp * 480);   // 旧形式の目安
        }
      });
      lines = lines.slice(j + 1);
      i = 0;
    }
  }

  // --- 1行目を曲名として拾う（コード行・キー行でなければ） ---
  const looksLikeKeyLine = L =>
    /Key\s*(?:on|=|:|：)?\s*[A-G]/i.test(L) || /Capo/i.test(L.normalize('NFKC'));
  while (i < lines.length && !lines[i].trim()) i++;
  if (i < lines.length && !isChordLine(lines[i]) && !looksLikeKeyLine(lines[i])){
    const head = lines[i].trim();
    // 「曲名　作詞・作曲／○○」のように1行に同居している場合は切り分ける
    const cm = head.match(/^(.*?)[\s\u3000]*(作詞|作曲|編曲|words|music)[^\s]*[\s\u3000]*[／\/:：][\s\u3000]*(.+)$/i);
    if (cm){
      if (!out.title) out.title = cm[1].trim();
      if (!out.artist) out.artist = cm[3].trim();
      out.credit = head;
    } else if (!out.title){
      out.title = head;
    }
    i++;
  }

  const body = [];
  for (; i < lines.length; i++){
    const line = lines[i];
    if (!line.trim()){ body.push(''); continue; }

    // クレジット行は本文に残さない
    if (/(作詞|作曲|編曲)/.test(line) && !isChordLine(line)){
      if (!out.credit) out.credit = line.trim();
      if (!out.artist){
        const am = line.match(/[／\/:：][\s\u3000]*(.+)$/);
        if (am) out.artist = am[1].trim().split(/[\s\u3000]+/)[0];
      }
      continue;
    }
    // キー・カポの指定行も本文に残さない
    const km = line.match(/Key\s*(?:on|=|:|：)?\s*([A-G][#b♭♯]?)/i);
    const cp = line.normalize('NFKC').match(/(\d+)\s*Capo/i)
            || line.normalize('NFKC').match(/Capo\s*[:：=]?\s*(\d+)/i);
    if (km && line.trim().length < 40){
      if (!out.key) out.key = normTok(km[1]);
      if (cp && out.capo == null) out.capo = +cp[1];
      continue;
    }

    body.push(line);
  }
  out.body = body.join('\n').replace(/^\n+/,'').replace(/\n{3,}$/,'\n');
  out.blocks = parseBody(out.body);

  // --- 書いていなければコードから推測する ---
  if (!out.key){
    const g = guessKey(out.blocks);
    if (g){ out.key = g.root + (g.mode === 'minor' ? 'm' : ''); out.keyGuessed = true; }
  }
  return out;
}

/* ============ 2. 移調 ============ */
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATEQ={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#','Cb':'B','Fb':'E'};
function pc(n){ return SHARP.indexOf(FLATEQ[n]||n); }
function shiftRoot(root,n){
  const i = pc(root); if (i<0) return root;
  return SHARP[(i+n%12+12)%12];
}
function transposeChord(ch,n){
  if (!n) return ch;
  let out = ch.replace(/^([A-G][#b]?)/, (m)=>shiftRoot(m,n));
  // 「/G」も「onG」も「on G」もベース音を動かす
  out = out.replace(/(\/|\s*(?:on|ON|On|oN|オン)\s*)([A-G][#b]?)([)）]?)$/,
    (m, sep, b, tail)=>sep + shiftRoot(b, n) + tail);
  return out;
}

const QUALITIES = [

const ROOTS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ROOT_ALT = {'C#':'D♭','D#':'E♭','F#':'G♭','G#':'A♭','A#':'B♭'};

function moveForm(form, steps){
  if (steps === 0) return form.slice();
  return form.map(f => f === -1 ? -1 : f + steps);
}

// ルート音と種類から、押さえやすい順に形を返す
function buildShapes(root, qual){
  const out = [];
  const name = root + (qual === 'maj7' ? 'maj7' : qual);
  const FLATNAME = {'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb'};
  const alt = FLATNAME[root] ? FLATNAME[root] + (qual === 'maj7' ? 'maj7' : qual) : null;
  const preset = SHAPES[name] || SHAPES[root + qual] || (alt ? SHAPES[alt] : null);
  const formLabel = f => {
    if (f.includes(0)) return '開放弦を使う形';
    const lo = Math.min(...f.filter(x=>x>0));
    return lo + 'F のフォーム';
  };
  if (preset) preset.forEach(f => out.push({frets:f, label:formLabel(f)}));

  const eStep = (pc(root) - pc('E') + 12) % 12;
  if (EFORM[qual]) out.push({frets: moveForm(EFORM[qual], eStep),
    label: eStep === 0 ? '開放弦を使う形' : '6弦ルート（E型・' + eStep + 'F）'});

  const aStep = (pc(root) - pc('A') + 12) % 12;
  if (AFORM[qual]) out.push({frets: moveForm(AFORM[qual], aStep),
    label: aStep === 0 ? '開放弦を使う形' : '5弦ルート（A型・' + aStep + 'F）'});

  // 重複を除き、開放弦を含む形・低いポジションを先に
  const seen = new Set(), uniq = [];
  for (const o of out){
    const k = o.frets.join(',');
    if (seen.has(k)) continue;
    seen.add(k); uniq.push(o);
  }
  uniq.sort((a,b)=>{
    const openA = a.frets.includes(0) ? 0 : 1, openB = b.frets.includes(0) ? 0 : 1;
    if (openA !== openB) return openA - openB;
    const lo = x => Math.min(...x.frets.filter(f=>f>0).concat([99]));
    return lo(a) - lo(b);
  });
  return uniq;
}

// コード名を ルート + 種類 に分解する
function splitChord(name){
  // ♭ ♯ △ などの記号をここでも揃え、分数コードのベース音を外してから分解する
  const base = normTok(String(name||''))
    .replace(/\/.*$/, '')
    .replace(/[(（]?\s*(?:on|ON|On|oN|オン)\s*[A-G][#b]?\s*[)）]?$/, '');
  const m = base.match(/^([A-G][#b]?)(.*)$/);
  if (!m) return null;
  let q = (m[2] || '').replace(/[()（） ]/g, '');
  const MAP = {
    'M7':'maj7','Maj7':'maj7','MAJ7':'maj7','MA7':'maj7','maj7':'maj7',
    'M9':'maj7','maj9':'maj7','Maj9':'maj7',
    'min7':'m7','min':'m','min6':'m6','min9':'m7',
    'mM7':'mM7','mMaj7':'mM7','mmaj7':'mM7','minmaj7':'mM7','minMaj7':'mM7','mM':'mM7',
    'm7-5':'m7b5','m7b5':'m7b5','mb5':'m7b5','ø':'m7b5','ø7':'m7b5','hdim':'m7b5',
    'dim7':'dim','°':'dim','°7':'dim',
    '+':'aug','+5':'aug','aug5':'aug',
    'sus':'sus4','69':'6','6/9':'6',
    'm11':'m7','m13':'m7','11':'9','13':'9','M11':'maj7','M13':'maj7'
  };
  if (MAP[q]) q = MAP[q];
  return {root: FLATEQ[m[1]] || m[1], qual: q};
}

function diagramSVG(frets){
  const played = frets.filter(f=>f>0);
  const minF = played.length?Math.min(...played):1;
  const base = minF>4 ? minF : 1;
  const W=76,H=92, L=12, T=20, SW=10, FH=13;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  // ナット or ポジション番号
  if (base===1) s += `<rect x="${L}" y="${T-3}" width="${SW*5}" height="3" fill="currentColor"/>`;
  else s += `<text x="${L-3}" y="${T+9}" font-size="8" text-anchor="end" fill="currentColor" opacity=".65">${base}</text>`;
  for(let i=0;i<6;i++) s += `<line x1="${L+i*SW}" y1="${T}" x2="${L+i*SW}" y2="${T+FH*4}" stroke="currentColor" stroke-width="1" opacity=".45"/>`;
  for(let i=0;i<=4;i++) s += `<line x1="${L}" y1="${T+i*FH}" x2="${L+SW*5}" y2="${T+i*FH}" stroke="currentColor" stroke-width="1" opacity=".45"/>`;
  // バレー（同じフレットを3本以上押さえていればバーを描く）
  const lowest = played.length ? Math.min(...played) : 0;
  if (lowest > 0){
    const idxs = frets.map((f,i)=>f===lowest?i:-1).filter(i=>i>=0);
    if (idxs.length >= 3){
      const row = lowest - base;
      if (row >= 0 && row < 4){
        const x1 = L + Math.min(...idxs)*SW, x2 = L + Math.max(...idxs)*SW;
        s += `<rect x="${x1-3}" y="${T+row*FH+FH/2-3}" width="${x2-x1+6}" height="6" rx="3" fill="currentColor"/>`;
      }
    }
  }
  frets.forEach((f,idx)=>{
    const x = L + idx*SW;
    if (f===-1) s += `<text x="${x}" y="${T-6}" font-size="8" text-anchor="middle" fill="currentColor" opacity=".55">×</text>`;
    else if (f===0) s += `<circle cx="${x}" cy="${T-9}" r="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".65"/>`;
    else {
      const row = f - base;
      if (row>=0 && row<4) s += `<circle cx="${x}" cy="${T+row*FH+FH/2}" r="4" fill="currentColor"/>`;
    }
  });
  return s + '</svg>';
}

/* ============ 4.5 音源の保管（IndexedDB） ============ */
let _db = null;
function audioDB(){
  if (_db) return _db;
  _db = new Promise((res,rej)=>{
    const rq = indexedDB.open('chordnote', 1);
    rq.onupgradeneeded = ()=>rq.result.createObjectStore('audio');
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror = ()=>rej(rq.error);
  }).catch(()=>null);
  return _db;
}
async function putAudio(id, blob){
  const db = await audioDB(); if (!db) return false;
  return new Promise(res=>{
    const tx = db.transaction('audio','readwrite');
    tx.objectStore('audio').put(blob, id);
    tx.oncomplete = ()=>res(true); tx.onerror = ()=>res(false);
  });
}
async function getAudio(id){
  const db = await audioDB(); if (!db) return null;
  return new Promise(res=>{
    const rq = db.transaction('audio').objectStore('audio').get(id);
    rq.onsuccess = ()=>res(rq.result || null); rq.onerror = ()=>res(null);
  });
}
async function delAudio(id){
  const db = await audioDB(); if (!db) return;
  db.transaction('audio','readwrite').objectStore('audio').delete(id);
}

    if (code === 'auth/cancelled-popup-request' || code === 'auth/user-cancelled') return;
    if (code === 'auth/popup-closed-by-user'){
      syncError = 'ログイン画面が閉じられました。もう一度お試しください。';
      syncState = 'error'; renderSyncBar(); return;
    }
    // ポップアップが開けない環境（iPad のホーム画面起動など）だけ画面遷移に切り替える
    if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment'){
      try{ await firebase.auth().signInWithRedirect(provider); return; }
      catch(e2){ showSyncError(e2, 'redirect'); return; }
    }
    showSyncError(e, 'popup');
  }
}
async function signOutSync(){
  syncError = '';
  try{ await firebase.auth().signOut(); }catch(e){ showSyncError(e, 'signOut'); }
}
function songsCol(){ return fb.collection('users').doc(fbUser.uid).collection('songs'); }

function startSync(){
  if (!fb || !fbUser) return;
  syncState = 'connecting';
  renderSyncBar();
  startMetaSync();
  if (fbUnsub) fbUnsub();
  fbUnsub = songsCol().onSnapshot(snap=>{
    if (snap.metadata.hasPendingWrites) return;   // 自分が書いた分の返りは無視
    const remote = snap.docs.map(d=>({...d.data(), id:d.id}));
    if (!remote.length && songs.length){
      pushAll();                                   // 初回: 手元の曲を上げる
    } else {
      songs = remote;
      markPushed(songs);
      if (migrateSongs()) schedulePush();
      try{ localStorage.setItem('cn_songs', JSON.stringify(songs)); }catch(e){}
    }
    syncState = 'on';
    renderSyncBar();
    if (!openSong) render();
  }, e=>showSyncError(e, '読み取り'));
}
function stopSync(){
  pushed = new Map();
  if (fbUnsub){ fbUnsub(); fbUnsub = null; }
  if (metaUnsub){ metaUnsub(); metaUnsub = null; }
  syncState = 'off';
}

async function pushAll(){
  if (!fb || !fbUser) return;
  const batch = fb.batch();
  songs.forEach(s=>{
    const {id, ...rest} = s;
    batch.set(songsCol().doc(id), rest, {merge:false});
  });
  try{ await batch.commit(); markPushed(songs); }catch(e){ showSyncError(e, '初回アップロード'); }
}

// 送信済みの内容を覚えておき、変わった曲だけ書き込む
let pushed = new Map();   // id -> JSON文字列
function snapOf(s){ const {id, ...rest} = s; return JSON.stringify(rest); }
function markPushed(list){
  pushed = new Map(list.map(s=>[s.id, snapOf(s)]));
}

function schedulePush(){
  if (!fb || !fbUser) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async ()=>{
    try{
      const nowIds = new Set(songs.map(x=>x.id));
      const writes = [];
      songs.forEach(s=>{
        const j = snapOf(s);
        if (pushed.get(s.id) !== j) writes.push({id:s.id, json:j, song:s});
      });
      const deletes = [...pushed.keys()].filter(id=>!nowIds.has(id));
      if (!writes.length && !deletes.length) return;

      // 1回のまとめ書きは400件まで
      const ops = [...writes.map(w=>({t:'w', ...w})), ...deletes.map(id=>({t:'d', id}))];
      for (let i = 0; i < ops.length; i += 400){
        const b = fb.batch();
        ops.slice(i, i + 400).forEach(o=>{
          if (o.t === 'd') b.delete(songsCol().doc(o.id));
          else { const {id, ...rest} = o.song; b.set(songsCol().doc(id), rest, {merge:false}); }
        });
        await b.commit();
      }
      writes.forEach(w=>pushed.set(w.id, w.json));
      deletes.forEach(id=>pushed.delete(id));
    }catch(e){ showSyncError(e, '書き込み'); }
  }, 900);
}

function renderSyncBar(){
  const el = document.getElementById('syncBar');
  if (!el) return;
  const label = {off:'同期していません', connecting:'接続中…', on:'同期中',
    error:'同期できません', unavailable:'この環境では同期を使えません'}[syncState] || '';
  if (syncState === 'unavailable'){ el.innerHTML = `<span class="sdot err"></span>${label}`; return; }
  const errBox = syncError
    ? `<div class="syncerr"><b>うまくいきませんでした</b>
        <code>${esc(syncError)}</code>
        <button class="mini" onclick="copyErr()">この内容をコピー</button></div>`
    : '';
  if (fbUser){
    el.innerHTML = `<span class="sdot ${syncState==='on'?'ok':'wait'}"></span>${label}
      <span class="who">${esc(fbUser.email||'')}</span>
      <button class="mini" onclick="signOutSync()">やめる</button>` + errBox;
  } else {
    el.innerHTML = `<span class="sdot ${syncState==='error'?'err':''}"></span>${label}
      <button class="mini" onclick="signIn()">Google でログインして同期する</button>` + errBox;
  }
}

  });

function newShareId(){
  const c = 'abcdefghijkmnpqrstuvwxyz23456789';
  let r = '';
  const a = new Uint8Array(14);
  crypto.getRandomValues(a);
  a.forEach(v=>r += c[v % c.length]);
  return r;
}

// 曲データから共有用の形を作る（音源は含めない）
function shareablePayload(list){
  return list.map(s=>({
    id:s.id, title:s.title||'', artist:s.artist||'', folder:s.folder||'',
    vgroup:s.vgroup||s.id, vname:s.vname||'',
    key:s.key||'', capo:s.capo||0, bpm:s.bpm||100,
    barsPerLine:s.barsPerLine||8, transpose:s.transpose||0, text:s.text||''
  }));

function shareablePlaylists(songList){
  const ids = new Set(songList.map(x=>x.id));
  return playlists
    .map(pl=>{
      const kept = pl.songs.filter(i=>ids.has(i));
      return {id:pl.id, name:pl.name, songs:kept,
              partial: kept.length < pl.songs.length, total: pl.songs.length};
    })
    .filter(pl=>pl.songs.length);
}

/* ============ 6. 描画: コード譜 ============ */
// コード1つと、その下にくる歌詞の一部分を1組にする。
// 組ごと折り返すので、画面が狭くてもコードと歌詞がずれない。
function makeSegments(chords, lyricText){
  const chars = [...(lyricText || '')];
  // 表示幅の列番号 → 歌詞の何文字目か
  const idxAt = col => {
    let w = 0, i = 0;
    while (i < chars.length && w < col){ w += charWidth(chars[i]); i++; }
    return {i, w};
  };
  const segs = [];
  const hasLyric = !!(lyricText || '').trim();
  if (!chords.length) return [{chord:null, text: lyricText || ''}];

  // 最初のコードより前にある歌詞
  if (chords[0].col > 0){
    const a = idxAt(chords[0].col);
    if (a.i > 0) segs.push({chord:null, text: chars.slice(0, a.i).join('')});
  }
  for (let k = 0; k < chords.length; k++){
    const here = idxAt(chords[k].col);
    const last = k + 1 >= chords.length;
    const nextCol = last ? null : chords[k+1].col;
    const to = last ? chars.length : idxAt(nextCol).i;
    let text = chars.slice(here.i, to).join('');
    // 次のコードまでの間隔を空白で埋める。
    // ただし空白が長すぎると1行が横に伸びるので、上限を設ける
    if (!last){
      const want = Math.min(nextCol - chords[k].col, hasLyric ? 4 : 8);
      let have = 0;
      for (const c of text) have += charWidth(c);
      if (have < want) text += ' '.repeat(want - have);
    }
    segs.push({chord: chords[k], text});
  }
  return segs;
}

// opts.lineToggle を渡すと、各行の左に「コード行/歌詞行」の切り替えが出る
function renderSheet(song, opts){
  opts = opts || {};
  const blocks = parseBody(song.text);
  const n = song.transpose || 0;
  const el = document.createElement('div');
  el.id = 'sheet';
  el.style.setProperty('--sheet-size', (song.sheetSize || 16) + 'px');

  for (const b of blocks){
    if (b.blank){
      const sp = document.createElement('div');
      sp.className = 'spacer';
      el.appendChild(sp);
      continue;
    }
    const blk = document.createElement('div');
    blk.className = 'blk';
    if (opts.lineToggle){
      blk.classList.add('withtg');
      const line = b.chords.length ? b.srcLine
                 : (b.lyrics[0] && b.lyrics[0].srcLine);
      if (line != null){
        blk.appendChild(toggleBtn(line, b.chords.length > 0, opts.lineToggle,
          b.chords.length ? '' : (b.lyrics[0] && b.lyrics[0].text)));
      }
    }

    if (b.chords.length){
      const row = document.createElement('div');
      row.className = 'pairrow';
      const first = (b.lyrics[0] && b.lyrics[0].text) || '';
      for (const sg of makeSegments(b.chords, first)){
        const seg = document.createElement('span');
        seg.className = 'seg';
        const top = document.createElement('span');
        top.className = 'sc';
        if (sg.chord){
          const c = sg.chord;
          top.classList.add(c.kind);
          top.textContent = c.kind === 'c' ? transposeChord(c.disp || c.text, n) : c.text;
          if (c.kind === 'c'){
            const forLookup = transposeChord(c.text, n);
            top.tabIndex = 0;
            top.onclick = ()=>showChord(forLookup);
            top.onkeydown = e=>{ if (e.key === 'Enter') showChord(forLookup); };
          }
        }
        const bot = document.createElement('span');
        bot.className = 'sl';
        bot.textContent = sg.text;
        seg.appendChild(top);
        seg.appendChild(bot);
        row.appendChild(seg);
      }
      blk.appendChild(row);
      // 2行目以降の歌詞（同じコードで歌う替わりの歌詞）
      for (let i = 1; i < b.lyrics.length; i++){
        const lr = document.createElement('div');
        lr.className = 'lrow extra';
        lr.textContent = b.lyrics[i].text;
        blk.appendChild(lr);
      }
    } else {
      for (const L of b.lyrics){
        const lr = document.createElement('div');
        lr.className = 'lrow';
        lr.textContent = L.text;
        blk.appendChild(lr);
      }
    }
    el.appendChild(blk);
  }
  return el;
}

// 行の左に置く切り替えボタン。コードらしい行ほど目立たせる
function toggleBtn(srcLine, isChord, cb, text){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'lntg' + (isChord ? ' on' : (looksChordish(text) ? ' hint' : ''));
  b.textContent = isChord ? '♪' : '＋';
  b.title = isChord ? 'この行を歌詞に戻す' : 'この行をコード行にする';
  b.setAttribute('aria-label', b.title);
  b.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); cb(srcLine); };
  return b;
}
// コードが混ざっていそうな行か（ボタンを目立たせる判断に使う）
function looksChordish(text){
  if (!text) return false;
  if (/[ぁ-んァ-ヶ一-龠]/.test(text)) return false;
  const toks = tokenize(text);
  if (!toks.length) return false;
  const nc = toks.filter(t=>{
    if (t.joined) return true;
    const c = classify(t.raw); return c && c.kind === 'c';
  }).length;
  return nc >= 1;
}

// めくる並びのなかに、開こうとしている曲を置く。
// 同じ曲の別バージョンがその並びに居るなら、そこへ差し替える
function alignNav(id){
  const me = songs.find(x=>x.id===id);
  if (!me || navIds.includes(id)) return;
  const k = groupKey(me);
  const sameGroup = n => { const x = songs.find(y=>y.id===n); return x && groupKey(x) === k; };
  let at = navIds.findIndex(sameGroup);
  if (at < 0){

}

// 前（-1）／次（+1）の曲へ。並びは曲を開いたときのリスト順
function songStep(d){
  if (!openSong) return;

  const i = navIds.indexOf(openSong);
  if (i < 0) return;
  const j = i + d;
  if (j < 0){ alertShare('このリストの最初の曲です'); return; }
  if (j >= navIds.length){ alertShare('このリストの最後の曲です'); return; }
  stopScroll(); stopSongRec();
  openSong = navIds[j];

// 指でなぞって離したときに、動かした距離と速さで判定する
function bindSwipe(el){
  let x0 = null, y0 = null, t0 = 0, lock = false;
  const reset = ()=>{ el.style.transition='transform .18s ease'; el.style.transform=''; x0=null; };
  el.addEventListener('touchstart', e=>{
    if (e.touches.length !== 1){ x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    t0 = Date.now(); lock = false;
    el.style.transition = 'none';
  }, {passive:true});
  el.addEventListener('touchmove', e=>{
    if (x0 === null) return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    // 横に 10px 以上、かつ縦より明らかに横が大きいときだけ横スワイプとみなす
    if (!lock && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.4) lock = true;
    if (lock){
      if (e.cancelable) e.preventDefault();
      el.style.transform = 'translateX(' + (dx * 0.32).toFixed(1) + 'px)';
    }
  }, {passive:false});
  el.addEventListener('touchend', e=>{
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dt = Date.now() - t0;
    const go = lock && (Math.abs(dx) > 58 || (dt < 400 && Math.abs(dx) > 32));
    reset();
    if (go) songStep(dx < 0 ? 1 : -1);
  }, {passive:true});
  el.addEventListener('touchcancel', reset, {passive:true});
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============ バージョン（同じ曲の別アレンジ） ============ */
// 同じ vgroup を持つ曲どうしが「同じ曲の別バージョン」
function groupKey(s){ return (s && (s.vgroup || s.id)) || ''; }
function versionsOf(s){ const k = groupKey(s); return songs.filter(x=>groupKey(x) === k); }

// 楽曲リストには、まとまりごとに1曲だけ出す（最後に開いたバージョン）
function groupReps(){
  const best = new Map();
  for (const s of songs){
    const k = groupKey(s), cur = best.get(k);
    if (!cur || (s.lastOpen||0) > (cur.lastOpen||0)) best.set(k, s);
  }
  const seen = new Set(), out = [];
  for (const s of songs){
    const k = groupKey(s);
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(best.get(k) || s);
  }
  return out;
}

// 歌詞だけを取り出して比べる。コード行・空白・記号は落とす
function lyricFingerprint(text){
  return String(text||'').replace(/\r\n/g,'\n').split('\n')
    .filter(L=>L.trim() && !isChordLine(L))
    .map(L=>L.normalize('NFKC').replace(/[\s\u3000！-／：-＠［-｀｛-～、-〜()（）「」『』。、,.!?・…ー—–-]/g,''))
    .filter(Boolean);
}
// 2文字ずつの並びを数える。改行の位置がずれていても比べられるようにするため
function charPairs(str){
  const m = new Map();
  const a = [...str];
  for (let i = 0; i + 1 < a.length; i++){
    const g = a[i] + a[i+1];
    m.set(g, (m.get(g)||0) + 1);
  }
  return m;
}
// 歌詞がどれくらい同じかを 0〜1 で出す
function lyricSimilarity(aText, bText){
  const A = lyricFingerprint(aText), B = lyricFingerprint(bText);
  const ja = A.join(''), jb = B.join('');
  // 行の切れ目が違うだけの行は「違う」に数えない（相手の歌詞のどこかに入っていれば同じ扱い）
  const onlyA = A.filter(L => L.length > 1 && !jb.includes(L));
  const onlyB = B.filter(L => L.length > 1 && !ja.includes(L));
  let ratio;
  if (!ja && !jb) ratio = 1;
  else if (!ja || !jb) ratio = 0;
  else if ([...ja].length < 2 || [...jb].length < 2) ratio = ja === jb ? 1 : 0;
  else {
    const PA = charPairs(ja), PB = charPairs(jb);
    let inter = 0, total = 0;
    PA.forEach((n, g)=>{ total += n; inter += Math.min(n, PB.get(g) || 0); });
    PB.forEach(n=>{ total += n; });
    ratio = (2 * inter) / total;
  }
  return {ratio, onlyA, onlyB};
}
// 一致率から、おすすめの扱いと言い方を決める
function dupVerdict(pct){
  if (pct >= 70) return {mode:'version', note:'歌詞はほぼ同じです。同じ曲の別アレンジとみてよさそうです。'};
  if (pct >= 30) return {mode:'version', note:'歌詞の一部が同じです。歌い回しを変えた別バージョンかもしれません。'};
  return {mode:'separate', note:'曲名は同じですが歌詞はかなり違います。別の曲かもしれません。'};
}

// 曲名をゆるく揃えて比べる（全角半角・空白・記号の違いは無視）
function titleKey(t){
  return String(t||'').normalize('NFKC').toLowerCase()
    .replace(/[\s\u3000~～!！?？.。,、'"“”‘’()（）\[\]「」【】_\-–—]/g,'');
}
// 取り込もうとしている曲が、すでにある曲と同じ名前かどうか調べる
function findDuplicate(title, text, excludeGroup){
  const tk = titleKey(title);
  if (!tk) return null;
  const reps = groupReps().filter(x=>titleKey(x.title) === tk && groupKey(x) !== excludeGroup);
  if (!reps.length) return null;
  let best = null;
  for (const r of reps){
    for (const v of versionsOf(r)){
      const sim = lyricSimilarity(text, v.text);
      if (!best || sim.ratio > best.sim.ratio) best = {song:v, rep:r, sim};
    }
  }
  return best;
}
// バージョン名が重ならないようにする
function uniqueVersionName(groupId, want){
  const used = new Set(songs.filter(x=>groupKey(x)===groupId).map(x=>(x.vname||'').trim()).filter(Boolean));
  let base = String(want||'').trim();
  if (!base){
    let n = songs.filter(x=>groupKey(x)===groupId).length + 1;
    while (used.has('バージョン' + n)) n++;
    return 'バージョン' + n;
  }
  if (!used.has(base)) return base;
  let n = 2;
  while (used.has(base + ' (' + n + ')')) n++;
  return base + ' (' + n + ')';
}

/* ============ 8. 操作 ============ */
function tr(n){ const s=songs.find(x=>x.id===openSong); s.transpose=(s.transpose||0)+n; persist(); render(); }
function capo(n){ const s=songs.find(x=>x.id===openSong); s.capo=Math.max(0,Math.min(9,(s.capo||0)+n)); persist(); render(); }
function setBpm(v){
  const s=songs.find(x=>x.id===openSong); s.bpm=+v;
  document.getElementById('bpmOut').textContent = v+' BPM';
  const st = document.querySelector('.stat'); if (st) st.children[1].innerHTML = `1行あたり <b>${(60/s.bpm*s.barsPerLine*4).toFixed(1)}</b> 秒`;
  persist();
}
function toggleScroll(){ scrolling ? stopScroll() : startScroll(); }
function startScroll(){
  const s=songs.find(x=>x.id===openSong); if(!s) return;
  scrolling = true;
  const main = document.getElementById('main');
  const pxPerSec = (s.bpm/60) * 9;  // 目安
  let last = performance.now(), acc = 0;
  const step = (t)=>{
    if (!scrolling) return;
    acc += (t-last)/1000 * pxPerSec; last = t;
    if (acc >= 1){ main.scrollTop += Math.floor(acc); acc -= Math.floor(acc); }
    if (main.scrollTop + main.clientHeight >= main.scrollHeight - 1){ stopScroll(); return; }
    scrollTimer = requestAnimationFrame(step);
  };
  scrollTimer = requestAnimationFrame(step);
  const b = document.getElementById('scrollBtn'); if (b) b.textContent='停止';
}
function stopScroll(){
  scrolling = false;
  if (scrollTimer) cancelAnimationFrame(scrollTimer);
  const b = document.getElementById('scrollBtn'); if (b) b.textContent='自動スクロール';
}
document.getElementById('main').addEventListener('touchstart', ()=>{ if(scrolling) stopScroll(); }, {passive:true});

// パソコンでは ← → キーでも前後の曲へ移動できる
document.addEventListener('keydown', e=>{
  if (!openSong || editing) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  const dlg = document.getElementById('pop');
  if (dlg && !dlg.hidden) return;
  e.preventDefault();
  songStep(e.key === 'ArrowRight' ? 1 : -1);
});



/* ---- 書き出し ---- */
function download(name, text){
  const blob = new Blob([text], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function songToMd(s){
  const fm = ['---', 'title: ' + s.title, 'artist: ' + (s.artist||''),
    ...((s.vname||'').trim() ? ['version: ' + s.vname.trim()] : []),
    'key: ' + (s.key||''), 'capo: ' + (s.capo||0), 'bpm: ' + (s.bpm||''),
    'transpose: ' + (s.transpose||0), 'folder: ' + (s.folder||'未分類'),
    'updated: ' + new Date().toISOString(), 'format: 1', '---', '', ''].join('\n');
  return fm + s.text + '\n';
}
function safeName(t){ return String(t).replace(/[\\/:*?"<>|]/g,'_').slice(0,80); }
function exportFileName(s){

  return safeName(s.title || '無題') + (v ? ' - ' + safeName(v) : '');

// 複数の曲をまとめて1つの zip にする
async function zipSongs(items, name){
  if (typeof JSZip === 'undefined'){ items.forEach(s=>exportSong(s.id)); return; }
  const zip = new JSZip(), dir = zip.folder(safeName(name));
  const used = new Set();
  items.forEach(s=>{
    const base = exportFileName(s);
    let fn = base, n = 2;
    while (used.has(fn)){ fn = base + ' (' + (n++) + ')'; }
    used.add(fn);
    dir.file(fn + '.md', songToMd(s));
  });
  const blob = await zip.generateAsync({type:'blob'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = safeName(name) + '.zip';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  alertShare(items.length + '曲を書き出しました');
}

// そのキーでよく使うコードを並べる
function paletteFor(keyStr){
  const m = String(keyStr||'C').trim().match(/^([A-G][#b]?)\s*(m|min|minor)?/i);
  const root = m ? (FLATEQ[m[1]] || m[1]) : 'C';
  const minor = !!(m && m[2]);
  const r = pc(root); if (r < 0) return {main:['C','Dm','Em','F','G','Am'], extra:[]};
  // フラット系のキーは ♭ 表記で出す
  const FLATN = {1:'Db', 3:'Eb', 6:'Gb', 8:'Ab', 10:'Bb'};
  const useFlat = /b/.test(m ? m[1] : '') ||
    (!minor && [5,10,3,8,1].includes(r)) || (minor && [2,7,0,5,10].includes(r));
  const name = n => { const i = (r + n + 12) % 12;
    return (useFlat && FLATN[i]) ? FLATN[i] : SHARP[i]; };
  const at = (n, q) => name(n) + q;
  const main = minor
    ? [at(0,'m'), at(3,''), at(5,'m'), at(7,'m'), at(8,''), at(10,''), at(2,'dim')]
    : [at(0,''), at(2,'m'), at(4,'m'), at(5,''), at(7,''), at(9,'m'), at(11,'dim')];
  const extra = minor
    ? [at(7,'7'), at(0,'m7'), at(3,'maj7'), at(5,'m7'), at(8,'maj7')]
    : [at(7,'7'), at(0,'maj7'), at(9,'m7'), at(5,'maj7'), at(7,'sus4'), at(2,'7')];
  return {main, extra};
}

// 本文のカーソル位置にコードを差し込む
function insertChord(txt){
  const ta = document.getElementById('eText') || document.getElementById('draftText');
  if (!ta) return;
  const a = ta.selectionStart, b = ta.selectionEnd;
  const before = ta.value.slice(0, a);
  const ins = (before && !/[\s\u3000]$/.test(before) && a === b) ? ' ' + txt : txt;
  ta.value = before + ins + ta.value.slice(b);
  const pos = a + ins.length;
  ta.selectionStart = ta.selectionEnd = pos;
  ta.focus();
  ta.dispatchEvent(new Event('input', {bubbles:true}));
}

// 一番長い行が収まるまで文字を少しずつ小さくする（横スクロールを出さないため）
function fitSheet(box){
  const sheet = box.querySelector('#sheet');
  if (!sheet) return;
  const avail = box.clientWidth - 44;
  if (avail <= 0) return;
  let size = 16;
  sheet.style.setProperty('--sheet-size', size + 'px');
  for (let i = 0; i < 14; i++){
    let widest = 0;
    sheet.querySelectorAll('.lrow, .crow').forEach(r=>{
      const w = r.scrollWidth || 0;
      if (w > widest) widest = w;
    });
    if (widest <= avail || size <= 9) break;
    size = Math.max(9, size - 1);
    sheet.style.setProperty('--sheet-size', size + 'px');
  }
}

// その行をコード行にする／歌詞行に戻す（本文の先頭の @ を付け外しする）
function toggleLineAt(i){
  const ta = document.getElementById('eText') || document.getElementById('bText');
  if (!ta) return;
  const lines = ta.value.replace(/\r\n/g,'\n').split('\n');
  if (i < 0 || i >= lines.length) return;
  lines[i] = /^[@＠]/.test(lines[i])
    ? lines[i].replace(/^[@＠]\s?/, '')
    : '@' + lines[i];
  ta.value = lines.join('\n');
  ta.dispatchEvent(new Event('input', {bubbles:true}));
}

// 上下（または左右）のスクロールを合わせる
let _syncing = false;
function syncScroll(fromId, toId){
  if (_syncing) return;
  const a = document.getElementById(fromId), b = document.getElementById(toId);
  if (!a || !b) return;
  const ra = a.scrollHeight - a.clientHeight;
  const rb = b.scrollHeight - b.clientHeight;
  if (ra <= 0 || rb <= 0) return;
  _syncing = true;
  b.scrollTop = (a.scrollTop / ra) * rb;
  requestAnimationFrame(()=>{ _syncing = false; });
}

let tidyRekey = false;

// 何が変わるかを先に出す（まだ保存はしない）
function tidyPlan(){
  const out = [];
  songs.forEach(s=>{
    const p = parseSheet(s.text || '');
    const next = {...s}, why = [];
    if (p.body && p.body !== s.text){
      next.text = p.body;
      const before = (s.text||'').split('\n').length;
      const after  = p.body.split('\n').length;
      why.push('本文から曲情報の行を外す（' + before + '行 → ' + after + '行）');
    }
    if (!s.artist && p.artist){ next.artist = p.artist; why.push('アーティスト: ' + p.artist); }
    if (!s.capo && p.capo){ next.capo = p.capo; why.push('カポ: ' + p.capo); }
    if (!s.bpm && p.bpm){ next.bpm = p.bpm; why.push('テンポ: ' + p.bpm); }
    if (!s.key && p.key){ next.key = p.key; why.push('キー: ' + p.key); }
    else if (tidyRekey && p.key && p.key !== s.key){
      next.key = p.key;
      why.push('キー: ' + (s.key||'—') + ' → ' + p.key + (p.keyGuessed ? '（推測）' : ''));
    }
    if (why.length) out.push({id:s.id, title:s.title, next, why});
  });
  return out;
}

function openTidy(){
  if (isViewer) return;
  const plan = tidyPlan();
  document.getElementById('popName').textContent = '読み込み済みの曲を整理する';
  document.getElementById('popDesc').textContent =
    plan.length ? `${plan.length} 曲に変更があります。` : '変更が必要な曲はありません。';
  document.getElementById('popGrid').innerHTML = `<div style="flex:1 1 100%">
    <label class="brow" style="margin-bottom:12px">
      <input type="checkbox" ${tidyRekey?'checked':''} onchange="tidyRekey=this.checked;openTidy()">
      <span class="bn">キーも推測し直す
        <div class="bf">自分で設定したキーも、譜面のコードから付け直します</div></span>
    </label>
    ${plan.length ? `<div class="tidylist">` + plan.map(x=>`
        <div class="shrow" style="display:block">
          <b style="font-size:.86rem">${esc(x.title || '(曲名なし)')}</b>
          <div class="sf" style="margin-top:3px">${x.why.map(esc).join('<br>')}</div>
        </div>`).join('') + `</div>` : ''}
    <div class="btnrow" style="margin-top:12px">
      ${plan.length ? '<button class="act" onclick="applyTidy()">整理する</button>' : ''}
      <button class="ghost" onclick="closePop()">${plan.length?'やめる':'閉じる'}</button>
    </div>

  </div>`;
  document.getElementById('pop').hidden = false;
}

function applyTidy(){
  const plan = tidyPlan();
  if (!plan.length) return;
  const byId = new Map(plan.map(x=>[x.id, x.next]));
  songs = songs.map(s=>{

/* ---- 指でつかんで並べ替える ---- */
function enableReorder(){
  const box = document.getElementById('plBox');
  if (!box) return;
  let dragEl = null, startY = 0, placeholder = null;

  box.querySelectorAll('.r.drag').forEach(row=>{
    const grip = row.querySelector('.grip');
    if (!grip) return;
    grip.style.touchAction = 'none';
    grip.addEventListener('pointerdown', e=>{
      e.preventDefault();
      dragEl = row; startY = e.clientY;
      row.setPointerCapture?.(e.pointerId);
      row.classList.add('dragging');
      placeholder = document.createElement('div');
      placeholder.className = 'ph-slot';
      placeholder.style.height = row.offsetHeight + 'px';
      row.after(placeholder);
      row.style.position = 'fixed';
      row.style.width = box.offsetWidth + 'px';
      row.style.zIndex = 40;
      const r = row.getBoundingClientRect();
      row._dy = e.clientY - r.top;
      row.style.top = (e.clientY - row._dy) + 'px';
      row.style.left = box.getBoundingClientRect().left + 'px';

      const move = ev=>{
        if (!dragEl) return;
        ev.preventDefault();
        dragEl.style.top = (ev.clientY - dragEl._dy) + 'px';
        const rows = [...box.querySelectorAll('.r:not(.dragging)')];
        let placed = false;
        for (const other of rows){
          const b = other.getBoundingClientRect();
          if (ev.clientY < b.top + b.height / 2){
            other.before(placeholder); placed = true; break;
          }
        }
        if (!placed) box.appendChild(placeholder);
      };
      const up = ()=>{
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        document.removeEventListener('pointercancel', up);
        if (!dragEl) return;
        placeholder.replaceWith(dragEl);
        dragEl.classList.remove('dragging');
        dragEl.style.cssText = '';
        dragEl = null;
        // 画面の並びをデータに書き戻す
        const pl = playlists.find(x=>x.id===openList);
        if (pl){
          const order = [...box.querySelectorAll('.r')].map(r=>r.dataset.id).filter(Boolean);
          if (order.length === pl.songs.length) pl.songs = order;
          persistMeta();
        }
        render();
      };
      document.addEventListener('pointermove', move, {passive:false});
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', up);
    });
  });
}

/* ---- フォルダ一括読み込み ---- */
function readText(file){
